[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-plugin-sprites"
version = "0.1.0"
description = "Standalone Fly.io Sprites terminal backend for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Kyle McLaren" },
  { name = "Nous Research contributors" },
]
dependencies = [
  "sprites-py>=0.5.0,<0.6",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/NousResearch/hermes-agent/pull/93523"
"Hermes provider API" = "https://github.com/NousResearch/hermes-agent/pull/94400"

[project.entry-points."hermes_agent.plugins"]
sprites = "hermes_plugin_sprites:register"

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pyyaml>=6,<7",
]

[tool.setuptools.packages.find]
include = ["hermes_plugin_sprites*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: live Sprites API tests; requires SPRITES_TOKEN",
]
addopts = "-ra"
