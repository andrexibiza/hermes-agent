name: Verify PR 91111 authority fixes

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-pr-91111.yml

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR 91111 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: campaign/hermes-tag-kernel

      - name: Resolve exact target
        id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.1.1
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest pytest-asyncio pyyaml ruff

      - name: Run exact focused verification
        id: verify
        shell: bash
        run: |
          set +e
          python -m compileall -q gateway/hermes_tag tests/gateway/hermes_tag
          compile_rc=$?
          python -m ruff check gateway/hermes_tag tests/gateway/hermes_tag
          ruff_rc=$?
          python -m pytest -q -o addopts= tests/gateway/hermes_tag
          pytest_rc=$?
          if [ "$compile_rc" -eq 0 ] && [ "$ruff_rc" -eq 0 ] && [ "$pytest_rc" -eq 0 ]; then
            state=success
          else
            state=failure
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "description=compile=$compile_rc ruff=$ruff_rc pytest=$pytest_rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish exact-head status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          STATE: ${{ steps.verify.outputs.state }}
          DESCRIPTION: ${{ steps.verify.outputs.description }}
        run: |
          python - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "hermes-tag-authority/focused",
              "description": os.environ["DESCRIPTION"],
              "target_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            --data-binary @/tmp/status.json

      - name: Fail verifier when checks failed
        if: steps.verify.outputs.state != 'success'
        run: exit 1
