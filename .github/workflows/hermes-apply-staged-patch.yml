name: Hermes apply staged patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-task10:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Task 10 branch
        uses: actions/checkout@v4
        with:
          ref: campaign/webhook-task10-fanout
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .hermes-patches/task10/part*.patch > /tmp/task10.patch
          echo "6db360799eec591e6b4fc0aa6350d7de5208ca62485ee0d7f5b3700ac3459b1d  /tmp/task10.patch" | sha256sum -c -
          git apply --check /tmp/task10.patch
          git apply /tmp/task10.patch
          rm -rf .hermes-patches
          git diff --check
          python -m py_compile gateway/platforms/webhook.py tests/gateway/test_webhook_adapter.py tests/gateway/test_webhook_task10_closure.py

      - name: Focused Task 10 verification
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/gateway/test_webhook_adapter.py \
            tests/gateway/test_webhook_task10_closure.py \
            tests/gateway/test_webhook_http_contract.py \
            tests/gateway/test_webhook_intake_hardening.py

      - name: Commit verified closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Axl Ibiza"
          git config user.email "andrexibiza@gmail.com"
          git add -A
          git commit -m "fix(webhook): close Task 10 intake contract"
          git push origin HEAD:campaign/webhook-task10-fanout
