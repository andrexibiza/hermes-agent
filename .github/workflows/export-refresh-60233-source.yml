name: Export refresh 60233 source

on:
  push:
    branches:
      - tmp/refresh-60233-source

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact tracked tree
        run: git archive --format=tar.gz --output=/tmp/hermes-agent-91895.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-agent-91895-source
          path: /tmp/hermes-agent-91895.tar.gz
          if-no-files-found: error
          retention-days: 1
