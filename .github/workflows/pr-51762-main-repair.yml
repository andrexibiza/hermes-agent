name: PR 51762 trusted contract repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pr-51762-main-repair.yml

permissions:
  contents: write

jobs:
  repair:
    name: Repair and settle PR 51762 materializer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_BRANCH: materialize/pr-51762-base-891ec3fb
      FEATURE_WORKFLOW: .github/workflows/pr-51762-contract-fix.yml
      MAIN_WORKFLOW: .github/workflows/pr-51762-main-repair.yml
    steps:
      - name: Check out materializer branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Apply exact German tab-strip contract migration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/desktop/src/i18n/de.ts')
          source = path.read_text(encoding='utf-8')
          old = "    showHeader: 'Header anzeigen',\n    hideHeader: 'Header ausblenden',"
          new = "    showTabStrip: 'Tabs anzeigen',\n    hideTabStrip: 'Tabs ausblenden',"

          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one stale German tab-strip pair, found {source.count(old)}')
          if 'showTabStrip:' in source or 'hideTabStrip:' in source:
              raise SystemExit('current German tab-strip keys already exist; refusing an ambiguous rewrite')

          path.write_text(source.replace(old, new), encoding='utf-8')
          PY

          git rm "$FEATURE_WORKFLOW"
          git diff --check
          EXPECTED=$'.github/workflows/pr-51762-contract-fix.yml\napps/desktop/src/i18n/de.ts'
          test "$(git diff --name-only | sort)" = "$EXPECTED"
          test "$(git diff --numstat -- apps/desktop/src/i18n/de.ts)" = $'2\t2\tapps/desktop/src/i18n/de.ts'

      - name: Commit exact repair to materializer branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(desktop): align German tab-strip locale keys"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Remove this one-shot workflow from fork main
        run: |
          git fetch origin main
          git switch -C main origin/main
          git rm "$MAIN_WORKFLOW"
          git commit -m "chore(ci): remove PR 51762 one-shot repair"
          git push origin main
