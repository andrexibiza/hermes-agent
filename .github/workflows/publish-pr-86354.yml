name: Publish #86354 endpoint-scoped app-password repair (temporary)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: publish-pr-86354
  cancel-in-progress: false

jobs:
  publish:
    name: Publish exact two-file #86354 product diff
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/email-app-password-normalization' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Rebuild, verify, and publish the normal reviewable diff
        shell: bash
        env:
          CURRENT_MAIN: b6bcb3e791c673e63974029bbab40cc9326803ff
          TARGET_BRANCH: fix/email-app-password-normalization
        run: |
          set -euo pipefail
          trigger_head="$(git rev-parse HEAD)"
          test "$trigger_head" = "${{ github.event.pull_request.head.sha }}"

          if [[ ! -f .github/workflows/one-shot-fix-86354.yml ]]; then
            echo "#86354 carrier absent; product branch is already materialized"
            exit 0
          fi

          git fetch --no-tags https://github.com/NousResearch/hermes-agent.git "$CURRENT_MAIN"
          test "$(git rev-parse FETCH_HEAD)" = "$CURRENT_MAIN"
          git reset --hard "$CURRENT_MAIN"
          test "$(git hash-object plugins/platforms/email/adapter.py)" = 704524e4efcb93a44d61187d2d0e6a495425266b
          test "$(git hash-object tests/gateway/test_email.py)" = e0ea57ce3bc1f76597175aea9b973acc54945699

          cat > /tmp/pr86354.patch <<'PATCH'
          diff --git a/plugins/platforms/email/adapter.py b/plugins/platforms/email/adapter.py
          index 704524e..5e3be96 100644
          --- a/plugins/platforms/email/adapter.py
          +++ b/plugins/platforms/email/adapter.py
          @@ -238,6 +238,39 @@ def check_email_requirements() -> bool:
               return all([addr, pwd, imap, smtp])
           
           
          +_APP_PASSWORD_DISPLAY_RE = re.compile(
          +    r"^[A-Za-z0-9]{4} [A-Za-z0-9]{4} [A-Za-z0-9]{4} [A-Za-z0-9]{4}$"
          +)
          +_GOOGLE_APP_PASSWORD_DOMAINS = ("gmail.com", "googlemail.com")
          +
          +
          +def _is_google_auth_endpoint(host: str) -> bool:
          +    """Return whether an IMAP/SMTP host is a Google mail endpoint.
          +
          +    Match on DNS-label boundaries so ``smtp.gmail.com`` and
          +    ``imap.googlemail.com`` qualify, while lookalikes such as
          +    ``smtp.gmail.com.evil.example`` and ``evilgmail.com`` do not.
          +    """
          +    normalized = str(host or "").strip().lower().rstrip(".")
          +    return any(
          +        normalized == domain or normalized.endswith(f".{domain}")
          +        for domain in _GOOGLE_APP_PASSWORD_DOMAINS
          +    )
          +
          +
          +def _password_for_auth_endpoint(value: str, host: str) -> str:
          +    """Return the wire credential authorized by the selected endpoint.
          +
          +    Google displays app passwords as four groups of four ASCII alphanumerics,
          +    but its IMAP/SMTP LOGIN endpoints expect the compact value. Credential
          +    shape alone is not mutation authority: preserve every byte for non-Google
          +    endpoints and for values that are not the exact Google display form.
          +    """
          +    if _is_google_auth_endpoint(host) and _APP_PASSWORD_DISPLAY_RE.fullmatch(value):
          +        return value.replace(" ", "")
          +    return value
          +
          +
