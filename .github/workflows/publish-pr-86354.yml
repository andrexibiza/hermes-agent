          diff --git a/tests/gateway/test_email.py b/tests/gateway/test_email.py
          index e0ea57c..534aafa 100644
          --- a/tests/gateway/test_email.py
          +++ b/tests/gateway/test_email.py
          @@ -57,6 +57,190 @@ class TestCheckRequirements(unittest.TestCase):
                   self.assertTrue(check_email_requirements())
           
           
          +class TestEndpointScopedAppPassword(unittest.TestCase):
          +    """Credential mutation is authorized by the selected mail endpoint."""
          +
          +    RAW = "abcd efgh ijkl mnop"
          +
          +    def _make_adapter(self, *, imap_host: str, smtp_host: str):
          +        from gateway.config import PlatformConfig
          +        from plugins.platforms.email.adapter import EmailAdapter
          +
          +        env = {
          +            "EMAIL_ADDRESS": "hermes@example.com",
          +            "EMAIL_PASSWORD": self.RAW,
          +            "EMAIL_IMAP_HOST": imap_host,
          +            "EMAIL_SMTP_HOST": smtp_host,
          +        }
          +        with patch.dict(os.environ, env, clear=False):
          +            return EmailAdapter(PlatformConfig(enabled=True))
          +
          +    def test_google_dns_label_boundaries(self):
          +        from plugins.platforms.email.adapter import _is_google_auth_endpoint
          +
          +        accepted = (
          +            "gmail.com",
          +            "SMTP.GMAIL.COM",
          +            "imap.gmail.com.",
          +            "googlemail.com",
          +            "imap.googlemail.com",
          +        )
          +        rejected = (
          +            "evilgmail.com",
          +            "gmail.com.evil.example",
          +            "example.com",
          +            "",
          +        )
          +        for host in accepted:
          +            with self.subTest(host=host):
          +                self.assertTrue(_is_google_auth_endpoint(host))
          +        for host in rejected:
          +            with self.subTest(host=host):
          +                self.assertFalse(_is_google_auth_endpoint(host))
          +
          +    def test_exact_google_display_form_is_compacted(self):
          +        from plugins.platforms.email.adapter import _password_for_auth_endpoint
          +
          +        self.assertEqual(
          +            _password_for_auth_endpoint(self.RAW, "imap.gmail.com"),
          +            "abcdefghijklmnop",
          +        )
          +        self.assertEqual(
          +            _password_for_auth_endpoint(self.RAW, "smtp.googlemail.com"),
          +            "abcdefghijklmnop",
          +        )
          +
          +    def test_non_google_same_shaped_credential_is_byte_preserved(self):
          +        from plugins.platforms.email.adapter import _password_for_auth_endpoint
          +
          +        self.assertEqual(
          +            _password_for_auth_endpoint(self.RAW, "imap.example.com"),
          +            self.RAW,
          +        )
          +        self.assertEqual(
          +            _password_for_auth_endpoint(self.RAW, "smtp.gmail.com.evil"),
          +            self.RAW,
          +        )
          +
          +    def test_nonmatching_credentials_preserve_outer_and_inner_whitespace(self):
          +        from plugins.platforms.email.adapter import _password_for_auth_endpoint
          +
          +        for raw in (
          +            "  abcd efgh ijkl mnop  ",
          +            "my pass word with spaces",
          +            "\tabcd efgh ijkl mnop\n",
          +        ):
          +            with self.subTest(raw=repr(raw)):
          +                self.assertEqual(
          +                    _password_for_auth_endpoint(raw, "smtp.gmail.com"), raw
          +                )
          +                self.assertEqual(
          +                    _password_for_auth_endpoint(raw, "smtp.example.com"), raw
          +                )
          +
          +    def test_adapter_stores_credential_verbatim(self):
          +        raw = "  abcd efgh ijkl mnop  "
          +        env = {
          +            "EMAIL_ADDRESS": "hermes@example.com",
          +            "EMAIL_PASSWORD": raw,
          +            "EMAIL_IMAP_HOST": "imap.gmail.com",
          +            "EMAIL_SMTP_HOST": "smtp.example.com",
          +        }
          +        from gateway.config import PlatformConfig
          +        from plugins.platforms.email.adapter import EmailAdapter
          +
          +        with patch.dict(os.environ, env, clear=False):
          +            adapter = EmailAdapter(PlatformConfig(enabled=True))
          +        self.assertEqual(adapter._password, raw)
          +
          +    def test_mixed_provider_smtp_preserves_non_google_credential(self):
          +        adapter = self._make_adapter(
          +            imap_host="imap.gmail.com", smtp_host="smtp.example.com"
          +        )
          +        smtp = MagicMock()
          +        with patch.object(adapter, "_connect_smtp", return_value=smtp):
          +            adapter._send_email("user@example.com", "hello")
          +        smtp.login.assert_called_once_with("hermes@example.com", self.RAW)
          +
          +    def test_mixed_provider_imap_compacts_only_google_credential(self):
          +        adapter = self._make_adapter(
          +            imap_host="imap.gmail.com", smtp_host="smtp.example.com"
          +        )
          +        imap = MagicMock()
          +        imap.uid.return_value = ("OK", [b""])
          +        with patch("imaplib.IMAP4_SSL", return_value=imap):
          +            self.assertEqual(adapter._fetch_new_messages(), [])
          +        imap.login.assert_called_once_with(
          +            "hermes@example.com", "abcdefghijklmnop"
          +        )
          +
          +    def test_standalone_uses_resolved_smtp_host_for_normalization(self):
          +        import asyncio
          +        from types import SimpleNamespace
          +
          +        from plugins.platforms.email.adapter import _standalone_send
          +
          +        env = {
          +            "EMAIL_PASSWORD": self.RAW,
          +            "EMAIL_SMTP_HOST": "smtp.example.com",
          +            "EMAIL_SMTP_PORT": "587",
          +        }
          +        pconfig = SimpleNamespace(
          +            token=None,
          +            api_key=None,
          +            extra={
          +                "address": "hermes@example.com",
          +                "smtp_host": "smtp.gmail.com",
          +            },
          +        )
          +        with patch.dict(os.environ, env, clear=False), patch(
          +            "smtplib.SMTP"
          +        ) as mock_smtp:
          +            server = MagicMock()
          +            mock_smtp.return_value = server
          +            result = asyncio.run(
          +                _standalone_send(pconfig, "user@example.com", "hello")
          +            )
          +        self.assertTrue(result["success"])
          +        server.login.assert_called_once_with(
          +            "hermes@example.com", "abcdefghijklmnop"
          +        )
          +
          +    def test_every_login_boundary_uses_endpoint_qualified_helper(self):
          +        import ast
          +        import inspect
          +
          +        import plugins.platforms.email.adapter as email_adapter
          +
          +        tree = ast.parse(inspect.getsource(email_adapter))
          +        observed = []
          +        for node in ast.walk(tree):
          +            if not isinstance(node, ast.Call):
          +                continue
          +            if not isinstance(node.func, ast.Attribute):
          +                continue
          +            if node.func.attr != "login" or len(node.args) < 2:
          +                continue
          +            observed.append((ast.unparse(node.func.value), ast.unparse(node.args[1])))
          +
          +        self.assertEqual(len(observed), 7)
          +        expected_hosts = {
          +            "imap": "self._imap_host",
          +            "smtp": "self._smtp_host",
          +            "server": "smtp_host",
          +        }
          +        for receiver, password_expr in observed:
          +            with self.subTest(receiver=receiver, expression=password_expr):
          +                self.assertIn(receiver, expected_hosts)
          +                expected_password = (
          +                    f"_password_for_auth_endpoint(self._password, "
          +                    f"{expected_hosts[receiver]})"
          +                    if receiver != "server"
          +                    else "_password_for_auth_endpoint(password, smtp_host)"
          +                )
          +                self.assertEqual(password_expr, expected_password)
          +
          +
           class TestHelperFunctions(unittest.TestCase):
               """Test email parsing helper functions."""
           
          PATCH

