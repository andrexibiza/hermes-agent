          test "$(git hash-object plugins/platforms/email/adapter.py)" = 5e3be9654241e78e1bfa530edb081c9b664521fc
          test "$(git hash-object tests/gateway/test_email.py)" = 534aafa7e2ca9796f838450d75342f4806c3f5e1

          uv python install 3.11
          uv sync --locked --python 3.11 --extra dev
          uv run python -m py_compile plugins/platforms/email/adapter.py tests/gateway/test_email.py
          uv run ruff check plugins/platforms/email/adapter.py tests/gateway/test_email.py
          uv run python -m pytest -q tests/gateway/test_email.py

          uv run python - <<'PY'
          from plugins.platforms.email.adapter import _password_for_auth_endpoint

          alphabet = "0123456789abcdefghijklmnopqrstuvwxyz"

          def base36(value: int) -> str:
              chars = []
              for _ in range(4):
                  value, remainder = divmod(value, 36)
                  chars.append(alphabet[remainder])
              return "".join(reversed(chars))

          google_hosts = {
              "gmail.com",
              "smtp.gmail.com",
              "googlemail.com",
              "imap.googlemail.com.",
          }
          hosts = (
              "gmail.com",
              "smtp.gmail.com",
              "googlemail.com",
              "imap.googlemail.com.",
              "example.com",
              "evilgmail.com",
              "gmail.com.evil.example",
          )
          cases = 0
          for index in range(100_000):
              group = base36(index)
              raw = f"{group} abcd efgh ijkl"
              compact = raw.replace(" ", "")
              for host in hosts:
                  actual = _password_for_auth_endpoint(raw, host)
                  expected = compact if host in google_hosts else raw
                  if actual != expected:
                      raise AssertionError((index, host, raw, actual, expected))
                  cases += 1
          if cases != 700_000:
              raise AssertionError(cases)
          print(f"endpoint credential matrix: {cases} cases passed")
          PY

          git config user.name "Axl Ibiza"
