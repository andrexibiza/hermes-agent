name: Trigger Hermes closure sweep publisher

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read

concurrency:
  group: trigger-hermes-closure-sweep-20260821
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'automation/trigger-hermes-closure-20260821'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch one-shot publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-hermes-closure-sweep-20260821.yml/dispatches" \
            -f ref=main
          echo 'Dispatched closure-sweep publisher.'
