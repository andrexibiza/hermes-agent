name: PR 91079 finalize exact current-main payload (temporary)

on:
  push:
    branches:
      - tmp/pr91079-repair-execute

permissions:
  contents: write

jobs:
  finalize:
    if: github.repository == 'andrexibiza/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Recompose, verify, and publish PR 91079
        shell: bash
        run: |
          set -euo pipefail

          BASE='261a4efb90d7dbe4e71786861858f721b4ab730c'
          REVIEWED_PRODUCT='db32f7bb0864f5944c6ed9f505d0b979bedc8f2f'
          EXPECTED_OLD_HEAD='df2a3b6bb2db9b817a855ea8bb479a077a8c7e78'
          TARGET='fix/windows-desktop-pack-transaction'
          MAIN_PY_SHA256='1070cb0d9ec3f9e5772abde631efb3ad682c212accb96eb5f7967d4181031e0c'

          current_target="$(git ls-remote origin "refs/heads/${TARGET}" | awk '{print $1}')"
          test "$current_target" = "$EXPECTED_OLD_HEAD"

          git config user.name 'Axl Ibiza'
          git config user.email 'andrexibiza@users.noreply.github.com'

          git checkout --detach "$BASE"
          cp apps/desktop/package.json /tmp/pr91079-current-package.json

          set +e
          git cherry-pick "$REVIEWED_PRODUCT"
          cherry_status=$?
          set -e

          if [ "$cherry_status" -ne 0 ]; then
            test -f .git/CHERRY_PICK_HEAD
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = 'apps/desktop/package.json'
            cp /tmp/pr91079-current-package.json apps/desktop/package.json
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path('apps/desktop/package.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          scripts = data['scripts']
          scripts['build'] = 'node scripts/assert-root-install.mjs && node scripts/write-build-stamp.mjs && vite build && node scripts/bundle-electron-main.mjs && node scripts/stage-native-deps-recovery.mjs'
          scripts['check:test:desktop:all'] = 'node --test scripts/stage-native-deps-recovery.test.mjs && npm run test:desktop:all'
          data['build']['beforePack'] = 'scripts/before-pack-recovery.mjs'
          p.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
            git add apps/desktop/package.json
            GIT_EDITOR=true git cherry-pick --continue
          else
            cp /tmp/pr91079-current-package.json apps/desktop/package.json
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path('apps/desktop/package.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          scripts = data['scripts']
          scripts['build'] = 'node scripts/assert-root-install.mjs && node scripts/write-build-stamp.mjs && vite build && node scripts/bundle-electron-main.mjs && node scripts/stage-native-deps-recovery.mjs'
          scripts['check:test:desktop:all'] = 'node --test scripts/stage-native-deps-recovery.test.mjs && npm run test:desktop:all'
          data['build']['beforePack'] = 'scripts/before-pack-recovery.mjs'
          p.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY
            git add apps/desktop/package.json
            git commit --amend --no-edit
          fi

          python - <<'PY'
          from pathlib import Path
          import textwrap
          p = Path('hermes_cli/main.py')
          s = p.read_text(encoding='utf-8')
          a = s.index('def _rollback_desktop_from_backup(packaged_executable: Path) -> Optional[Path]:\n')
          b = s.index('\ndef _ensure_desktop_exe_launchable(\n', a)
          replacement = textwrap.dedent('''\
          def _rollback_desktop_from_backup(packaged_executable: Path) -> Optional[Path]:
              """Restore the previous unpacked desktop app from its ``.bak`` tree.

              Returns the restored executable path, or ``None`` when no usable backup
              exists or the filesystem transaction cannot complete. The invalid candidate
              is kept alongside as ``<unpacked-dir>.corrupt`` after a successful rollback.

              The live path is never deleted to make room for the backup. A stale
              quarantine must be retired before either generation moves; the candidate is
              then quarantined by rename, and backup promotion owns the commit point. If
              promotion fails, the candidate is moved back to the live path while the
              backup remains intact. Best-effort: never raises.
              """
              unpacked = packaged_executable.parent
              backup_dir = _desktop_backup_unpacked_dir(packaged_executable)
              backup_exe = backup_dir / packaged_executable.name
              if not backup_exe.exists():
                  return None
              if _desktop_exe_integrity_error(backup_exe) is not None:
                  return None

              corrupt_dir = unpacked.parent / (unpacked.name + ".corrupt")
              marker_path = backup_dir.with_name(backup_dir.name + ".session")

              if corrupt_dir.exists():
                  try:
                      shutil.rmtree(corrupt_dir)
                  except FileNotFoundError:
                      pass
                  except OSError:
                      return None

              try:
                  unpacked.rename(corrupt_dir)
              except OSError:
                  return None

              try:
                  backup_dir.rename(unpacked)
              except OSError:
                  try:
                      corrupt_dir.rename(unpacked)
                  except OSError:
                      # Both generations remain preserved at explicit paths for manual or
                      # later recovery; never delete either one here.
                      pass
                  return None

              try:
                  marker_path.unlink()
              except OSError:
                  pass

              restored = unpacked / packaged_executable.name
              return restored if restored.exists() else None
          ''')
          p.write_text(s[:a] + replacement + s[b:], encoding='utf-8')
          PY

          echo "${MAIN_PY_SHA256}  hermes_cli/main.py" | sha256sum -c -
          python -m py_compile hermes_cli/main.py

          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('apps/desktop/package.json').read_text(encoding='utf-8'))
          s = data['scripts']
          assert s['check:test:ui'] == 'npm run test:ui'
          assert 'check:test:ui:shard-1of3' not in s
          assert 'check:test:ui:shard-2of3' not in s
          assert 'check:test:ui:shard-3of3' not in s
          assert s['check:test:plugins'] == 'node --test src/plugins/*/tests/*.test.mjs'
          assert s['check:test:desktop:all'] == 'node --test scripts/stage-native-deps-recovery.test.mjs && npm run test:desktop:all'
          assert s['build'].endswith('node scripts/stage-native-deps-recovery.mjs')
          assert data['build']['beforePack'] == 'scripts/before-pack-recovery.mjs'
          PY

          for f in \
            apps/desktop/scripts/before-pack-recovery.mjs \
            apps/desktop/scripts/before-pack.mjs \
            apps/desktop/scripts/before-pack.test.mjs \
            apps/desktop/scripts/desktop-builder-runtime.mjs \
            apps/desktop/scripts/desktop-pack-recovery-composition.test.mjs \
            apps/desktop/scripts/desktop-pack-transaction.mjs \
            apps/desktop/scripts/desktop-pack-transaction.test.mjs \
            apps/desktop/scripts/run-electron-builder.mjs \
            apps/desktop/scripts/stage-native-deps-recovery.mjs \
            apps/desktop/scripts/stage-native-deps-recovery.test.mjs; do
            node --check "$f"
          done

          git add hermes_cli/main.py
          git commit -m 'fix(desktop): settle rollback at Python launchability boundary (#91079)'

          test ! -e .github/workflows/pr91079-materialize-patch.yml
          git diff "$BASE"..HEAD --check
          test "$(git rev-list --count "$BASE"..HEAD)" -eq 2

          cat >/tmp/expected-pr91079-paths <<'EOF'
          apps/desktop/package.json
          apps/desktop/scripts/before-pack-recovery.mjs
          apps/desktop/scripts/before-pack.mjs
          apps/desktop/scripts/before-pack.test.mjs
          apps/desktop/scripts/desktop-builder-runtime.mjs
          apps/desktop/scripts/desktop-pack-recovery-composition.test.mjs
          apps/desktop/scripts/desktop-pack-transaction.mjs
          apps/desktop/scripts/desktop-pack-transaction.test.mjs
          apps/desktop/scripts/run-electron-builder.mjs
          apps/desktop/scripts/stage-native-deps-recovery.mjs
          apps/desktop/scripts/stage-native-deps-recovery.test.mjs
          apps/desktop/vitest.config.ts
          hermes_cli/main.py
          tests/hermes_cli/test_desktop_pack_transaction_windows.py
          EOF
          git diff --name-only "$BASE"..HEAD | sort >/tmp/actual-pr91079-paths
          diff -u /tmp/expected-pr91079-paths /tmp/actual-pr91079-paths

          git push origin HEAD:"refs/heads/${TARGET}" \
            --force-with-lease="refs/heads/${TARGET}:${EXPECTED_OLD_HEAD}"
