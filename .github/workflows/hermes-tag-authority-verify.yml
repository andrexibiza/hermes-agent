name: Hermes Tag authority verification

on:
  push:
    branches:
      - ci/hermes-tag-authority-verify-91111

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact verification branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.1.1
        with:
          python-version: '3.11'

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest pytest-asyncio pyyaml ruff

      - name: Compile Hermes Tag package and tests
        run: python -m compileall -q gateway/hermes_tag tests/gateway/hermes_tag

      - name: Lint Hermes Tag package and tests
        run: python -m ruff check gateway/hermes_tag tests/gateway/hermes_tag

      - name: Run Hermes Tag focused suite
        run: python -m pytest -q -o addopts= tests/gateway/hermes_tag

      - name: Publish exact-commit verification status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DESCRIPTION: ${{ job.status == 'success' && 'compile, ruff, and focused pytest passed' || 'compile, ruff, or focused pytest failed' }}
        run: |
          python - <<'PY' > /tmp/status.json
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "hermes-tag-authority/focused",
              "description": os.environ["DESCRIPTION"],
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status.json
