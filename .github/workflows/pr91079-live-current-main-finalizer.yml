name: TEMP PR 91079 live current-main finalizer

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pr91079-live-current-main-finalizer
  cancel-in-progress: false

jobs:
  compose:
    if: >-
      github.event.issue.number == 235 &&
      github.event.comment.user.id == 84248988 &&
      github.event.comment.body == 'RUN PR91079 LIVE CURRENT MAIN FINALIZER'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      base: ${{ steps.compose.outputs.base }}
      candidate: ${{ steps.compose.outputs.candidate }}
    env:
      IMPLEMENTATION: db32f7bb0864f5944c6ed9f505d0b979bedc8f2f
      EXPECTED_OLD_HEAD: ef6cef5d1733d185a972ccee051d5c6bcb35ea86
      TARGET_BRANCH: fix/windows-desktop-pack-transaction
      CANDIDATE_BRANCH: tmp/pr91079-candidate-live
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Compose exact one-parent product candidate
        id: compose
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "andrexibiza/hermes-agent"
          test "$GITHUB_ACTOR_ID" = "84248988"

          git fetch --no-tags https://github.com/NousResearch/hermes-agent.git \
            +refs/heads/main:refs/remotes/upstream/main
          base="$(git rev-parse refs/remotes/upstream/main)"
          current_target="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$current_target" = "$EXPECTED_OLD_HEAD"

          git switch --detach "$base"
          implementation_paths=(
            apps/desktop/scripts/before-pack-recovery.mjs
            apps/desktop/scripts/before-pack.mjs
            apps/desktop/scripts/before-pack.test.mjs
            apps/desktop/scripts/desktop-builder-runtime.mjs
            apps/desktop/scripts/desktop-pack-recovery-composition.test.mjs
            apps/desktop/scripts/desktop-pack-transaction.mjs
            apps/desktop/scripts/desktop-pack-transaction.test.mjs
            apps/desktop/scripts/run-electron-builder.mjs
            apps/desktop/scripts/stage-native-deps-recovery.mjs
            apps/desktop/scripts/stage-native-deps-recovery.test.mjs
            apps/desktop/vitest.config.ts
            tests/hermes_cli/test_desktop_pack_transaction_windows.py
          )
          git checkout "$IMPLEMENTATION" -- "${implementation_paths[@]}"

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('apps/desktop/package.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          scripts = data['scripts']
          canonical = scripts['build']
          old_tail = 'node scripts/stage-native-deps.mjs'
          new_tail = 'node scripts/stage-native-deps-recovery.mjs'
          if old_tail not in canonical:
              raise SystemExit(f'current-main Desktop build contract changed: {canonical}')
          scripts['build'] = canonical.replace(old_tail, new_tail, 1)
          prefix = 'node --test scripts/stage-native-deps-recovery.test.mjs && '
          if not scripts['check:test:desktop:all'].startswith(prefix):
              scripts['check:test:desktop:all'] = prefix + scripts['check:test:desktop:all']
          data['build']['beforePack'] = 'scripts/before-pack-recovery.mjs'
          p.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path
          import textwrap

          p = Path('hermes_cli/main.py')
          s = p.read_text(encoding='utf-8')
          start_marker = 'def _rollback_desktop_from_backup(packaged_executable: Path) -> Optional[Path]:\n'
          end_marker = '\ndef _ensure_desktop_exe_launchable(\n'
          if s.count(start_marker) != 1 or s.count(end_marker) != 1:
              raise SystemExit('desktop rollback composition anchors are not unique')
          a = s.index(start_marker)
          b = s.index(end_marker, a)
          replacement = textwrap.dedent('''\
          def _rollback_desktop_from_backup(packaged_executable: Path) -> Optional[Path]:
              """Restore the previous unpacked desktop app without destroying either generation.

              The invalid replacement is first quarantined by rename. Backup promotion is
              the commit point. If promotion fails, the replacement is moved back to its
              original live path and the backup remains intact for a later retry.
              """
              unpacked = packaged_executable.parent
              backup_dir = _desktop_backup_unpacked_dir(packaged_executable)
              backup_exe = backup_dir / packaged_executable.name
              if not backup_exe.exists():
                  return None
              if _desktop_exe_integrity_error(backup_exe) is not None:
                  return None

              corrupt_dir = unpacked.parent / (unpacked.name + '.corrupt')
              marker_path = backup_dir.with_name(backup_dir.name + '.session')

              if corrupt_dir.exists():
                  try:
                      shutil.rmtree(corrupt_dir)
                  except FileNotFoundError:
                      pass
                  except OSError:
                      return None

              try:
                  unpacked.rename(corrupt_dir)
              except OSError:
                  return None

              try:
                  backup_dir.rename(unpacked)
              except OSError:
                  try:
                      corrupt_dir.rename(unpacked)
                  except OSError:
                      pass
                  return None

              try:
                  marker_path.unlink()
              except OSError:
                  pass

              restored = unpacked / packaged_executable.name
              return restored if restored.exists() else None
          ''')
          p.write_text(s[:a] + replacement + s[b:], encoding='utf-8')
          PY

          python -m py_compile hermes_cli/main.py
          for f in \
            apps/desktop/scripts/before-pack-recovery.mjs \
            apps/desktop/scripts/before-pack.mjs \
            apps/desktop/scripts/before-pack.test.mjs \
            apps/desktop/scripts/desktop-builder-runtime.mjs \
            apps/desktop/scripts/desktop-pack-recovery-composition.test.mjs \
            apps/desktop/scripts/desktop-pack-transaction.mjs \
            apps/desktop/scripts/desktop-pack-transaction.test.mjs \
            apps/desktop/scripts/run-electron-builder.mjs \
            apps/desktop/scripts/stage-native-deps-recovery.mjs \
            apps/desktop/scripts/stage-native-deps-recovery.test.mjs; do
            node --check "$f"
          done

          git add apps/desktop/package.json hermes_cli/main.py "${implementation_paths[@]}"
          git diff --cached --check
          cat >/tmp/expected <<'EOF'
          apps/desktop/package.json
          apps/desktop/scripts/before-pack-recovery.mjs
          apps/desktop/scripts/before-pack.mjs
          apps/desktop/scripts/before-pack.test.mjs
          apps/desktop/scripts/desktop-builder-runtime.mjs
          apps/desktop/scripts/desktop-pack-recovery-composition.test.mjs
          apps/desktop/scripts/desktop-pack-transaction.mjs
          apps/desktop/scripts/desktop-pack-transaction.test.mjs
          apps/desktop/scripts/run-electron-builder.mjs
          apps/desktop/scripts/stage-native-deps-recovery.mjs
          apps/desktop/scripts/stage-native-deps-recovery.test.mjs
          apps/desktop/vitest.config.ts
          hermes_cli/main.py
          tests/hermes_cli/test_desktop_pack_transaction_windows.py
          EOF
          sed -i 's/^          //' /tmp/expected
          git diff --cached --name-only | sort >/tmp/actual
          diff -u /tmp/expected /tmp/actual

          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('apps/desktop/package.json').read_text(encoding='utf-8'))
          assert data['scripts']['build'].endswith('node scripts/stage-native-deps-recovery.mjs')
          assert 'vite build' in data['scripts']['build']
          assert data['scripts']['check:test:plugins'] == 'node --test src/plugins/*/tests/*.test.mjs'
          assert data['build']['beforePack'] == 'scripts/before-pack-recovery.mjs'
          s = Path('hermes_cli/main.py').read_text(encoding='utf-8')
          block = s.split('def _rollback_desktop_from_backup(packaged_executable: Path) -> Optional[Path]:\n', 1)[1].split('\ndef _ensure_desktop_exe_launchable(\n', 1)[0]
          assert 'shutil.rmtree(unpacked' not in block
          assert 'unpacked.rename(corrupt_dir)' in block
          assert 'backup_dir.rename(unpacked)' in block
          assert 'corrupt_dir.rename(unpacked)' in block
          PY

          git config user.name 'Axl Ibiza, MBA'
          git config user.email 'andrexibiza@gmail.com'
          git commit -s \
            -m 'fix(desktop): make Windows package replacement fully transactional (#91079)' \
            -m "Rematerialize the reviewed Desktop package transaction as one exact child of live upstream main $base. Preserve current-main package and CLI semantics, retain the previous generation until the Python launchability authority accepts the replacement, and make rollback promotion non-destructive under Windows rename failures.\n\nCo-authored-by: Andrew Blyth <abmultimedia1@gmail.com>\nCo-authored-by: Gabriel Laute <gabriel@laute.tech>\nCo-authored-by: Thomas Medley <me@thomasmedley.dev>\nCo-authored-by: André Sahakian <60937654+noshado@users.noreply.github.com>"

          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$base"
          test "$(git rev-list --count "$base"..HEAD)" = 1
          git diff --name-only "$base"..HEAD | sort >/tmp/final
          diff -u /tmp/expected /tmp/final
          git push origin "HEAD:refs/heads/$CANDIDATE_BRANCH" --force
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

  windows-witness:
    needs: compose
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.compose.outputs.candidate }}
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm

      - name: Bind allowed npm runtime
        shell: pwsh
        run: |
          npm i -g npm@11.17.0
          node --version
          npm --version
          $direct = (node -p "process.execPath").Trim()
          $selected = (npm exec -- node -p "process.execPath").Trim()
          if ((Resolve-Path $direct).Path -ne (Resolve-Path $selected).Path) {
            throw "npm-selected Node runtime differs from direct Node runtime"
          }

      - name: Install exact JS graph
        uses: ./.github/actions/retry
        with:
          command: npm ci

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.9.28'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install exact Python graph
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11 && uv sync --locked --python 3.11 --extra all --extra dev

      - name: Focused transaction suite
        shell: pwsh
        run: |
          node --test `
            apps/desktop/scripts/before-pack.test.mjs `
            apps/desktop/scripts/desktop-pack-recovery-composition.test.mjs `
            apps/desktop/scripts/desktop-pack-transaction.test.mjs `
            apps/desktop/scripts/stage-native-deps-recovery.test.mjs
          uv run --python 3.11 pytest -q `
            tests/hermes_cli/test_desktop_exe_integrity.py `
            tests/hermes_cli/test_desktop_pack_transaction_windows.py

      - name: Real packaged-Windows rebuild and settlement witness
        shell: pwsh
        run: |
          npm --prefix apps/desktop run build
          npm --prefix apps/desktop run builder -- --win --dir --publish never
          $exe = Join-Path $PWD 'apps/desktop/release/win-unpacked/Hermes.exe'
          if (-not (Test-Path $exe)) { throw 'first packaged Hermes.exe missing' }
          $first = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          npm --prefix apps/desktop run builder -- --win --dir --publish never
          $backup = Join-Path $PWD 'apps/desktop/release/win-unpacked.bak/Hermes.exe'
          if (-not (Test-Path $exe)) { throw 'rebuilt Hermes.exe missing' }
          if (-not (Test-Path $backup)) { throw 'transactional rollback package missing' }
          @'
          from pathlib import Path
          from hermes_cli import main as cli_main
          desktop = Path('apps/desktop').resolve()
          exe = desktop / 'release' / 'win-unpacked' / 'Hermes.exe'
          backup = desktop / 'release' / 'win-unpacked.bak' / 'Hermes.exe'
          assert exe.is_file()
          assert backup.is_file()
          verified, rolled_back = cli_main._ensure_desktop_exe_launchable(desktop, exe)
          assert verified.resolve() == exe.resolve()
          assert rolled_back is False
          assert backup.is_file(), 'accepted generation destroyed rollback material'
          '@ | Set-Content pr91079_gate.py -Encoding utf8
          uv run --python 3.11 python pr91079_gate.py
          $manifest = [ordered]@{
            base = '${{ needs.compose.outputs.base }}'
            candidate = '${{ needs.compose.outputs.candidate }}'
            node = (node --version).Trim()
            npm = (npm --version).Trim()
            first_sha256 = $first
            rebuilt_sha256 = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            rollback_sha256 = (Get-FileHash $backup -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $manifest | ConvertTo-Json | Set-Content pr91079-windows-witness.json -Encoding utf8
          Get-Content pr91079-windows-witness.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr91079-windows-${{ needs.compose.outputs.candidate }}
          path: pr91079-windows-witness.json
          retention-days: 30
          if-no-files-found: error

  publish:
    needs: [compose, windows-witness]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_OLD_HEAD: ef6cef5d1733d185a972ccee051d5c6bcb35ea86
      TARGET_BRANCH: fix/windows-desktop-pack-transaction
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.compose.outputs.candidate }}
          fetch-depth: 0
      - name: Re-attest live main and publish exact witnessed candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          candidate='${{ needs.compose.outputs.candidate }}'
          base='${{ needs.compose.outputs.base }}'
          test "$(git rev-parse HEAD)" = "$candidate"
          test "$(git rev-parse HEAD^)" = "$base"
          git fetch --no-tags https://github.com/NousResearch/hermes-agent.git \
            +refs/heads/main:refs/remotes/upstream/main
          test "$(git rev-parse refs/remotes/upstream/main)" = "$base"
          current_target="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$current_target" = "$EXPECTED_OLD_HEAD"
          git push origin "$candidate:refs/heads/$TARGET_BRANCH" \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_OLD_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$candidate"
