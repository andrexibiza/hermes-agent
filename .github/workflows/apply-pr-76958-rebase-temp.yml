name: Temporary PR 76958 current-main rebuild

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-pr-76958-rebase-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/desktop-env-session-token
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replay final product delta on exact upstream main
        shell: bash
        env:
          OLD_HEAD: f435f8baffac2a61a9954749807927eafd2e1fca
          UPSTREAM_MAIN: 261a4efb90d7dbe4e71786861858f721b4ab730c
          REPORT_BRANCH: automation/rebase-76958-report-20260822
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$OLD_HEAD"

          git fetch --no-tags https://github.com/NousResearch/hermes-agent.git main
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM_MAIN"
          merge_base="$(git merge-base "$OLD_HEAD" "$UPSTREAM_MAIN")"

          git diff --binary "$merge_base" "$OLD_HEAD" -- \
            apps/desktop/electron/backend-start-failure.test.ts \
            apps/desktop/electron/backend-start-failure.ts \
            apps/desktop/electron/dashboard-token.test.ts \
            apps/desktop/electron/dashboard-token.ts \
            apps/desktop/electron/main.ts \
            hermes_cli/env_loader.py \
            hermes_cli/web_server.py \
            tests/hermes_cli/test_desktop_session_token_class.py \
            tests/hermes_cli/test_env_loader.py \
            tests/hermes_cli/test_web_server.py \
            tests/hermes_cli/test_web_server_console_ws.py \
            > /tmp/pr-76958.patch

          test -s /tmp/pr-76958.patch
          sha256sum /tmp/pr-76958.patch
          git reset --hard "$UPSTREAM_MAIN"

          if ! git apply --3way --index /tmp/pr-76958.patch; then
            {
              echo "source_head=$OLD_HEAD"
              echo "upstream_main=$UPSTREAM_MAIN"
              echo "merge_base=$merge_base"
              echo
              git status --short
              while IFS= read -r file; do
                test -n "$file" || continue
                echo
                echo "===== CONFLICT: $file ====="
                grep -n -C 24 -E '^(<<<<<<<|=======|>>>>>>>)' "$file" || true
              done < <(git diff --name-only --diff-filter=U)
            } > /tmp/pr-76958-conflicts.txt
            cat /tmp/pr-76958-conflicts.txt
            git reset --hard "$UPSTREAM_MAIN"
            mkdir -p .hermes-reports
            cp /tmp/pr-76958-conflicts.txt .hermes-reports/pr-76958-rebase.txt
            git config user.name 'Axl Ibiza'
            git config user.email 'andrexibiza@gmail.com'
            git add .hermes-reports/pr-76958-rebase.txt
            git commit -m 'chore: record PR 76958 rebase conflicts'
            git push --force origin "HEAD:refs/heads/$REPORT_BRANCH"
            exit 1
          fi

          git diff --cached --check
          git diff --cached --name-status

      - name: Set up Python dependencies
        uses: astral-sh/setup-uv@v6

      - name: Verify Python behavior
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen
          uv run pytest -q \
            tests/hermes_cli/test_env_loader.py \
            tests/hermes_cli/test_desktop_session_token_class.py
          uv run pytest -q tests/hermes_cli/test_web_server.py \
            -k 'SessionTokenSource or TokenMismatchHint'
          uv run pytest -q tests/hermes_cli/test_web_server_console_ws.py \
            -k 'token_mismatch_hints_at_stale_dotenv'
          uv run ruff check \
            hermes_cli/env_loader.py \
            hermes_cli/web_server.py \
            tests/hermes_cli/test_desktop_session_token_class.py \
            tests/hermes_cli/test_env_loader.py \
            tests/hermes_cli/test_web_server.py \
            tests/hermes_cli/test_web_server_console_ws.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Desktop behavior
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          cd apps/desktop
          npx vitest run \
            electron/dashboard-token.test.ts \
            electron/backend-start-failure.test.ts
          npx tsc -p tsconfig.electron.json --noEmit

      - name: Publish verified candidate
        shell: bash
        env:
          CANDIDATE_BRANCH: automation/rebase-76958-candidate-20260822
          EXPECTED_CANDIDATE_HEAD: f435f8baffac2a61a9954749807927eafd2e1fca
        run: |
          set -euo pipefail
          git config user.name 'Axl Ibiza'
          git config user.email 'andrexibiza@gmail.com'
          git commit -m 'fix(desktop): prevent stale env session-token lockout' \
            -m 'Rebuild the complete stale-token closure on current main: preserve the Desktop-owned token across env loads, retain actionable server diagnostics, classify headless serve correctly, and bound repeated token-rejection resets.'
          git push --force-with-lease="refs/heads/$CANDIDATE_BRANCH:$EXPECTED_CANDIDATE_HEAD" \
            origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
