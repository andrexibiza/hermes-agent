name: Repair Discord R3 and R5 shards

on:
  push:
    branches: [main]
    paths: [.github/workflows/repair-discord-shards.yml]

permissions:
  contents: write

jobs:
  r5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, token: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Rebuild standalone sender shard
        run: |
          set -euo pipefail
          OLD_HEAD=c4c92ffcb6411bfc1699065e14fd5fa808b82911
          git config user.name "Andrex Ibiza, MBA"
          git config user.email "andrexibiza@gmail.com"
          git fetch origin fix/dc-standalone-send
          git fetch https://github.com/NousResearch/hermes-agent.git main
          git reset --hard FETCH_HEAD
          git checkout "$OLD_HEAD" -- contributors/emails/andrexibiza@gmail.com contributors/emails/discord-fixer@users.noreply.github.com tests/plugins/discord/test_discord_standalone_sanitize_repair.py tests/plugins/discord/test_discord_standalone_send_seam.py
          python - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('plugins/platforms/discord/adapter.py'); s=p.read_text()
          old=subprocess.check_output(['git','show','c4c92ffcb6411bfc1699065e14fd5fa808b82911:plugins/platforms/discord/standalone_send.py'],text=True)
          marker='# ── Standalone (out-of-process) sender ────────────────────────────────────────'
          end_marker='# ── Plugin entry point ────────────────────────────────────────────────────────'
          a=s.index(marker); b=s.index(end_marker,a)
          Path('plugins/platforms/discord/standalone_send.py').write_text(old[:old.index(marker)]+s[a:b].rstrip()+'\n')
          anchor='from agent.display import ToolPreview\n'
          imports='''from plugins.platforms.discord.standalone_send import (\n    _DISCORD_CHANNEL_TYPE_PROBE_CACHE,\n    _DISCORD_STANDALONE_JSON_BODY_LIMIT_BYTES,\n    _DISCORD_STANDALONE_ERROR_BODY_LIMIT_BYTES,\n    _remember_channel_is_forum,\n    _probe_is_forum_cached,\n    _derive_forum_thread_name,\n    _standalone_sanitize_error,\n    _standalone_close_response,\n    _standalone_read_response_bytes_limited,\n    _standalone_response_encoding,\n    _standalone_read_text_limited,\n    _standalone_read_json_limited,\n    _standalone_send,\n)\n'''
          if imports not in s:
              s=s.replace(anchor,anchor+imports,1)
          a=s.index(marker); b=s.index(end_marker,a)
          p.write_text(s[:a]+s[b:])
          PY
          python -m py_compile plugins/platforms/discord/adapter.py plugins/platforms/discord/standalone_send.py
          python -m pytest -q tests/plugins/discord/test_discord_standalone_send_seam.py tests/plugins/discord/test_discord_standalone_sanitize_repair.py
          git diff --check
          git add -- contributors/emails/andrexibiza@gmail.com contributors/emails/discord-fixer@users.noreply.github.com plugins/platforms/discord/adapter.py plugins/platforms/discord/standalone_send.py tests/plugins/discord/test_discord_standalone_sanitize_repair.py tests/plugins/discord/test_discord_standalone_send_seam.py
          git commit -s -m 'refactor(discord): rebase standalone sender shard onto current main' -m 'Re-extract R5 from the exact current upstream adapter while preserving the existing seam and tests.' -m 'Part of #78647' -m 'Part of #78634' -m 'Part of #79564' -m 'Part of #79772'
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/andrexibiza/hermes-agent.git HEAD:fix/dc-standalone-send

  r3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, token: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Rebuild media and typing shard
        run: |
          set -euo pipefail
          OLD_HEAD=f71c8bb6c73c5131bd7ca1e7e3827ee700a92601
          git config user.name "Andrex Ibiza, MBA"
          git config user.email "andrexibiza@gmail.com"
          git fetch origin fix/dc-media-mixin
          git fetch https://github.com/NousResearch/hermes-agent.git main
          git reset --hard FETCH_HEAD
          git checkout "$OLD_HEAD" -- contributors/emails/andrexibiza@gmail.com contributors/emails/discord-media-seam-fixer@users.noreply.github.com plugins/platforms/discord/media_send_mixin.py tests/plugins/discord/test_discord_media_send_seam.py
          python - <<'PY'
          from pathlib import Path
          import ast,re
          p=Path('plugins/platforms/discord/adapter.py'); s=p.read_text(); tree=ast.parse(s)
          cls=next(n for n in tree.body if isinstance(n,ast.ClassDef) and n.name=='DiscordAdapter')
          owned={'send_image_file','send_image','send_animation','send_video','send_document','send_typing','stop_typing'}
          nodes=[n for n in cls.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) and n.name in owned]
          if {n.name for n in nodes}!=owned: raise SystemExit('R3 owned method set drifted')
          lines=s.splitlines(keepends=True)
          for n in sorted(nodes,key=lambda n:n.lineno,reverse=True):
              a=n.lineno-1; b=n.end_lineno
              while b<len(lines) and not lines[b].strip(): b+=1
              del lines[a:b]
          s=''.join(lines)
          imp='from .media_send_mixin import DiscordMediaSendMixin\n'; pat=re.compile(r'^class DiscordAdapter\(([^)]*)\):',re.M); m=pat.search(s)
          if not m: raise SystemExit('DiscordAdapter class line missing')
          bases=[x.strip() for x in m.group(1).split(',') if x.strip()]
          if 'DiscordMediaSendMixin' not in bases: bases.insert(0,'DiscordMediaSendMixin')
          s=pat.sub('class DiscordAdapter('+', '.join(bases)+'):',s,count=1)
          if imp not in s:
              at=s.index('class DiscordAdapter('); s=s[:at]+imp+'\n'+s[at:]
          p.write_text(s)
          PY
          python -m py_compile plugins/platforms/discord/adapter.py plugins/platforms/discord/media_send_mixin.py
          python -m pytest -q tests/plugins/discord/test_discord_media_send_seam.py tests/gateway/test_discord_send.py tests/gateway/test_send_image_file.py tests/gateway/test_send_multiple_images.py
          git diff --check
          git add -- contributors/emails/andrexibiza@gmail.com contributors/emails/discord-media-seam-fixer@users.noreply.github.com plugins/platforms/discord/adapter.py plugins/platforms/discord/media_send_mixin.py tests/plugins/discord/test_discord_media_send_seam.py
          git commit -s -m 'refactor(discord): rebase media send shard onto current main' -m 'Reapply R3 to the exact current upstream adapter using AST-owned method boundaries.' -m 'Part of #78647' -m 'Part of #78634' -m 'Part of #79564' -m 'Part of #79772'
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/andrexibiza/hermes-agent.git HEAD:fix/dc-media-mixin
