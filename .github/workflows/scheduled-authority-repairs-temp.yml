name: Scheduled authority-boundary materialization (temporary)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: fix/desktop-simple-git-warning-current-main
            carrier: .github/workflows/one-shot-compose-91798.yml
            feature_head: e90dc2a747d03e124f74b6e41f481d5f296f5119
          - branch: fix/email-app-password-normalization
            carrier: .github/workflows/one-shot-fix-86354.yml
            feature_head: ''
          - branch: fix/memory-prefetch-cancel
            carrier: .github/workflows/one-shot-fix-88796.yml
            feature_head: ''
          - branch: campaign/webhook-delivery-callbacks
            carrier: .github/workflows/one-shot-fix-85644.yml
            feature_head: ''
          - branch: fix/88715-canonical-multiplex-identity
            carrier: .github/workflows/one-shot-fix-89252.yml
            feature_head: ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: scheduled-authority-repair-${{ matrix.branch }}
      cancel-in-progress: false
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Execute exact branch carrier
        env:
          TARGET_BRANCH: ${{ matrix.branch }}
          CARRIER: ${{ matrix.carrier }}
          FEATURE_HEAD: ${{ matrix.feature_head }}
        run: |
          set -euo pipefail

          if [[ ! -f "${CARRIER}" ]]; then
            echo "Carrier absent for ${TARGET_BRANCH}: already materialized."
            exit 0
          fi

          export BRANCH="${TARGET_BRANCH}"
          export CURRENT_MAIN="$(git ls-remote https://github.com/NousResearch/hermes-agent.git refs/heads/main | awk 'NR==1 {print $1}')"
          test -n "${CURRENT_MAIN}"

          python3 - "${CARRIER}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text().splitlines()
          starts = [i for i, line in enumerate(lines) if line.strip() == "run: |"]
          if len(starts) != 1:
              raise SystemExit(f"expected one run block in {path}, found {len(starts)}")
          start = starts[0]
          key_indent = len(lines[start]) - len(lines[start].lstrip())
          content_indent = key_indent + 2
          body = []
          for line in lines[start + 1:]:
              if line.strip():
                  indent = len(line) - len(line.lstrip())
                  if indent <= key_indent:
                      break
                  if indent < content_indent:
                      raise SystemExit(f"invalid block indentation in {path}: {line!r}")
                  body.append(line[content_indent:])
              else:
                  body.append("")
          if not body:
              raise SystemExit(f"empty run block in {path}")
          Path("/tmp/materialize.sh").write_text("\n".join(body) + "\n")
          PY

          bash -n /tmp/materialize.sh
          bash /tmp/materialize.sh
