name: Temporary PR 90252 repair executor

on:
  pull_request:
    branches: [main]
    paths:
      - .hermes-control/pr-90252-repair.py
      - .hermes-control/pr-90252-repair.trigger

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact current-main PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/mcp-dual-era-conformance-first
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Load assertion-checked repair script from the control PR
        shell: bash
        env:
          CONTROL_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$CONTROL_SHA"
          git show "$CONTROL_SHA:.hermes-control/pr-90252-repair.py" > /tmp/pr-90252-repair.py
          python -m py_compile /tmp/pr-90252-repair.py

      - name: Apply closure repair to the product branch
        shell: bash
        env:
          TARGET_BRANCH: fix/mcp-dual-era-conformance-first
          EXPECTED_BASE: 657550716f370bd5d1e848a57fc24b9c404cf982
          ARCHIVE_BRANCH: archive/pr-90252-pre-rebuild
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          git fetch origin "$ARCHIVE_BRANCH:$ARCHIVE_BRANCH"
          python /tmp/pr-90252-repair.py
          git diff --check
          python -m compileall -q tools hermes_cli agent mcp_serve.py tests/fixtures tests/tools/test_mcp_protocol_negotiation.py
          git status --short

          git config user.name "Axl Ibiza"
          git config user.email "andrexibiza@gmail.com"
          git add -A
          git diff --cached --quiet && { echo 'repair produced no product diff'; exit 1; }
          git commit -m "fix(mcp): close dual-era negotiation and lifecycle matrix (#88875)"
          git push --force-with-lease=refs/heads/$TARGET_BRANCH:$EXPECTED_BASE origin HEAD:"$TARGET_BRANCH"
