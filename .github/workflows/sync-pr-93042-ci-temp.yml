name: Temporary PR 93042 CI synchronizer

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-pr-93042-ci
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: phase4-desktop-fleet
      EXPECTED_HEAD: 618f06ff0f19c13248cf69ef78d45ad300e543d2
      EXPECTED_TREE: 8f62eb13608cdef7dad04ce53404949dc245b2f5
    steps:
      - name: Checkout corrected PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and emit one ordinary branch synchronization
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_tree" = "$EXPECTED_TREE"
          test ! -e .hermes-control/ci-trigger-93042.txt

          if [[ "$actual_head" != "$EXPECTED_HEAD" ]]; then
            latest_subject="$(git log -1 --format=%s)"
            if [[ "$latest_subject" == 'ci: synchronize corrected #93042 head' ]]; then
              echo "Already synchronized at $actual_head"
              printf 'published_head=%s\n' "$actual_head" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Target branch drifted: expected $EXPECTED_HEAD, found $actual_head" >&2
            exit 1
          fi

          git remote add upstream https://github.com/NousResearch/hermes-agent.git 2>/dev/null || \
            git remote set-url upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags upstream main
          merge_base="$(git merge-base FETCH_HEAD HEAD)"
          if git diff --name-only "$merge_base" HEAD | grep -q '^\.github/workflows/'; then
            echo 'CI-sensitive workflow paths remain in the upstream PR diff; refusing synchronization.' >&2
            git diff --name-only "$merge_base" HEAD | grep '^\.github/workflows/' >&2 || true
            exit 1
          fi

          git config user.name 'Axl Ibiza, MBA'
          git config user.email 'andrexibiza@gmail.com'
          git commit --allow-empty \
            -m 'ci: synchronize corrected #93042 head' \
            -m 'Re-emit the unchanged gate-free product tree through a scheduled fork push so upstream evaluates the exact corrected object.'

          new_head="$(git rev-parse HEAD)"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH" \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$new_head"
          printf 'published_head=%s\n' "$remote_head" >> "$GITHUB_OUTPUT"

      - name: Exact synchronization receipt
        env:
          PUBLISHED_HEAD: ${{ steps.sync.outputs.published_head }}
        run: |
          {
            echo '# PR 93042 exact-head synchronization'
            echo
            echo "- published head: \`$PUBLISHED_HEAD\`"
            echo "- immutable tree: \`$EXPECTED_TREE\`"
            echo '- upstream PR: https://github.com/NousResearch/hermes-agent/pull/93042'
          } >> "$GITHUB_STEP_SUMMARY"
