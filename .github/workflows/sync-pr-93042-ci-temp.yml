name: Temporary PR 93042 CI synchronizer

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: sync-pr-93042-ci
  cancel-in-progress: false

jobs:
  synchronize:
    if: >-
      github.repository == 'andrexibiza/hermes-agent' &&
      github.event.issue.number == 243 &&
      github.event.comment.user.login == 'andrexibiza' &&
      github.event.comment.body == '/sync-93042-ci-b0b8fe3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: phase4-desktop-fleet
      EXPECTED_HEAD: b0b8fe31b99655394f54493baaa0c005accdd3d4
      EXPECTED_TREE: 8f62eb13608cdef7dad04ce53404949dc245b2f5
    steps:
      - name: Checkout exact corrected PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and emit one ordinary branch synchronization
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test ! -e .hermes-control/ci-trigger-93042.txt

          git remote add upstream https://github.com/NousResearch/hermes-agent.git 2>/dev/null || \
            git remote set-url upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags upstream main
          merge_base="$(git merge-base FETCH_HEAD HEAD)"
          if git diff --name-only "$merge_base" HEAD | grep -q '^\.github/workflows/'; then
            echo 'CI-sensitive workflow paths remain in the PR diff; refusing synchronization.' >&2
            git diff --name-only "$merge_base" HEAD | grep '^\.github/workflows/' >&2 || true
            exit 1
          fi

          git config user.name 'Axl Ibiza, MBA'
          git config user.email 'andrexibiza@gmail.com'
          git commit --allow-empty \
            -m 'ci: synchronize corrected #93042 head' \
            -m 'Re-emit the unchanged gate-free product tree through a normal fork push so upstream evaluates the exact corrected object.'

          new_head="$(git rev-parse HEAD)"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH" \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$new_head"
          printf 'new_head=%s\n' "$new_head" >> "$GITHUB_OUTPUT"
          printf 'published_head=%s\n' "$remote_head" >> "$GITHUB_OUTPUT"

      - name: Record exact synchronization receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_HEAD: ${{ steps.sync.outputs.published_head }}
        run: |
          set -euo pipefail
          gh pr comment 243 --repo "$GITHUB_REPOSITORY" --body "#93042 synchronization published: \`${PUBLISHED_HEAD}\` (tree \`${EXPECTED_TREE}\`)."
