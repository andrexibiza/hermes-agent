name: TEMP dispatch exact PR 91079 finalizer

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: read

concurrency:
  group: pr91079-dispatch-finalizer-temp
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.actor_id == '84248988' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'tmp/pr91079-finalize-20260826'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - name: Guard exact one-use dispatch request
        env:
          EXPECTED_HEAD: tmp/pr91079-finalize-20260826
          ACTUAL_HEAD: ${{ github.event.pull_request.head.ref }}
          ACTUAL_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "andrexibiza/hermes-agent"
          test "$GITHUB_ACTOR_ID" = "84248988"
          test "$ACTUAL_HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"

      - name: Expose one-use manual dispatch on default and execution refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "Axl Ibiza"
          git config user.email "7406349+andrexibiza@users.noreply.github.com"

          patch_ref() {
            local branch="$1"
            local expected
            expected="$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')"
            test -n "$expected"
            git fetch --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch"
            git switch --detach "refs/remotes/origin/$branch"

            python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/pr91079-exact-finalize-temp.yml")
          text = path.read_text(encoding="utf-8")
          header, separator, rest = text.partition("\npermissions:\n")
          if not separator:
              raise SystemExit("finalizer permissions anchor missing")
          if "\n  workflow_dispatch:" not in header:
              needle = "\n  push:\n    branches:\n      - tmp/pr91079-finalize-20260826\n"
              if header.count(needle) != 1:
                  raise SystemExit("finalizer trigger anchor is not unique")
              header = header.replace(needle, needle + "  workflow_dispatch:\n", 1)
              path.write_text(header + separator + rest, encoding="utf-8")
          PY

            if git diff --quiet -- .github/workflows/pr91079-exact-finalize-temp.yml; then
              return 0
            fi
            git add .github/workflows/pr91079-exact-finalize-temp.yml
            git diff --cached --check
            git commit -m "ci(pr91079): expose one-use exact finalizer dispatch"
            git push origin "HEAD:refs/heads/$branch" \
              --force-with-lease="refs/heads/$branch:$expected"
          }

          patch_ref main
          patch_ref tmp/pr91079-finalize-20260826

      - name: Dispatch the exact trigger ref
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: tmp/pr91079-finalize-20260826
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/pr91079-exact-finalize-temp.yml/dispatches" \
              -f "ref=$TARGET_REF"; then
              echo "Dispatched exact #91079 finalizer on $TARGET_REF"
              exit 0
            fi
            sleep 2
          done
          echo "Exact #91079 finalizer dispatch did not register" >&2
          exit 1
