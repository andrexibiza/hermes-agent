name: Dispatch PR 92931 repair

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'andrexibiza' &&
      github.event.comment.body == '/repair-92931'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the trusted main-branch repair workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-pr-92931-rolling-upgrade-temp.yml --ref main
