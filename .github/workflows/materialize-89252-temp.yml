name: Materialize #89252 claimant proof (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: materialize-89252
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/88715-canonical-multiplex-identity'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/88715-canonical-multiplex-identity
          fetch-depth: 0

      - name: Execute exact branch carrier
        run: |
          set -euo pipefail
          carrier=.github/workflows/one-shot-fix-89252.yml
          if [[ ! -f "${carrier}" ]]; then
            echo "Carrier absent: branch is already materialized."
            exit 0
          fi

          python3 - "${carrier}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text().splitlines()
          starts = [i for i, line in enumerate(lines) if line.strip() == "run: |"]
          if len(starts) != 1:
              raise SystemExit(f"expected one run block in {path}, found {len(starts)}")
          start = starts[0]
          key_indent = len(lines[start]) - len(lines[start].lstrip())
          content_indent = key_indent + 2
          body = []
          for line in lines[start + 1:]:
              if line.strip():
                  indent = len(line) - len(line.lstrip())
                  if indent <= key_indent:
                      break
                  if indent < content_indent:
                      raise SystemExit(f"invalid block indentation in {path}: {line!r}")
                  body.append(line[content_indent:])
              else:
                  body.append("")
          if not body:
              raise SystemExit(f"empty run block in {path}")
          Path("/tmp/materialize.sh").write_text("\n".join(body) + "\n")
          PY

          bash -n /tmp/materialize.sh
          bash /tmp/materialize.sh
