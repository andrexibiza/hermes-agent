name: Publish exact PR 85644 product tree

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-pr-85644-exact-product.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pr-85644-exact-product
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TARGET_BRANCH: campaign/webhook-delivery-callbacks
      PAYLOAD_BRANCH: automation/85644-exact-payload-v2
      REFERENCE_BASE: b6bcb3e791c673e63974029bbab40cc9326803ff
      ORIGINAL_FEATURE_HEAD: 2255348955a1e621e1f8f0f9e5c57948b5ae1d9d
      ORTHOGONAL_GZ_SHA256: a1e21d637ec66862f87367f540a25839dc6d7410586f8432495191d886b0ccff
      ORTHOGONAL_PATCH_SHA256: b024dc5c02d4d940dc4340810ef66ba64558baacd40c2bafa10fadc8cb17a1bf
      LEDGER_GZ_SHA256: 86efb9323c5c16384db890e7ff14b2982317b22b759e8dc2ee652ceb7cbcf2a4
      LEDGER_PATCH_SHA256: 5e2b53a50521af35386fd2b400588581aacc2839a4d751de7ee706a0f5050091
    steps:
      - name: Check out fork control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve exact source, payload, and current-main generations
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${PAYLOAD_BRANCH}:refs/remotes/origin/${PAYLOAD_BRANCH}" \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          source_head=$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")
          printf '%s\n' "$source_head" > /tmp/pr85644-source-head

          git show "refs/remotes/origin/${PAYLOAD_BRANCH}:.tmp/pr85644/orthogonal-state.patch.gz.b64" \
            > /tmp/orthogonal-state.patch.gz.b64
          git show "refs/remotes/origin/${PAYLOAD_BRANCH}:.tmp/pr85644/ledger-lift.patch.gz.b64" \
            > /tmp/ledger-lift.patch.gz.b64

          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags upstream main
          current_main=$(git rev-parse refs/remotes/upstream/main)
          printf '%s\n' "$current_main" > /tmp/pr85644-current-main
          git cat-file -e "${REFERENCE_BASE}^{commit}"
          git fetch --no-tags origin "$ORIGINAL_FEATURE_HEAD"

          target_paths=(
            gateway/delivery_ledger.py
            gateway/platforms/base.py
            gateway/platforms/webhook.py
            tests/gateway/test_delivery_ledger.py
            tests/gateway/test_delivery_ledger_producer.py
            tests/gateway/test_send_result_state.py
            tests/gateway/test_webhook_delivery_fanout.py
            tests/gateway/test_webhook_integration.py
          )
          # The reviewed patch was generated from REFERENCE_BASE. Compose it on
          # the live main generation only while every touched pre-existing file
          # is byte-identical; otherwise fail closed for regeneration.
          git diff --quiet "$REFERENCE_BASE" "$current_main" -- \
            gateway/delivery_ledger.py \
            gateway/platforms/base.py \
            gateway/platforms/webhook.py \
            tests/gateway/test_delivery_ledger.py \
            tests/gateway/test_delivery_ledger_producer.py \
            tests/gateway/test_webhook_integration.py || {
              echo '::error::Current main changed a #85644-owned file; regenerate the patch.'
              git diff --name-status "$REFERENCE_BASE" "$current_main" -- "${target_paths[@]}"
              exit 1
            }

          {
            echo "source_head=$source_head"
            echo "current_main=$current_main"
            echo "reference_base=$REFERENCE_BASE"
            echo "original_feature_head=$ORIGINAL_FEATURE_HEAD"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Materialize the exact product diff on current main
        shell: bash
        run: |
          set -euo pipefail
          current_main=$(cat /tmp/pr85644-current-main)
          git checkout --detach "$current_main"
          git reset --hard "$current_main"
          git clean -fdx

          base64 -d /tmp/orthogonal-state.patch.gz.b64 > /tmp/orthogonal-state.patch.gz
          echo "${ORTHOGONAL_GZ_SHA256}  /tmp/orthogonal-state.patch.gz" | sha256sum -c -
          gzip -dc /tmp/orthogonal-state.patch.gz > /tmp/orthogonal-state.patch
          echo "${ORTHOGONAL_PATCH_SHA256}  /tmp/orthogonal-state.patch" | sha256sum -c -

          base64 -d /tmp/ledger-lift.patch.gz.b64 > /tmp/ledger-lift.patch.gz
          echo "${LEDGER_GZ_SHA256}  /tmp/ledger-lift.patch.gz" | sha256sum -c -
          gzip -dc /tmp/ledger-lift.patch.gz > /tmp/ledger-lift.patch
          echo "${LEDGER_PATCH_SHA256}  /tmp/ledger-lift.patch" | sha256sum -c -

          git apply --check /tmp/orthogonal-state.patch
          git apply /tmp/orthogonal-state.patch
          git apply --check /tmp/ledger-lift.patch
          git apply /tmp/ledger-lift.patch
          git diff --check

          python3 - <<'PY'
          import subprocess

          expected = [
              "gateway/delivery_ledger.py",
              "gateway/platforms/base.py",
              "gateway/platforms/webhook.py",
              "tests/gateway/test_delivery_ledger.py",
              "tests/gateway/test_delivery_ledger_producer.py",
              "tests/gateway/test_send_result_state.py",
              "tests/gateway/test_webhook_delivery_fanout.py",
              "tests/gateway/test_webhook_integration.py",
          ]
          actual = subprocess.check_output(
              ["git", "diff", "--name-only"], text=True
          ).splitlines()
          if actual != expected:
              raise SystemExit(
                  f"exact product file set mismatch: expected={expected!r} actual={actual!r}"
              )
          PY

          cat > /tmp/expected-blobs <<'EOF'
          66df3968c078fe1ca44b2655f3a128a4b7e54669  gateway/delivery_ledger.py
          4d32371bd30b6350677adbfd625d857de0beda77  gateway/platforms/base.py
          66e21e30ce627a0bbfb56e2e1b4322d38ef371a0  gateway/platforms/webhook.py
          5d536bb2bf78eb158553d6f51c4479b69a3089ae  tests/gateway/test_delivery_ledger.py
          4d8be32d01557f2188b573beffcf9e13d5a21f31  tests/gateway/test_delivery_ledger_producer.py
          c872c7dcbbfc23855ca1d925df7d02fc7f3c8ef6  tests/gateway/test_send_result_state.py
          2cd406f1ad96dee630148533632e4e000c2a58fa  tests/gateway/test_webhook_delivery_fanout.py
          94600c07ae1bb94f4f8856ea6bbecdc69abd322e  tests/gateway/test_webhook_integration.py
          EOF
          while read -r expected path; do
            actual=$(git hash-object "$path")
            test "$actual" = "$expected" || {
              echo "::error file=$path::Expected blob $expected, found $actual"
              exit 1
            }
          done < /tmp/expected-blobs

          python3 -m py_compile \
            gateway/delivery_ledger.py \
            gateway/platforms/base.py \
            gateway/platforms/webhook.py \
            tests/gateway/test_delivery_ledger.py \
            tests/gateway/test_delivery_ledger_producer.py \
            tests/gateway/test_send_result_state.py \
            tests/gateway/test_webhook_delivery_fanout.py \
            tests/gateway/test_webhook_integration.py

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.9.28'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked Python test environment
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --locked --python 3.11 --extra all --extra dev \
            --extra anthropic --extra mistral --extra fal --extra modal \
            --extra daytona --extra hindsight --extra parallel-web

      - name: Verify focused settlement matrix and lint
        shell: bash
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python -m pytest -q \
            tests/gateway/test_send_result_state.py \
            tests/gateway/test_webhook_delivery_fanout.py \
            tests/gateway/test_webhook_integration.py \
            tests/gateway/test_send_retry.py \
            tests/gateway/test_delivery_ledger.py \
            tests/gateway/test_delivery_ledger_producer.py
          ruff check \
            gateway/delivery_ledger.py \
            gateway/platforms/base.py \
            gateway/platforms/webhook.py \
            tests/gateway/test_delivery_ledger.py \
            tests/gateway/test_delivery_ledger_producer.py \
            tests/gateway/test_send_result_state.py \
            tests/gateway/test_webhook_delivery_fanout.py \
            tests/gateway/test_webhook_integration.py
          git diff --check

      - name: Publish one clean provenance-preserving product commit
        shell: bash
        run: |
          set -euo pipefail
          current_main=$(cat /tmp/pr85644-current-main)
          source_head=$(cat /tmp/pr85644-source-head)
          git config user.name 'Axl Ibiza'
          git config user.email 'andrexibiza@gmail.com'
          git add -- \
            gateway/delivery_ledger.py \
            gateway/platforms/base.py \
            gateway/platforms/webhook.py \
            tests/gateway/test_delivery_ledger.py \
            tests/gateway/test_delivery_ledger_producer.py \
            tests/gateway/test_send_result_state.py \
            tests/gateway/test_webhook_delivery_fanout.py \
            tests/gateway/test_webhook_integration.py
          tree=$(git write-tree)
          message=$(cat <<'COMMIT_MESSAGE'
          fix(webhook): keep fanout outcome and retry authority orthogonal

          Mixed target settlement now carries typed terminal outcome, ordered
          per-target proof, and independently scoped retry authority. Durable
          partial settlement cannot be promoted back into aggregate replay.

          Refs #32403
          Refs #84834
          Refs #90049
          Refs #90144
          Refs #90866

          Signed-off-by: Axl Ibiza <andrexibiza@gmail.com>
          COMMIT_MESSAGE
          )
          commit=$(printf '%s\n' "$message" | git commit-tree "$tree" \
            -p "$current_main" -p "$ORIGINAL_FEATURE_HEAD")
          git reset --hard "$commit"
          test "$(git rev-parse HEAD^)" = "$current_main"
          test "$(git rev-parse HEAD^2)" = "$ORIGINAL_FEATURE_HEAD"
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${source_head}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
          {
            echo "published_head=$commit"
            echo "parent_current_main=$current_main"
            echo "parent_original_feature=$ORIGINAL_FEATURE_HEAD"
          } >> "$GITHUB_STEP_SUMMARY"
