name: Run P0 dependency remediation

on:
  push:
    branches:
      - main
      - security/p0-dependency-remediation-20260820

permissions:
  contents: write

concurrency:
  group: p0-remediation-runner
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: security/p0-dependency-remediation-20260820
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 26
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install npm 12
        run: npm install --global npm@12

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"

      - name: Materialize, verify, and push exact delivered tree
        run: bash .github/scripts/p0-remediate.sh
