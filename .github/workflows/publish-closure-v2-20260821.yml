name: Publish closure sweep repairs v2

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-closure-v2-20260821
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.head_commit.message == 'ci: arm closure sweep publisher v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Configure publisher
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin architecture/desktop-authoritative-projections fix/windows-desktop-pack-transaction

      - name: Publish PR 91897 SDK contract docs
        run: |
          set -euo pipefail
          git checkout -B closure-91897 origin/architecture/desktop-authoritative-projections
          test "$(git rev-parse HEAD)" = '55b046e95a859888c64f009c35fffbfe390d49d2'
          python - <<'PY'
          from pathlib import Path

          path = Path('website/docs/developer-guide/desktop-plugin-sdk.md')
          text = path.read_text(encoding='utf-8')
          old = '''A **contribution** is the one primitive every surface shares:

```ts
interface Contribution {
  id: string          // you write the local id; the host namespaces it
  area: string        // WHERE it goes (a contribution-area constant)
  title?: string
  order?: number      // sort within the area (lower = earlier)
  when?: () => boolean // dynamic visibility; re-evaluated by the area
  enabled?: boolean
  render?: () => ReactNode  // the component to mount
  data?: unknown      // area-specific payload (see the cookbook)
}
```

You provide `render`, `data`, or both, depending on the area.
'''
          new = '''A **contribution** is the one primitive every surface shares. Visibility is a
live readonly authority rather than a pull-only callback: the registry owns the
subscription and invalidates exactly the contribution's area when the authority
changes.

```ts
interface ContributionCondition {
  get(): boolean
  listen(listener: (value: boolean) => void): () => void
}

interface Contribution {
  id: string          // you write the local id; the host namespaces it
  area: string        // WHERE it goes (a contribution-area constant)
  title?: string
  order?: number      // sort within the area (lower = earlier)
  when?: ContributionCondition // live visibility; e.g. atom()/computed()/host.state.*
  enabled?: boolean
  render?: () => ReactNode  // the component to mount
  data?: unknown      // area-specific payload (see the cookbook)
}
```

`when` may be any readonly source with `get()` + `listen()` semantics. Nano Stores
`atom()` / `computed()` values and readonly `host.state.*` values satisfy this
shape. Replacement and disposal detach the old subscription, so a stale source
cannot continue invalidating an area it no longer owns.

You provide `render`, `data`, or both, depending on the area.
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one stale Contribution block, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git add website/docs/developer-guide/desktop-plugin-sdk.md
          git commit -m 'docs(desktop): document live contribution visibility'
          git push origin HEAD:architecture/desktop-authoritative-projections --force-with-lease=refs/heads/architecture/desktop-authoritative-projections:55b046e95a859888c64f009c35fffbfe390d49d2

      - name: Publish PR 91079 materialized rollback implementation
        run: |
          set -euo pipefail
          git checkout -B closure-91079 origin/fix/windows-desktop-pack-transaction
          test "$(git rev-parse HEAD)" = 'df2a3b6bb2db9b817a855ea8bb479a077a8c7e78'
          python - <<'PY'
          from pathlib import Path

          p = Path('hermes_cli/main.py')
          s = p.read_text(encoding='utf-8')
          a = s.index('def _rollback_desktop_from_backup(packaged_executable: Path) -> Optional[Path]:\n')
          b = s.index('\ndef _ensure_desktop_exe_launchable(\n', a)
          replacement = '''def _rollback_desktop_from_backup(packaged_executable: Path) -> Optional[Path]:
    """Restore the previous unpacked desktop app from its ``.bak`` tree.

    Returns the restored executable path, or ``None`` when no usable backup
    exists or the filesystem transaction cannot complete. The invalid candidate
    is kept alongside as ``<unpacked-dir>.corrupt`` after a successful rollback.

    The live path is never deleted to make room for the backup. A stale
    quarantine must be retired before either generation moves; the candidate is
    then quarantined by rename, and backup promotion owns the commit point. If
    promotion fails, the candidate is moved back to the live path while the
    backup remains intact. Best-effort: never raises.
    """
    unpacked = packaged_executable.parent
    backup_dir = _desktop_backup_unpacked_dir(packaged_executable)
    backup_exe = backup_dir / packaged_executable.name
    if not backup_exe.exists():
        return None
    if _desktop_exe_integrity_error(backup_exe) is not None:
        return None

    corrupt_dir = unpacked.parent / (unpacked.name + ".corrupt")
    marker_path = backup_dir.with_name(backup_dir.name + ".session")

    if corrupt_dir.exists():
        try:
            shutil.rmtree(corrupt_dir)
        except FileNotFoundError:
            pass
        except OSError:
            return None

    try:
        unpacked.rename(corrupt_dir)
    except OSError:
        return None

    try:
        backup_dir.rename(unpacked)
    except OSError:
        try:
            corrupt_dir.rename(unpacked)
        except OSError:
            # Both generations remain preserved at explicit paths for manual or
            # later recovery; never delete either one here.
            pass
        return None

    try:
        marker_path.unlink()
    except OSError:
        pass

    restored = unpacked / packaged_executable.name
    return restored if restored.exists() else None
'''
          p.write_text(s[:a] + replacement + s[b:], encoding='utf-8')
          PY
          python -m py_compile hermes_cli/main.py
          python - <<'PY'
          import hashlib
          from pathlib import Path

          digest = hashlib.sha256(Path('hermes_cli/main.py').read_bytes()).hexdigest()
          expected = '1070cb0d9ec3f9e5772abde631efb3ad682c212accb96eb5f7967d4181031e0c'
          if digest != expected:
              raise SystemExit(f'generated main.py mismatch: {digest} != {expected}')
          PY
          test -f .github/workflows/pr91079-materialize-patch.yml
          git rm .github/workflows/pr91079-materialize-patch.yml
          git diff --check
          git add hermes_cli/main.py
          git commit -m 'fix(desktop): publish rollback transaction implementation'
          git push origin HEAD:fix/windows-desktop-pack-transaction --force-with-lease=refs/heads/fix/windows-desktop-pack-transaction:df2a3b6bb2db9b817a855ea8bb479a077a8c7e78

      - name: Prepare publisher cleanup PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git checkout main
          git pull --ff-only origin main
          git checkout -b automation/remove-closure-v2-20260821
          git rm .github/workflows/publish-closure-v2-20260821.yml
          git commit -m 'ci: retire closure sweep publisher v2'
          git push origin HEAD
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head automation/remove-closure-v2-20260821 \
            --title 'ci: retire closure sweep publisher v2' \
            --body 'Removes the one-shot publisher after its exact-SHA repair job completed.'
