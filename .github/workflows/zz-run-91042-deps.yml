name: "Converge #89479 dependency-security object"

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: dep-security-89479-${{ github.event.pull_request.number }}-${{ github.event.action }}
  cancel-in-progress: false

env:
  DELIVERY_PR: "89479"
  EVIDENCE_PR: "96"
  EVIDENCE_BASE: evidence/89479-current-main
  EVIDENCE_HEAD: trigger/91042-current-main
  UPSTREAM_REPO: NousResearch/hermes-agent

jobs:
  publish-current-main-object:
    name: Publish exact current-main remediation object
    if: >-
      github.event.pull_request.number == 96 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'trigger/91042-current-main' &&
      github.event.action != 'reopened'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout exact candidate trigger
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Gate on the explicit #89479 trigger
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          marker=.github/pr91042-current-main-trigger
          if [ -f "$marker" ] &&
             grep -qx 'target=89479' "$marker" &&
             grep -qx 'purpose=current-main-security-convergence' "$marker"; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "No #89479 convergence trigger on this exact head; publisher is intentionally inert."
          fi

      - name: Set up Node 26
        if: steps.gate.outputs.active == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Set up uv
        if: steps.gate.outputs.active == 'true'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"

      - name: Resolve live upstream main and latest Electron 41
        if: steps.gate.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_HEAD=$(git rev-parse HEAD)
          echo "SOURCE_HEAD=$SOURCE_HEAD" >> "$GITHUB_ENV"

          git remote add upstream "https://github.com/$UPSTREAM_REPO.git" || true
          git fetch --no-tags upstream main
          UPSTREAM_MAIN=$(git rev-parse FETCH_HEAD)
          echo "UPSTREAM_MAIN=$UPSTREAM_MAIN" >> "$GITHUB_ENV"

          git checkout --detach "$UPSTREAM_MAIN"

          cp package.json /tmp/upstream-package.json
          cp website/package.json /tmp/upstream-website-package.json
          cp apps/desktop/package.json /tmp/upstream-desktop-package.json

          npm view 'electron@41' version --json > /tmp/electron-41-versions.json
          ELECTRON_VERSION=$(python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          raw = json.loads(Path('/tmp/electron-41-versions.json').read_text())
          versions = [raw] if isinstance(raw, str) else raw
          stable = [v for v in versions if re.fullmatch(r'41\.\d+\.\d+', v)]
          if not stable:
              raise SystemExit('npm registry returned no stable Electron 41 release')
          print(max(stable, key=lambda value: tuple(map(int, value.split('.')))))
          PY
          )
          echo "ELECTRON_VERSION=$ELECTRON_VERSION" >> "$GITHUB_ENV"
          echo "live_upstream_main=$UPSTREAM_MAIN"
          echo "latest_electron_41=$ELECTRON_VERSION"

      - name: Apply the bounded dependency and packaged-layout repair
        if: steps.gate.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          electron = os.environ['ELECTRON_VERSION']

          def load(path: str):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def write(path: str, data):
              Path(path).write_text(
                  json.dumps(data, indent=2, ensure_ascii=False) + '\n',
                  encoding='utf-8',
              )

          root = load('package.json')
          overrides = root.setdefault('overrides', {})
          overrides.pop('nanoid@^3', None)
          if overrides.get('nanoid@^6') != '6.0.0':
              raise SystemExit('current-main NanoID v6 isolation moved; refusing a blind rewrite')

          postcss = overrides.get('postcss')
          if isinstance(postcss, str):
              postcss = {'.': postcss}
          elif isinstance(postcss, dict):
              postcss = dict(postcss)
          else:
              raise SystemExit(f'unexpected current-main PostCSS override: {postcss!r}')
          postcss['nanoid'] = '3.3.18'
          overrides['postcss'] = postcss

          for parent in ('sanitize-html', 'vite'):
              current = overrides.get(parent)
              if current is None:
                  current = {}
              elif isinstance(current, str):
                  current = {'.': current}
              elif isinstance(current, dict):
                  current = dict(current)
              else:
                  raise SystemExit(f'unexpected {parent} override: {current!r}')
              current['nanoid'] = '3.3.18'
              overrides[parent] = current

          allow_scripts = root.setdefault('allowScripts', {})
          for key in list(allow_scripts):
              if key.startswith('electron@'):
                  del allow_scripts[key]
          allow_scripts[f'electron@{electron}'] = True
          write('package.json', root)

          website = load('website/package.json')
          website.setdefault('overrides', {})['nanoid'] = '3.3.18'
          write('website/package.json', website)

          desktop = load('apps/desktop/package.json')
          desktop['devDependencies']['electron'] = electron
          desktop['build']['electronVersion'] = electron
          write('apps/desktop/package.json', desktop)

          npmrc = Path('.npmrc')
          text = npmrc.read_text(encoding='utf-8')
          text = re.sub(
              r'# nanoid [^\n]+GHSA-2v37-7h3g-55p8[^\n]*',
              '# nanoid 3.3.18 fixes GHSA-2v37-7h3g-55p8. remove when > 2wks old.',
              text,
          )
          if 'min-release-age-exclude[]=nanoid' not in text:
              text += '\nmin-release-age-exclude[]=nanoid\n'
          if 'min-release-age-exclude[]=electron' not in text:
              text += (
                  f'\n# electron {electron} closes the active Desktop advisory surface; '
                  'remove this exclusion once the pinned release is > 2wks old.\n'
                  'min-release-age-exclude[]=electron\n'
              )
          npmrc.write_text(text, encoding='utf-8')

          Path('apps/desktop/scripts/packaged-app-layout.mjs').write_text(
              "const SUPPORTED_ARCHES = new Set(['x64', 'arm64'])\n\n"
              "export function resolveDesktopTestArch(hostArch, override) {\n"
              "  const arch = override || hostArch\n"
              "  if (!SUPPORTED_ARCHES.has(arch)) {\n"
              "    throw new Error(`Unsupported Desktop package architecture: ${arch}`)\n"
              "  }\n"
              "  return arch\n"
              "}\n\n"
              "export function resolveLinuxUnpackedDirName(arch) {\n"
              "  if (!SUPPORTED_ARCHES.has(arch)) {\n"
              "    throw new Error(`Unsupported Linux package architecture: ${arch}`)\n"
              "  }\n"
              "  return arch === 'x64' ? 'linux-unpacked' : `linux-${arch}-unpacked`\n"
              "}\n",
              encoding='utf-8',
          )
          Path('apps/desktop/scripts/packaged-app-layout.test.mjs').write_text(
              "import { describe, expect, it } from 'vitest'\n\n"
              "import {\n"
              "  resolveDesktopTestArch,\n"
              "  resolveLinuxUnpackedDirName\n"
              "} from './packaged-app-layout.mjs'\n\n"
              "describe('packaged Desktop layout', () => {\n"
              "  it('uses electron-builder default directory on Linux x64', () => {\n"
              "    expect(resolveLinuxUnpackedDirName('x64')).toBe('linux-unpacked')\n"
              "  })\n\n"
              "  it('uses the architecture suffix on Linux ARM64', () => {\n"
              "    expect(resolveLinuxUnpackedDirName('arm64')).toBe('linux-arm64-unpacked')\n"
              "  })\n\n"
              "  it('allows a native package witness to override the host architecture', () => {\n"
              "    expect(resolveDesktopTestArch('x64', 'arm64')).toBe('arm64')\n"
              "  })\n\n"
              "  it('rejects unsupported package architectures', () => {\n"
              "    expect(() => resolveDesktopTestArch('x64', 'ia32')).toThrow(\n"
              "      'Unsupported Desktop package architecture: ia32'\n"
              "    )\n"
              "  })\n"
              "})\n",
              encoding='utf-8',
          )

          target = Path('apps/desktop/scripts/test-desktop.mjs')
          text = target.read_text(encoding='utf-8')
          package_anchor = "import PACKAGE_JSON from '../package.json' with { type: 'json' }"
          helper_import = (
              "import {\n"
              "  resolveDesktopTestArch,\n"
              "  resolveLinuxUnpackedDirName\n"
              "} from './packaged-app-layout.mjs'"
          )
          if helper_import not in text:
              if package_anchor not in text:
                  raise SystemExit('test-desktop package import anchor not found')
              text = text.replace(package_anchor, helper_import + '\n' + package_anchor, 1)

          old_arch = "const ARCH = process.arch === 'arm64' ? 'arm64' : 'x64'"
          new_arch = (
              "const ARCH = resolveDesktopTestArch(\n"
              "  process.arch === 'arm64' ? 'arm64' : 'x64',\n"
              "  process.env.HERMES_DESKTOP_TEST_ARCH\n"
              ")"
          )
          if old_arch in text:
              text = text.replace(old_arch, new_arch, 1)
          elif new_arch not in text:
              raise SystemExit('test-desktop architecture anchor not found')

          old_layout = (
              "  // linux unpacked layout matches windows but with different binary name\n"
              "  const unpacked = path.join(RELEASE_ROOT, 'linux-unpacked')"
          )
          new_layout = (
              "  // electron-builder suffixes non-x64 Linux output with the target architecture.\n"
              "  const unpacked = path.join(RELEASE_ROOT, resolveLinuxUnpackedDirName(ARCH))"
          )
          if old_layout in text:
              text = text.replace(old_layout, new_layout, 1)
          elif new_layout not in text:
              raise SystemExit('test-desktop Linux layout anchor not found')
          target.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Canonically regenerate the npm and Python lock graphs
        if: steps.gate.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@12
          echo "NPM_VERSION=$(npm --version)" >> "$GITHUB_ENV"

          npm install --package-lock-only --ignore-scripts --include=optional --no-audit --no-fund
          npm --prefix website install --package-lock-only --ignore-scripts --include=optional --no-audit --no-fund
          uv lock --upgrade-package h2
          uv lock --check

      - name: Prove current-main preservation and resolved advisory floors
        if: steps.gate.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy
          import json
          import os
          import re
          from pathlib import Path

          electron = os.environ['ELECTRON_VERSION']

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          before_root = load('/tmp/upstream-package.json')
          after_root = load('package.json')
          before_web = load('/tmp/upstream-website-package.json')
          after_web = load('website/package.json')
          before_desktop = load('/tmp/upstream-desktop-package.json')
          after_desktop = load('apps/desktop/package.json')

          def normalize_root(doc):
              doc = copy.deepcopy(doc)
              overrides = doc.setdefault('overrides', {})
              overrides.pop('nanoid@^3', None)
              postcss = overrides.get('postcss')
              if isinstance(postcss, dict):
                  postcss.pop('nanoid', None)
                  if set(postcss) == {'.'}:
                      overrides['postcss'] = postcss['.']
              for parent in ('sanitize-html', 'vite'):
                  value = overrides.get(parent)
                  if isinstance(value, dict):
                      value.pop('nanoid', None)
                      if not value:
                          overrides.pop(parent, None)
                      elif set(value) == {'.'}:
                          overrides[parent] = value['.']
              allow = doc.setdefault('allowScripts', {})
              for key in list(allow):
                  if key.startswith('electron@'):
                      del allow[key]
              return doc

          def normalize_web(doc):
              doc = copy.deepcopy(doc)
              overrides = doc.get('overrides', {})
              overrides.pop('nanoid', None)
              if not overrides:
                  doc.pop('overrides', None)
              return doc

          def normalize_desktop(doc):
              doc = copy.deepcopy(doc)
              doc.get('devDependencies', {}).pop('electron', None)
              doc.get('build', {}).pop('electronVersion', None)
              return doc

          if normalize_root(before_root) != normalize_root(after_root):
              raise SystemExit('root manifest movement outside the bounded remediation was detected')
          if normalize_web(before_web) != normalize_web(after_web):
              raise SystemExit('website manifest movement outside NanoID was detected')
          if normalize_desktop(before_desktop) != normalize_desktop(after_desktop):
              raise SystemExit('Desktop manifest movement outside Electron was detected')

          root_lock = load('package-lock.json')
          web_lock = load('website/package-lock.json')
          packages = root_lock.get('packages', {})
          failures = []

          def expect(condition, message):
              if not condition:
                  failures.append(message)

          expect(after_root['overrides'].get('nanoid@^3') is None, 'obsolete flat NanoID v3 override remains')
          expect(after_root['overrides'].get('nanoid@^6') == '6.0.0', 'NanoID v6 isolation moved')
          expect(after_root['overrides'].get('postcss', {}).get('nanoid') == '3.3.18', 'PostCSS NanoID floor is not 3.3.18')
          expect(after_root['overrides'].get('sanitize-html', {}).get('nanoid') == '3.3.18', 'sanitize-html NanoID floor is missing')
          expect(after_root['overrides'].get('vite', {}).get('nanoid') == '3.3.18', 'Vite NanoID floor is missing')
          expect(after_web.get('overrides', {}).get('nanoid') == '3.3.18', 'website NanoID floor is not 3.3.18')
          expect(after_desktop['devDependencies'].get('electron') == electron, 'Desktop Electron manifest mismatch')
          expect(after_desktop['build'].get('electronVersion') == electron, 'Desktop Electron build mismatch')
          expect(after_root.get('allowScripts', {}).get(f'electron@{electron}') is True, 'Electron install-script grant mismatch')
          expect(
              not any(key.startswith('electron@') and key != f'electron@{electron}' for key in after_root.get('allowScripts', {})),
              'stale Electron install-script grant remains',
          )
          expect(packages.get('node_modules/electron', {}).get('version') == electron, 'resolved Electron mismatch')
          expect(
              any(path == 'node_modules/@electron/get' or path.endswith('/node_modules/@electron/get') for path in packages),
              '@electron/get is missing from the resolved graph',
          )
          expect(
              any(
                  path == 'node_modules/@electron-internal/extract-zip'
                  or path.endswith('/node_modules/@electron-internal/extract-zip')
                  for path in packages
              ),
              'Electron internal extractor is missing',
          )

          desktop_lock = packages.get('apps/desktop', {})
          for section in ('dependencies', 'devDependencies'):
              for dep, spec in after_desktop.get(section, {}).items():
                  expect(
                      desktop_lock.get(section, {}).get(dep) == spec,
                      f'current-main Desktop {section} entry {dep} was not preserved in the lock declaration',
                  )

          for path, package in packages.items():
              version = package.get('version', '')
              if (path == 'node_modules/nanoid' or path.endswith('/node_modules/nanoid')) and version.startswith('3.'):
                  expect(version == '3.3.18', f'{path} still resolves NanoID {version}')
              if (path == 'node_modules/extract-zip' or path.endswith('/node_modules/extract-zip')) and version == '2.0.1':
                  failures.append(f'{path} still resolves legacy extract-zip 2.0.1')

          for path, package in web_lock.get('packages', {}).items():
              version = package.get('version', '')
              if (path == 'node_modules/nanoid' or path.endswith('/node_modules/nanoid')) and version.startswith('3.'):
                  expect(version == '3.3.18', f'website {path} still resolves NanoID {version}')

          uv_text = Path('uv.lock').read_text(encoding='utf-8')
          h2 = re.search(r'\[\[package\]\]\nname = "h2"\nversion = "([^"]+)"', uv_text)
          expect(h2 is not None, 'h2 is missing from uv.lock')
          if h2:
              version = tuple(int(part) for part in h2.group(1).split('.')[:3])
              expect(version >= (4, 4, 1), f'h2 remains below fixed floor: {h2.group(1)}')

          if failures:
              raise SystemExit('\n'.join(failures))
          print(json.dumps({
              'upstream_main': os.environ['UPSTREAM_MAIN'],
              'electron': electron,
              'h2': h2.group(1) if h2 else None,
              'npm': os.environ['NPM_VERSION'],
          }, indent=2))
          PY

          mapfile -t changed < <(git diff --name-only)
          allowed=(
            .npmrc
            package.json
            package-lock.json
            website/package.json
            website/package-lock.json
            apps/desktop/package.json
            apps/desktop/scripts/test-desktop.mjs
            apps/desktop/scripts/packaged-app-layout.mjs
            apps/desktop/scripts/packaged-app-layout.test.mjs
            uv.lock
          )
          for path in "${changed[@]}"; do
            found=false
            for candidate in "${allowed[@]}"; do
              if [ "$path" = "$candidate" ]; then
                found=true
                break
              fi
            done
            if [ "$found" != true ]; then
              echo "::error::Unexpected changed path: $path"
              exit 1
            fi
          done
          git diff --check

      - name: Commit the exact object before testing it
        if: steps.gate.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Axl Ibiza"
          git config user.email "andrexibiza@users.noreply.github.com"
          git add \
            .npmrc \
            package.json \
            package-lock.json \
            website/package.json \
            website/package-lock.json \
            apps/desktop/package.json \
            apps/desktop/scripts/test-desktop.mjs \
            apps/desktop/scripts/packaged-app-layout.mjs \
            apps/desktop/scripts/packaged-app-layout.test.mjs \
            uv.lock
          git diff --cached --check
          git commit \
            -m "fix(deps): converge active dependency advisories" \
            -m "Rebuild the one dependency-security object directly on live upstream main $UPSTREAM_MAIN, preserve current-main manifest movement, pin Electron $ELECTRON_VERSION, close the nested NanoID v3 graph, update the Python h2 floor, and make packaged Linux layout verification architecture-aware." \
            -m "Delivery authority: NousResearch/hermes-agent#89479" \
            -m "Co-authored-by: schmitzi8 <281458983+schmitzi8@users.noreply.github.com>" \
            -m "Co-authored-by: orcaspainting-dev <264355715+orcaspainting-dev@users.noreply.github.com>"
          NEW_HEAD=$(git rev-parse HEAD)
          echo "NEW_HEAD=$NEW_HEAD" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD^)" = "$UPSTREAM_MAIN"
          test -z "$(git status --porcelain)"
          echo "exact_product_head=$NEW_HEAD"

      - name: Run clean installs, npm advisory gates, and focused tests on the committed object
        if: steps.gate.outputs.active == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NEW_HEAD"
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix website ci --ignore-scripts --no-audit --no-fund

          npm audit --workspaces=false --audit-level=moderate
          npm audit --workspace web --audit-level=moderate
          npm audit --workspace ui-tui --audit-level=moderate
          npm audit --workspace apps/desktop --audit-level=moderate
          npm --prefix website audit --audit-level=moderate

          npm run typecheck --workspace apps/desktop
          npm run test:desktop:platforms --workspace apps/desktop
          uv lock --check
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Publish the exact base and product refs
        if: steps.gate.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          REMOTE_HEAD=$(git ls-remote "$remote" "refs/heads/$EVIDENCE_HEAD" | cut -f1)
          if [ "$REMOTE_HEAD" != "$SOURCE_HEAD" ]; then
            echo "::error::Evidence head moved during verification: expected $SOURCE_HEAD, found $REMOTE_HEAD"
            exit 1
          fi

          git push --force "$remote" "$UPSTREAM_MAIN:refs/heads/$EVIDENCE_BASE"
          git push \
            --force-with-lease="refs/heads/$EVIDENCE_HEAD:$SOURCE_HEAD" \
            "$remote" \
            "$NEW_HEAD:refs/heads/$EVIDENCE_HEAD"

      - name: Retarget and reopen the evidence lane on the exact parent
        if: steps.gate.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/evidence-body.md <<EOF
          Execution and evidence lane for [NousResearch/hermes-agent#89479](https://github.com/NousResearch/hermes-agent/pull/89479). This fork-local PR is **not** a competing remediation or delivery authority.

          Exact source authority: [NousResearch/hermes-agent@$UPSTREAM_MAIN](https://github.com/NousResearch/hermes-agent/commit/$UPSTREAM_MAIN)

          Exact product object: [$NEW_HEAD](https://github.com/$GITHUB_REPOSITORY/commit/$NEW_HEAD)

          Resolved Electron: \`$ELECTRON_VERSION\`

          The product commit has exactly one parent: the live upstream-main SHA above. Reopening this lane runs repository CI/OSV plus independent native Desktop, Docker, and Nix witnesses on that exact product object. After all receipts are read back, this commit is handed to #89479; no additional Hermes remediation PR is created.
          EOF

          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/pulls/$EVIDENCE_PR" \
            -f base="$EVIDENCE_BASE" \
            -f state=closed \
            -f title="evidence: verify #89479 dependency-security convergence" \
            --raw-field body="$(cat /tmp/evidence-body.md)" >/tmp/pr-update.json
          sleep 2
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/pulls/$EVIDENCE_PR" \
            -f state=open >/tmp/pr-reopen.json

          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$NEW_HEAD" \
            -f state=success \
            -f context='dependency-security/prepublication' \
            -f description='Exact current-main object passed clean installs, npm audits, and focused tests' \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/tmp/status.json

      - name: Publish the publisher receipt
        if: steps.gate.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > dependency-security-publisher-receipt.json
          import json
          import os
          print(json.dumps({
              'delivery_pr': 'https://github.com/NousResearch/hermes-agent/pull/89479',
              'evidence_pr': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/pull/{os.environ['EVIDENCE_PR']}",
              'source_trigger': os.environ['SOURCE_HEAD'],
              'upstream_main': os.environ['UPSTREAM_MAIN'],
              'product_head': os.environ['NEW_HEAD'],
              'electron': os.environ['ELECTRON_VERSION'],
              'npm': os.environ['NPM_VERSION'],
              'workflow_run': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }, indent=2))
          PY
          cat > /tmp/publisher-comment.md <<EOF
          Published the exact current-main dependency-security product for #89479.

          - upstream parent: [\`$UPSTREAM_MAIN\`](https://github.com/NousResearch/hermes-agent/commit/$UPSTREAM_MAIN)
          - product head: [\`$NEW_HEAD\`](https://github.com/$GITHUB_REPOSITORY/commit/$NEW_HEAD)
          - Electron: \`$ELECTRON_VERSION\`
          - publisher run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          The evidence lane has been retargeted to the exact upstream parent and reopened. Full CI/OSV, native packaged-Desktop, Docker, and Nix witnesses now attach to this one object.
          EOF
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$EVIDENCE_PR/comments" \
            --raw-field body="$(cat /tmp/publisher-comment.md)" >/tmp/comment.json

      - name: Upload publisher receipt
        if: steps.gate.outputs.active == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-security-89479-publisher-${{ github.run_id }}
          path: dependency-security-publisher-receipt.json
          retention-days: 30
          if-no-files-found: error

  exact-npm:
    name: Exact npm and Python lock witness
    if: >-
      github.event.pull_request.number == 96 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'trigger/91042-current-main' &&
      github.event.pull_request.base.ref == 'evidence/89479-current-main' &&
      github.event.action == 'reopened'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout exact product
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Prove exact parent
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"

      - name: Set up Node 26
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"

      - name: Run exact lock and advisory gates
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@12
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix website ci --ignore-scripts --no-audit --no-fund

          npm audit --workspaces=false --audit-level=moderate
          npm audit --workspace web --audit-level=moderate
          npm audit --workspace ui-tui --audit-level=moderate
          npm audit --workspace apps/desktop --audit-level=moderate
          npm --prefix website audit --audit-level=moderate

          uv lock --check
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          root = json.loads(Path('package-lock.json').read_text())
          website = json.loads(Path('website/package-lock.json').read_text())
          failures = []
          for label, lock in (('root', root), ('website', website)):
              for path, package in lock.get('packages', {}).items():
                  version = package.get('version', '')
                  if (path == 'node_modules/nanoid' or path.endswith('/node_modules/nanoid')) and version.startswith('3.') and version != '3.3.18':
                      failures.append(f'{label}:{path}={version}')
          uv = Path('uv.lock').read_text()
          h2 = re.search(r'\[\[package\]\]\nname = "h2"\nversion = "([^"]+)"', uv)
          if not h2 or tuple(map(int, h2.group(1).split('.')[:3])) < (4, 4, 1):
              failures.append(f'h2={h2.group(1) if h2 else "missing"}')
          if failures:
              raise SystemExit('\n'.join(failures))
          print(f'h2={h2.group(1)}')
          PY
          test -z "$(git status --porcelain)"

      - name: Write npm witness receipt
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY' > exact-npm-receipt.json
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(Path('apps/desktop/package.json').read_text())
          lock = json.loads(Path('package-lock.json').read_text())
          uv = Path('uv.lock').read_text()
          h2 = re.search(r'\[\[package\]\]\nname = "h2"\nversion = "([^"]+)"', uv).group(1)
          print(json.dumps({
              'head': os.environ['HEAD_SHA'],
              'parent': os.environ['BASE_SHA'],
              'electron_manifest': manifest['devDependencies']['electron'],
              'electron_lock': lock['packages']['node_modules/electron']['version'],
              'h2': h2,
              'npm_audits': ['root', 'web', 'ui-tui', 'apps/desktop', 'website'],
              'result': 'pass',
          }, indent=2))
          PY

      - name: Upload npm witness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: exact-npm-${{ github.event.pull_request.head.sha }}
          path: exact-npm-receipt.json
          retention-days: 30
          if-no-files-found: error

  exact-desktop:
    name: Packaged Desktop (${{ matrix.arch }})
    if: >-
      github.event.pull_request.number == 96 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'trigger/91042-current-main' &&
      github.event.pull_request.base.ref == 'evidence/89479-current-main' &&
      github.event.action == 'reopened'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            unpacked: linux-unpacked
          - arch: arm64
            runner: ubuntu-24.04-arm
            unpacked: linux-arm64-unpacked
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Checkout exact product
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Prove exact parent
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"

      - name: Set up Node 26
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install exact graph and build Desktop
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@12
          npm ci --no-audit --no-fund
          npm run typecheck --workspace apps/desktop
          npm run test:desktop:platforms --workspace apps/desktop
          npm run build --workspace apps/desktop
          rm -rf apps/desktop/release
          npm run builder --workspace apps/desktop -- --linux --${{ matrix.arch }} --dir --publish never
          HERMES_DESKTOP_SKIP_BUILD=1 \
            HERMES_DESKTOP_TEST_ARCH=${{ matrix.arch }} \
            npm run test:desktop:all --workspace apps/desktop

      - name: Write packaged-Desktop receipt
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARCH: ${{ matrix.arch }}
          UNPACKED: ${{ matrix.unpacked }}
        shell: bash
        run: |
          set -euo pipefail
          root="apps/desktop/release/$UNPACKED"
          test -f "$root/Hermes"
          test -f "$root/resources/app.asar"
          {
            echo "head=$HEAD_SHA"
            echo "arch=$ARCH"
            echo "unpacked=$UNPACKED"
            echo "electron=$(node -p "require('./node_modules/electron/package.json').version")"
            sha256sum "$root/Hermes"
            sha256sum "$root/resources/app.asar"
            find "$root/resources" -maxdepth 2 -type f -printf '%P %s\n' | sort | head -200
          } > "desktop-$ARCH-receipt.txt"
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload packaged-Desktop witness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: exact-desktop-${{ matrix.arch }}-${{ github.event.pull_request.head.sha }}
          path: desktop-${{ matrix.arch }}-receipt.txt
          retention-days: 30
          if-no-files-found: error

  exact-docker:
    name: Docker build and integration (${{ matrix.arch }})
    if: >-
      github.event.pull_request.number == 96 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'trigger/91042-current-main' &&
      github.event.pull_request.base.ref == 'evidence/89479-current-main' &&
      github.event.action == 'reopened'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Checkout exact product
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Prove exact parent
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build exact image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: ${{ matrix.platform }}
          tags: hermes-agent:89479-${{ matrix.arch }}
          build-args: |
            HERMES_GIT_SHA=${{ github.event.pull_request.head.sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"

      - name: Install Python 3.11 and locked test dependencies
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Sync locked test dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra dev

      - name: Run Docker integration tests
        env:
          HERMES_TEST_IMAGE: hermes-agent:89479-${{ matrix.arch }}
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: scripts/run_tests.sh tests/docker/ --file-timeout 600

      - name: Write Docker receipt
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "head=$HEAD_SHA"
            echo "arch=$ARCH"
            docker image inspect "hermes-agent:89479-$ARCH" \
              --format 'id={{.Id}} size={{.Size}} created={{.Created}}'
          } > "docker-$ARCH-receipt.txt"

      - name: Upload Docker witness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: exact-docker-${{ matrix.arch }}-${{ github.event.pull_request.head.sha }}
          path: docker-${{ matrix.arch }}-receipt.txt
          retention-days: 30
          if-no-files-found: error

  exact-nix:
    name: Nix flake and Desktop derivation
    if: >-
      github.event.pull_request.number == 96 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'trigger/91042-current-main' &&
      github.event.pull_request.base.ref == 'evidence/89479-current-main' &&
      github.event.action == 'reopened'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout exact product
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Prove exact parent
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"

      - name: Set up Nix
        uses: ./.github/actions/nix-setup

      - name: Run flake checks and build the Desktop derivation
        shell: bash
        run: |
          set -euo pipefail
          nix flake check --show-trace --print-build-logs
          nix build .#desktop --no-link --print-build-logs
          {
            echo "head=${{ github.event.pull_request.head.sha }}"
            echo "parent=${{ github.event.pull_request.base.sha }}"
            echo "desktop_drv=$(nix path-info --derivation .#desktop)"
            echo "default_drv=$(nix path-info --derivation .#default)"
          } > nix-receipt.txt

      - name: Upload Nix witness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: exact-nix-${{ github.event.pull_request.head.sha }}
          path: nix-receipt.txt
          retention-days: 30
          if-no-files-found: error

  exact-object-receipt:
    name: Publish exact-object aggregate receipt
    needs: [exact-npm, exact-desktop, exact-docker, exact-nix]
    if: >-
      always() &&
      github.event.pull_request.number == 96 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'trigger/91042-current-main' &&
      github.event.pull_request.base.ref == 'evidence/89479-current-main' &&
      github.event.action == 'reopened'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout exact product
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Publish aggregate status and receipt
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NPM_RESULT: ${{ needs.exact-npm.result }}
          DESKTOP_RESULT: ${{ needs.exact-desktop.result }}
          DOCKER_RESULT: ${{ needs.exact-docker.result }}
          NIX_RESULT: ${{ needs.exact-nix.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"

          state=success
          for result in "$NPM_RESULT" "$DESKTOP_RESULT" "$DOCKER_RESULT" "$NIX_RESULT"; do
            if [ "$result" != success ]; then
              state=failure
            fi
          done

          ELECTRON_VERSION=$(node -p "require('./apps/desktop/package.json').devDependencies.electron")
          H2_VERSION=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('uv.lock').read_text()
          match = re.search(r'\[\[package\]\]\nname = "h2"\nversion = "([^"]+)"', text)
          print(match.group(1) if match else 'missing')
          PY
          )

          cat > exact-object-receipt.json <<EOF
          {
            "delivery_pr": "https://github.com/NousResearch/hermes-agent/pull/89479",
            "evidence_pr": "https://github.com/$GITHUB_REPOSITORY/pull/$EVIDENCE_PR",
            "head": "$HEAD_SHA",
            "parent": "$BASE_SHA",
            "electron": "$ELECTRON_VERSION",
            "h2": "$H2_VERSION",
            "npm_python": "$NPM_RESULT",
            "desktop_x64_arm64": "$DESKTOP_RESULT",
            "docker_amd64_arm64": "$DOCKER_RESULT",
            "nix": "$NIX_RESULT",
            "aggregate": "$state",
            "workflow_run": "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          }
          EOF

          if [ "$state" = success ]; then
            description='Exact npm/Python, Desktop, Docker, and Nix witnesses passed'
          else
            description='One or more exact-object dependency-security witnesses failed'
          fi
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context='dependency-security/exact-object' \
            -f description="$description" \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/tmp/status.json

          cat > /tmp/exact-comment.md <<EOF
          Exact-object dependency-security witness: **$state**

          - head: [\`$HEAD_SHA\`](https://github.com/$GITHUB_REPOSITORY/commit/$HEAD_SHA)
          - exact upstream parent: [\`$BASE_SHA\`](https://github.com/NousResearch/hermes-agent/commit/$BASE_SHA)
          - Electron: \`$ELECTRON_VERSION\`
          - h2: \`$H2_VERSION\`
          - npm/Python lock witness: \`$NPM_RESULT\`
          - packaged Desktop x64 + ARM64: \`$DESKTOP_RESULT\`
          - Docker amd64 + arm64 integration: \`$DOCKER_RESULT\`
          - Nix flake + Desktop derivation: \`$NIX_RESULT\`
          - run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Repository CI and the official OSV SARIF workflow run independently on this same head and are read back before handoff to #89479.
          EOF
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$EVIDENCE_PR/comments" \
            --raw-field body="$(cat /tmp/exact-comment.md)" >/tmp/comment.json

          if [ "$state" != success ]; then
            exit 1
          fi

      - name: Upload aggregate receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: exact-object-89479-${{ github.event.pull_request.head.sha }}
          path: exact-object-receipt.json
          retention-days: 30
          if-no-files-found: error
