name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        hermes-ref:
          # Minimum supported terminal-provider API and extraction-time main.
          - "0484910787df66ee5527d67d102ade80020b54f3"
          - "76e306c45843607e6dc135d23c13d3654417ebd5"
    steps:
      - name: Checkout plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Checkout Hermes Agent
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes-ref }}
          path: .hermes-agent
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .hermes-agent
          python -m pip install -e '.[test]'
      - name: Unit tests
        run: pytest -m 'not integration'
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Native plugin E2E
        run: hermes plugins doctor . --ci
