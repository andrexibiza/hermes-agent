name: Phase G final trusted publisher

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: phase-g-final-trusted-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'andrexibiza/hermes-agent' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'automation/phase-g-final-trigger-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UPSTREAM_REPO: NousResearch/hermes-agent
      FORK_REPO: andrexibiza/hermes-agent
      BASE_SHA: f293e7206b4ddd66042329442c6afebc19a8808d
      MATERIALIZER_SHA: 93df446a0f416b3088cccf4848b9d6e3ecc6847f
      PUBLISHER_SHA: ddcc9b27896683f4ab620aa631cbe7f7daf7b8dd
      FINAL_BRANCH: security/process-edge-authority-phase-g-final

    steps:
      - name: Checkout exact reviewed publisher object
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: andrexibiza/hermes-agent
          ref: ${{ env.PUBLISHER_SHA }}
          path: control
          fetch-depth: 1

      - name: Checkout exact signed transport source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: andrexibiza/hermes-agent
          ref: ${{ env.MATERIALIZER_SHA }}
          path: source
          fetch-depth: 1

      - name: Checkout exact verified upstream main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.BASE_SHA }}
          path: product
          fetch-depth: 0

      - name: Extract reviewed publisher program
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            doc = YAML.load_file(ARGV[0])
            step = doc.fetch("jobs").fetch("publish").fetch("steps").find {
              |item| item["name"] == "Materialize, self-review, test, and publish one clean commit"
            }
            abort("reviewed publisher step missing") unless step
            File.write(ARGV[1], step.fetch("run"))
          ' control/.github/workflows/phase-g-final-publisher.yml /tmp/phase-g-final-publisher.sh
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/phase-g-final-publisher.sh')
          source = path.read_text(encoding='utf-8')
          needle = 'actual=$(git status --porcelain=v1 | sed -E \'s/^.. //\' | sort)'
          replacement = (
              'find . -type d -name __pycache__ -prune -exec rm -rf {} +\n'
              'find . -type f -name \'*.py[co]\' -delete\n'
              + needle
          )
          if source.count(needle) != 1:
              raise SystemExit('publisher diff anchor changed')
          path.write_text(source.replace(needle, replacement, 1), encoding='utf-8')
          PY
          bash -n /tmp/phase-g-final-publisher.sh

      - name: Execute self-reviewed publisher
        working-directory: product
        shell: bash
        run: bash /tmp/phase-g-final-publisher.sh

      - name: Record exact publication receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Phase G final publisher'
            echo
            echo "base: \`$BASE_SHA\`"
            echo "source: \`$MATERIALIZER_SHA\`"
            if [ -s /tmp/phase-g-final-sha ]; then
              echo "final: \`$(cat /tmp/phase-g-final-sha)\`"
              echo 'status: published'
            else
              echo 'status: failed before publication'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f control/phase-g-publisher.log ]; then
            tail -n 400 control/phase-g-publisher.log
          fi
