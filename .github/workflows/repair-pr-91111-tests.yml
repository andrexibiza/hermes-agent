name: Repair PR 91111 governed approval tests

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-pr-91111-tests.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout target branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: campaign/hermes-tag-kernel
          fetch-depth: 0

      - name: Update rollback tests to use governed approval authority
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from textwrap import dedent

          path = Path("tests/gateway/hermes_tag/test_policy_enforcement.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "    CapabilityRegistry,\n",
              "    CapabilityRegistry,\n    ContextBundle,\n",
              1,
          )
          text = text.replace(
              "    ScopeRef,\n",
              "    ScopeRef,\n    SurfaceRef,\n    TurnAdmission,\n",
              1,
          )
          text = text.replace(
              "    arguments_digest,\n",
              "    arguments_digest,\n    new_id,\n",
              1,
          )

          helper = dedent('''

          def _turn_admission(principal, surface, scope):
              assert scope.continuity_id is not None
              return TurnAdmission(
                  admission_id=new_id("admission"),
                  principal=principal,
                  surface=surface,
                  scope=scope,
                  continuity_id=scope.continuity_id,
                  context=ContextBundle(facts=()),
                  shadow=False,
              )


          def _grant_exact_approval(kernel, admission, intent, scope):
              authorization = kernel.authorize_approval_grant(
                  admission,
                  principal_id=admission.principal.principal_id,
                  intent_digest=intent.digest,
                  scope_digest=scope.digest,
              )
              assert authorization.decision.outcome is DecisionOutcome.ALLOW
              assert authorization.lease is not None
              assert authorization.token is not None
              return kernel.grant_approval(
                  admission,
                  authorization,
                  principal_id=admission.principal.principal_id,
                  intent_digest=intent.digest,
                  scope_digest=scope.digest,
              )
          ''')
          marker = "\n\ndef test_builtin_registry_has_expected_horizontal_capabilities():"
          if marker not in text:
              raise SystemExit("helper insertion marker not found")
          text = text.replace(marker, helper + marker, 1)

          def replace_test(name, body):
              global text
              pattern = rf"def {re.escape(name)}\(.*?(?=\n\ndef |\Z)"
              updated, count = re.subn(pattern, dedent(body).rstrip(), text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"test block not found: {name}")
              text = updated

          replace_test(
              "test_missing_signing_authority_restores_consumed_approval",
              '''
              def test_missing_signing_authority_restores_consumed_approval(
                  ledger, bound_principal, surface, scope
              ):
                  rules = (PolicyRule("allow", DecisionOutcome.ALLOW, reason="allow"),)
                  producer = HermesTagKernel(
                      ledger,
                      HermesTagConfig.from_mapping({"enabled": True}),
                      rules=rules,
                      lease_authority=LeaseAuthority(b"p" * 32),
                  )
                  intent, _ = _intent(
                      producer.capabilities,
                      scope,
                      capability="process.spawn",
                      action="spawn",
                  )
                  grant = _grant_exact_approval(
                      producer,
                      _turn_admission(bound_principal, surface, scope),
                      intent,
                      scope,
                  )

                  kernel = HermesTagKernel(
                      ledger,
                      HermesTagConfig.from_mapping({"enabled": True}),
                      rules=rules,
                  )
                  with pytest.raises(LeaseError, match="no lease"):
                      kernel.authorize(
                          bound_principal,
                          capability="process.spawn",
                          action="spawn",
                          resource="slack:C_ENGINEERING",
                          arguments={"text": "hello"},
                          scope=scope,
                      )
                  assert kernel.policy.approvals.get(grant.approval_id).used_at is None
              ''',
          )
          replace_test(
              "test_lease_issuance_failure_releases_budget_and_restores_approval",
              '''
              def test_lease_issuance_failure_releases_budget_and_restores_approval(
                  ledger, bound_principal, surface, scope, monkeypatch
              ):
                  authority = LeaseAuthority(b"q" * 32)
                  kernel = HermesTagKernel(
                      ledger,
                      HermesTagConfig.from_mapping(
                          {"enabled": True, "budgets": {"hourly_tokens": 100}}
                      ),
                      rules=(PolicyRule("allow", DecisionOutcome.ALLOW, reason="allow"),),
                      lease_authority=authority,
                  )
                  intent, _ = _intent(
                      kernel.capabilities,
                      scope,
                      capability="process.spawn",
                      action="spawn",
                  )
                  grant = _grant_exact_approval(
                      kernel,
                      _turn_admission(bound_principal, surface, scope),
                      intent,
                      scope,
                  )

                  def fail_issue(*_args, **_kwargs):
                      raise LeaseError("synthetic issuance failure")

                  monkeypatch.setattr(authority, "issue", fail_issue)
                  with pytest.raises(LeaseError, match="synthetic"):
                      kernel.authorize(
                          bound_principal,
                          capability="process.spawn",
                          action="spawn",
                          resource="slack:C_ENGINEERING",
                          arguments={"text": "hello"},
                          scope=scope,
                          projected_tokens=40,
                      )
                  assert ledger.budget_usage(scope.digest)["hour"]["tokens"] == 0
                  assert kernel.policy.approvals.get(grant.approval_id).used_at is None
              ''',
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest pytest-asyncio pyyaml ruff

      - name: Verify focused suite and lint
        run: |
          python -m ruff check gateway/hermes_tag tests/gateway/hermes_tag
          python -m pytest -q -o addopts= \
            tests/gateway/hermes_tag/test_policy_enforcement.py \
            tests/gateway/hermes_tag/test_authority_boundaries.py

      - name: Commit and push repair
        run: |
          git config user.name "Andrex Ibiza, MBA"
          git config user.email "andrexibiza@gmail.com"
          git add tests/gateway/hermes_tag/test_policy_enforcement.py
          git commit -s -m "test(hermes-tag): use governed approval authority"
          git push origin HEAD:campaign/hermes-tag-kernel
