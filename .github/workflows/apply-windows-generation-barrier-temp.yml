name: Materialize verified Windows update generation barrier

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-windows-generation-barrier-temp.yml
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  materialize:
    name: Publish exact six-file product source
    if: github.repository == 'andrexibiza/hermes-agent'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      TARGET_BRANCH: fix/windows-update-generation-barrier
      SOURCE_BRANCH: ci/windows-generation-source-artifact
      ARTIFACT_BASE: 23a64a97ec928945b49389e8dfb6d06a11cb0132
      PATCH_BLOB: 576af882db8851413af01f4e89195ffe858dbaab
      PATCH_SHA256: 418dcfb39d3edd4ed29b8cc7435eda010bef3ed8e6925837dafa8e42754118a9
      PATCH_BYTES: '79046'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/windows-update-generation-barrier
          fetch-depth: 0

      - name: Reconstruct, verify, and publish exact product source
        shell: bash
        run: |
          set -euo pipefail

          expected_paths=$(printf '%s\n' \
            hermes_cli/update_cmd.py \
            hermes_cli/update_generation.py \
            hermes_cli/update_generation_worker.py \
            hermes_cli/update_lock.py \
            tests/hermes_cli/test_update_generation.py \
            tests/hermes_cli/test_update_lock.py | sort)

          exact_postimage_present() {
            [[ -f hermes_cli/update_generation.py ]] || return 1
            [[ -f hermes_cli/update_generation_worker.py ]] || return 1
            echo '822f3e94e9b9aa6d6c16d0472e25ec28a31b0529090bed7fc55bd9185aaf1cb1  hermes_cli/update_cmd.py' | sha256sum -c - >/dev/null || return 1
            echo '0bf28b51602b8c2937354b41aa924194732ea3d182fc91e4e34914e0c0548504  hermes_cli/update_generation.py' | sha256sum -c - >/dev/null || return 1
            echo 'efeddc8c2f22edec1e142b75ccb48688a33f0930cbaa1eb1d4a74b0c6bb8234a  hermes_cli/update_generation_worker.py' | sha256sum -c - >/dev/null || return 1
            echo 'd69ed5fb7e213cd12ca68d70c69d79e20433c828d1caf9805bb93f9af82a18c9  hermes_cli/update_lock.py' | sha256sum -c - >/dev/null || return 1
            echo '2dc10f31117abc86cc3d74839ce4b7ecdb710e8301c2cd2bffab9290e0e97777  tests/hermes_cli/test_update_generation.py' | sha256sum -c - >/dev/null || return 1
            echo 'a5f39160c4346081ef630f34fdfc34da7e2bea09d2dc9de8f0ad3079340b191c  tests/hermes_cli/test_update_lock.py' | sha256sum -c - >/dev/null || return 1
          }

          if exact_postimage_present; then
            echo 'Exact reviewed source is already the branch head; no mutation required.'
            exit 0
          fi

          git config core.autocrlf false
          git config core.longpaths true
          git config user.name 'Axl Ibiza'
          git config user.email '84248988+andrexibiza@users.noreply.github.com'

          original_head=$(git rev-parse HEAD)
          git fetch --no-tags origin "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          git show "refs/remotes/origin/${SOURCE_BRANCH}:.hermes-patches/windows-generation/source.patch" > /tmp/windows-generation.patch
          test "$(git hash-object /tmp/windows-generation.patch)" = "${PATCH_BLOB}"
          test "$(sha256sum /tmp/windows-generation.patch | cut -d' ' -f1)" = "${PATCH_SHA256}"
          test "$(wc -c < /tmp/windows-generation.patch)" -eq "${PATCH_BYTES}"

          git fetch --no-tags https://github.com/NousResearch/hermes-agent.git main
          upstream_main=$(git rev-parse FETCH_HEAD)
          echo "Current upstream main: ${upstream_main}"
          git merge-base --is-ancestor "${ARTIFACT_BASE}" "${upstream_main}"

          touched=(
            hermes_cli/update_cmd.py
            hermes_cli/update_generation.py
            hermes_cli/update_generation_worker.py
            hermes_cli/update_lock.py
            tests/hermes_cli/test_update_generation.py
            tests/hermes_cli/test_update_lock.py
          )
          if ! git diff --quiet "${ARTIFACT_BASE}" "${upstream_main}" -- "${touched[@]}"; then
            echo 'Current main changed a reviewed source path; refusing automatic composition.' >&2
            git diff --name-status "${ARTIFACT_BASE}" "${upstream_main}" -- "${touched[@]}" >&2
            exit 1
          fi

          git reset --hard "${upstream_main}"
          git apply --index --check /tmp/windows-generation.patch
          git apply --index /tmp/windows-generation.patch
          git diff --cached --check
          test "$(git diff --cached --name-only | sort)" = "${expected_paths}"
          exact_postimage_present

          python -m pip install --disable-pip-version-check -q \
            pytest==9.1.1 psutil==7.2.2 python-dotenv==1.2.2 pyyaml==6.0.3 ruff==0.15.10
          python -m py_compile \
            hermes_cli/update_cmd.py \
            hermes_cli/update_generation.py \
            hermes_cli/update_generation_worker.py \
            hermes_cli/update_lock.py \
            hermes_cli/update_receipt.py \
            tests/hermes_cli/test_update_generation.py \
            tests/hermes_cli/test_update_lock.py \
            tests/hermes_cli/test_update_receipt.py
          python -m ruff check \
            hermes_cli/update_cmd.py \
            hermes_cli/update_generation.py \
            hermes_cli/update_generation_worker.py \
            hermes_cli/update_lock.py \
            tests/hermes_cli/test_update_generation.py \
            tests/hermes_cli/test_update_lock.py
          python -m pytest -q \
            tests/hermes_cli/test_update_generation.py \
            tests/hermes_cli/test_update_lock.py \
            tests/hermes_cli/test_update_receipt.py
          python scripts/check-windows-footguns.py \
            hermes_cli/update_cmd.py \
            hermes_cli/update_generation.py \
            hermes_cli/update_generation_worker.py \
            hermes_cli/update_lock.py \
            tests/hermes_cli/test_update_generation.py \
            tests/hermes_cli/test_update_lock.py

          git commit -m 'feat(update): enforce Windows dependency generations (#88683)' \
            -m 'Materializes the exact six-file source verified by #91327.' \
            -m "Current upstream base: ${upstream_main}" \
            -m "Reviewed patch blob: ${PATCH_BLOB}" \
            -m 'Receipt substrate: #91283.' \
            -m 'Refs #88683; Part of #91277.'
          published_head=$(git rev-parse HEAD)
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${original_head}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "Published exact product head: ${published_head}"
