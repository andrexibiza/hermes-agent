name: One-shot #91042 resolution-cutoff repair

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: one-shot-91042-resolution-cutoff
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'security/p0-dependency-remediation-20260820'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.9.28'

      - name: Restore the base resolution cutoff without changing the remediation graph
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('uv.lock')
          text = path.read_text(encoding='utf-8')
          expected = 'exclude-newer = "2026-08-04T07:06:16.774262776Z"'
          matches = re.findall(r'^exclude-newer = "[^"]+"$', text, flags=re.MULTILINE)
          if len(matches) != 1:
              raise SystemExit(f'expected one global exclude-newer line, found {matches!r}')
          text = text.replace(matches[0], expected, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify the exact lock contract
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path('uv.lock').read_text(encoding='utf-8')
          if 'exclude-newer = "2026-08-04T07:06:16.774262776Z"' not in text:
              raise SystemExit('base resolution cutoff was not restored')
          for package, version in [('h2', '4.4.1'), ('hpack', '4.2.0')]:
              match = re.search(
                  rf'\[\[package\]\]\nname = "{package}"\nversion = "([^"]+)"',
                  text,
              )
              if not match or match.group(1) != version:
                  raise SystemExit(f'{package} lock is {match.group(1) if match else "missing"}')
          PY
          uv lock --check
          git diff --check

      - name: Publish the exact-object correction
        run: |
          if git diff --quiet -- uv.lock; then
            echo 'The exact branch already preserves the base cutoff.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uv.lock
          git commit -m 'fix(deps): preserve the existing resolution cutoff'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
