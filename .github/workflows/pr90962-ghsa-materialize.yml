name: Materialize PR 90962 dependency remediation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pr90962-ghsa-materialize.yml

permissions:
  contents: write

concurrency:
  group: pr90962-ghsa-materialize
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact PR branch with fork credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: security/ghsa-remediation-c47f0b4
          fetch-depth: 0
          persist-credentials: true

      - name: Restack on exact current upstream main
        run: |
          set -euo pipefail
          echo "EXPECTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch --no-tags upstream main
          git reset --hard upstream/main
          git clean -fdx
          echo "UPSTREAM_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install npm 12
        run: npm --version | grep -q '^12\.' || npm install --global npm@12

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.9.28'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Apply manifest and packaged-layout corrections
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          ELECTRON = '41.10.4'
          NANOID = '3.3.18'
          POSTCSS = '8.5.23'

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def write(path, data):
              Path(path).write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          root = load('package.json')
          root['overrides'].pop('nanoid@^3', None)
          root['overrides']['postcss'] = {'.': POSTCSS, 'nanoid': NANOID}
          if root['overrides'].get('nanoid@^6') != '6.0.0':
              raise SystemExit('Nano ID v6 authority changed before remediation')
          for key in list(root['allowScripts']):
              if key.startswith('electron@'):
                  root['allowScripts'].pop(key)
          root['allowScripts'][f'electron@{ELECTRON}'] = True
          write('package.json', root)

          website = load('website/package.json')
          website['overrides']['nanoid'] = NANOID
          write('website/package.json', website)

          desktop = load('apps/desktop/package.json')
          desktop['devDependencies']['electron'] = ELECTRON
          desktop['build']['electronVersion'] = ELECTRON
          write('apps/desktop/package.json', desktop)

          npmrc = Path('.npmrc')
          text = npmrc.read_text(encoding='utf-8')
          old = '# nanoid 3.3.17 includes fixes for GHSA-2v37-7h3g-55p8. remove when > 2wks old (rel 2026-08-03)'
          new = '# nanoid 3.3.18 includes fixes for GHSA-2v37-7h3g-55p8. remove when > 2wks old (rel 2026-08-07)'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Nano ID release-age exception anchor not found')
          npmrc.write_text(text, encoding='utf-8')

          Path('apps/desktop/scripts/packaged-app-layout.mjs').write_text(
              "export function resolveLinuxUnpackedDirName(arch) {\n"
              "  return arch === 'x64' ? 'linux-unpacked' : `linux-${arch}-unpacked`\n"
              "}\n",
              encoding='utf-8',
          )
          Path('apps/desktop/scripts/packaged-app-layout.test.mjs').write_text(
              "import assert from 'node:assert/strict'\n"
              "import { test } from 'vitest'\n\n"
              "import { resolveLinuxUnpackedDirName } from './packaged-app-layout.mjs'\n\n"
              "test('uses electron-builder default directory on Linux x64', () => {\n"
              "  assert.equal(resolveLinuxUnpackedDirName('x64'), 'linux-unpacked')\n"
              "})\n\n"
              "test('includes architecture in electron-builder Linux ARM64 directory', () => {\n"
              "  assert.equal(resolveLinuxUnpackedDirName('arm64'), 'linux-arm64-unpacked')\n"
              "})\n",
              encoding='utf-8',
          )

          target = Path('apps/desktop/scripts/test-desktop.mjs')
          text = target.read_text(encoding='utf-8')
          anchor = "import PACKAGE_JSON from '../package.json' with { type: 'json' }"
          helper = "import { resolveLinuxUnpackedDirName } from './packaged-app-layout.mjs'"
          if helper not in text:
              if anchor not in text:
                  raise SystemExit('test-desktop import anchor not found')
              text = text.replace(anchor, helper + '\n' + anchor, 1)
          old_layout = "  // linux unpacked layout matches windows but with different binary name\n  const unpacked = path.join(RELEASE_ROOT, 'linux-unpacked')"
          new_layout = "  // electron-builder includes the architecture suffix for non-x64 Linux output.\n  const unpacked = path.join(RELEASE_ROOT, resolveLinuxUnpackedDirName(ARCH))"
          if old_layout in text:
              text = text.replace(old_layout, new_layout, 1)
          elif new_layout not in text:
              raise SystemExit('test-desktop Linux layout anchor not found')
          target.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate exact lock graphs without moving global cutoff
        run: |
          set -euo pipefail
          cp uv.lock /tmp/uv.lock.before
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix website install --package-lock-only --ignore-scripts --no-audit --no-fund
          uv lock --upgrade-package h2

          python3 - <<'PY'
          import json, re
          from pathlib import Path

          path = Path('package-lock.json')
          lock = json.loads(path.read_text(encoding='utf-8'))
          touched = []
          for package_path, package in lock['packages'].items():
              version = package.get('version', '')
              if package_path.endswith('/nanoid') and version.startswith('3.'):
                  package['version'] = '3.3.18'
                  package['resolved'] = 'https://registry.npmjs.org/nanoid/-/nanoid-3.3.18.tgz'
                  package['integrity'] = 'sha512-DTg4MJbGMWkfi6VZFdNt2/caMbQy4Ou+Op/hJQvGEWcnVfoA1QA+xzRKAzw9jD6+GVOOeYr/mIcuDSdug6F6+w=='
                  touched.append(package_path)
          if not touched:
              raise SystemExit('No Nano ID v3 lock entries were found')
          path.write_text(json.dumps(lock, indent=2) + '\n', encoding='utf-8')

          before = Path('/tmp/uv.lock.before').read_text(encoding='utf-8')
          uv_path = Path('uv.lock')
          after = uv_path.read_text(encoding='utf-8')
          match = re.search(r'(?m)^exclude-newer = "([^"]+)"$', before)
          if not match:
              raise SystemExit('pre-existing exclude-newer field is missing')
          after, count = re.subn(r'(?m)^exclude-newer = "[^"]+"$', f'exclude-newer = "{match.group(1)}"', after, count=1)
          if count != 1:
              raise SystemExit(f'expected one exclude-newer field, replaced {count}')
          uv_path.write_text(after, encoding='utf-8')
          print('updated Nano ID v3 lock entries:', ', '.join(touched))
          PY
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install and verify exact dependency graphs
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm --prefix website ci --no-audit --no-fund
          uv lock --check

          node <<'NODE'
          const root = require('./package.json')
          const desktop = require('./apps/desktop/package.json')
          const lock = require('./package-lock.json')
          const website = require('./website/package.json')
          const websiteLock = require('./website/package-lock.json')
          const postcss = root.overrides.postcss
          if (root.overrides['nanoid@^3'] !== undefined) throw new Error('flat Nano ID v3 override remains')
          if (postcss?.['.'] !== '8.5.23' || postcss?.nanoid !== '3.3.18') throw new Error(`PostCSS/Nano ID override drifted: ${JSON.stringify(postcss)}`)
          if (root.overrides['nanoid@^6'] !== '6.0.0') throw new Error('Nano ID v6 authority drifted')
          if (website.overrides.nanoid !== '3.3.18') throw new Error('website Nano ID override drifted')
          if (desktop.devDependencies.electron !== '41.10.4' || desktop.build.electronVersion !== '41.10.4') throw new Error('Electron authorities drifted')
          if (root.allowScripts['electron@40.10.2'] !== undefined || root.allowScripts['electron@41.10.4'] !== true) throw new Error('Electron lifecycle authority drifted')
          const electron = lock.packages['node_modules/electron'] || lock.packages['apps/desktop/node_modules/electron']
          if (!electron || electron.version !== '41.10.4') throw new Error(`Electron lock resolved ${electron?.version}`)
          let rootNanoid3 = 0
          for (const [packagePath, pkg] of Object.entries(lock.packages)) {
            if (packagePath.endsWith('/nanoid') && pkg.version?.startsWith('3.')) {
              rootNanoid3 += 1
              if (pkg.version !== '3.3.18') throw new Error(`${packagePath} resolves Nano ID ${pkg.version}`)
            }
            if (packagePath.endsWith('/extract-zip') && pkg.version === '2.0.1') throw new Error(`${packagePath} still resolves extract-zip 2.0.1`)
          }
          if (!rootNanoid3) throw new Error('no root Nano ID v3 lock resolution inspected')
          let websiteNanoid3 = 0
          for (const [packagePath, pkg] of Object.entries(websiteLock.packages)) {
            if (packagePath.endsWith('/nanoid') && pkg.version?.startsWith('3.')) {
              websiteNanoid3 += 1
              if (pkg.version !== '3.3.18') throw new Error(`website ${packagePath} resolves Nano ID ${pkg.version}`)
            }
          }
          if (!websiteNanoid3) throw new Error('no website Nano ID v3 lock resolution inspected')
          NODE

          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          def versions(path):
              data = tomllib.loads(Path(path).read_text(encoding='utf-8'))
              grouped = {}
              for package in data.get('package', []):
                  grouped.setdefault(package['name'], []).append(package['version'])
              return data, {name: tuple(sorted(values)) for name, values in grouped.items()}

          before_data, before = versions('/tmp/uv.lock.before')
          after_data, after = versions('uv.lock')
          changed = {name for name in before.keys() | after.keys() if before.get(name) != after.get(name)}
          unexpected = changed - {'h2', 'hpack'}
          if unexpected:
              raise SystemExit(f'unexpected uv.lock package changes: {sorted(unexpected)}')
          if after.get('h2') != ('4.4.1',) or after.get('hpack') != ('4.2.0',):
              raise SystemExit(f'h2/hpack resolved to {after.get("h2")}/{after.get("hpack")}')
          if after_data.get('options', {}).get('exclude-newer') != before_data.get('options', {}).get('exclude-newer'):
              raise SystemExit('uv exclude-newer cutoff drifted')
          print('verified uv.lock changed packages:', sorted(changed))
          PY

      - name: Run audits and affected repository gates
        run: |
          set -euo pipefail
          npm audit --workspaces=false --audit-level=moderate
          npm audit --workspace web --audit-level=moderate
          npm audit --workspace ui-tui --audit-level=moderate
          npm audit --workspace apps/desktop --audit-level=moderate
          npm --prefix website audit --audit-level=moderate
          npm run build --workspace web
          npm run check --workspace ui-tui
          npm run check:lint --workspace apps/desktop
          npm run test:desktop:platforms --workspace apps/desktop
          npm run build --workspace apps/desktop
          npm run builder --workspace apps/desktop -- --linux --x64 --dir --publish never
          HERMES_DESKTOP_SKIP_BUILD=1 npm run test:desktop:all --workspace apps/desktop
          git diff --check

      - name: Verify exact change surface
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          .npmrc
          apps/desktop/package.json
          apps/desktop/scripts/packaged-app-layout.mjs
          apps/desktop/scripts/packaged-app-layout.test.mjs
          apps/desktop/scripts/test-desktop.mjs
          package-lock.json
          package.json
          uv.lock
          website/package-lock.json
          website/package.json
          EOF
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Publish exact verified PR head
        run: |
          set -euo pipefail
          git config user.name 'Axl Ibiza'
          git config user.email 'andrexibiza@gmail.com'
          git add .npmrc package.json package-lock.json uv.lock website/package.json website/package-lock.json \
            apps/desktop/package.json apps/desktop/scripts/test-desktop.mjs \
            apps/desktop/scripts/packaged-app-layout.mjs apps/desktop/scripts/packaged-app-layout.test.mjs
          git diff --cached --check
          git commit -m 'fix(deps): refresh security-sensitive pins' \
            -m 'Regenerate the affected Node and Python lock graphs on exact current main and keep the patched desktop runtime, builder, lifecycle allowlist, and packaged Linux layout in agreement.' \
            -m 'Co-authored-by: schmitzi8 <281458983+schmitzi8@users.noreply.github.com>' \
            -m 'Co-authored-by: orcaspainting-dev <264355715+orcaspainting-dev@users.noreply.github.com>'
          git push --force-with-lease=refs/heads/security/ghsa-remediation-c47f0b4:"$EXPECTED_HEAD" origin HEAD:security/ghsa-remediation-c47f0b4

      - name: Exact-object receipt
        run: |
          echo "published_head=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "upstream_base=$UPSTREAM_SHA" >> "$GITHUB_STEP_SUMMARY"
