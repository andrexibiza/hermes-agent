name: Publish #86354 exact product tree on installation (temporary)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-pr-86354-push.yml

permissions:
  contents: write

concurrency:
  group: publish-pr-86354-push
  cancel-in-progress: false

jobs:
  publish:
    name: Execute trusted exact-tree publisher
    if: github.repository == 'andrexibiza/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact authorized source head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: andrexibiza/hermes-agent
          ref: dd1ef90b44f72cff8a63aefc207ccc5c6735af58
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Execute publisher sourced only from trusted base commit
        shell: bash
        env:
          PUBLISHER_COMMIT: b7ca46eae07c8a599df0ec8c232e9c874bc0a73a
          PUBLISHER_BLOB: 5ec7c6458b50d535fa5679cc1029be08ce1a6953
          TRIGGER_HEAD: dd1ef90b44f72cff8a63aefc207ccc5c6735af58
          CURRENT_MAIN: b6bcb3e791c673e63974029bbab40cc9326803ff
          TARGET_BRANCH: fix/email-app-password-normalization
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_HEAD"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$TRIGGER_HEAD"

          git fetch --no-tags origin "$PUBLISHER_COMMIT"
          git show "$PUBLISHER_COMMIT:.github/workflows/publish-pr-86354.yml" > /tmp/publisher.yml
          test "$(git hash-object /tmp/publisher.yml)" = "$PUBLISHER_BLOB"

          python3 - <<'PY'
          import os
          from pathlib import Path

          lines = Path('/tmp/publisher.yml').read_text().splitlines()
          marker = '        run: |'
          starts = [index for index, line in enumerate(lines) if line == marker]
          if len(starts) != 1:
              raise SystemExit(f'expected one publisher run block, found {len(starts)}')
          body = []
          for line in lines[starts[0] + 1:]:
              if not line:
                  body.append('')
                  continue
              if not line.startswith('          '):
                  break
              body.append(line[10:])
          needle = '$' + '{{ github.event.pull_request.head.sha }}'
          script = '\n'.join(body).replace(needle, os.environ['TRIGGER_HEAD']) + '\n'
          Path('/tmp/publish-pr-86354.sh').write_text(script)
          PY

          bash -n /tmp/publish-pr-86354.sh
          bash /tmp/publish-pr-86354.sh
