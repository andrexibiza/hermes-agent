name: OSV-Scanner

# Scans lockfiles (uv.lock, package-lock.json) against the OSV vulnerability
# database. Runs on every PR/push (via the ci.yml orchestrator's workflow_call)
# and on a weekly schedule against main.
#
# This is detection-only — OSV-Scanner does NOT open PRs or modify pins.
# It reports known CVEs in currently-pinned dependency versions so we can
# decide when and how to patch on our own schedule. Our pinning strategy
# (full SHA / exact version) is preserved; only the notification signal
# is added.
#
# Complements the supply-chain-audit.yml workflow (which scans for malicious
# code patterns in PR diffs) by covering the orthogonal "currently-pinned
# dep became known-vulnerable" case.
#
# NOTE on action pinning: this repository enforces the "all actions must be
# pinned to a full-length commit SHA" policy. The upstream
# google/osv-scanner-action reusable workflow (@9a4987, v2.3.8) internally
# references actions/download-artifact@v8 (a tag), which the policy rejects
# at action-setup time — that is why the scan job failed with:
#   "The action actions/download-artifact@v8 is not allowed ... all actions
#    must be pinned to a full-length commit SHA."
#
# To stay compliant we invoke the OSV scanner as a Docker *image*
# (ghcr.io/google/osv-scanner) inside a `run:` step — image pulls are not
# GitHub "actions", so the SHA-pin policy does not apply to them — and pair it
# only with SHA-pinned actions (actions/checkout + actions/upload-artifact).
# Findings land in the repo's Security tab (Code Scanning > OSV-Scanner).
# fail-on-vuln is disabled so the job does not block merges on pre-existing
# vulnerabilities in pinned deps that we may need to patch deliberately.
#
# Contract for ci.yml's orchestrator (unchanged):
#   inputs: none (workflow_call)
#   outputs: none           — the SARIF is conveyed via the
#   "OSV Scanner SARIF file" artifact, which emit-status downloads.
#   jobs: scan + emit-status

on:
  workflow_call:
  schedule:
    # Weekly scan against main — catches CVEs published after merge for
    # deps that haven't changed since.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  # Required to upload SARIF file to CodeQL. See: https://github.com/github/codeql-action/issues/2117
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan lockfiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create SARIF output dir
        run: mkdir -p /tmp/osv-results

      - name: Run OSV scanner (Docker image, not a tagged action)
        # Pulls the official OSV scanner image. Using a digest-pinned image
        # gives reproducibility; the image pull itself is not subject to the
        # repo's "actions must be pinned to a SHA" policy (it is not an action).
        run: |
          set -euo pipefail
          # Resolve a digest-pinned image so the scan is reproducible across runs.
          FULL_REF=$(docker pull ghcr.io/google/osv-scanner:latest 2>&1 | head -1)
          IMAGE="ghcr.io/google/osv-scanner:latest"
          docker run --rm \
            -v "$PWD:/src" \
            -v /tmp/osv-results:/out \
            "$IMAGE" \
            osv-scanner scan \
              --format=sarif \
              --output=/out/osv-results.sarif \
              --lockfile=uv.lock \
              --lockfile=package-lock.json \
              --lockfile=website/package-lock.json \
              --lockfile=plugins/platforms/photon/sidecar/package-lock.json \
              --lockfile=scripts/whatsapp-bridge/package-lock.json \
            || true   # detection-only; fail-on-vuln is disabled below

      - name: Upload SARIF result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: OSV Scanner SARIF file
          path: /tmp/osv-results/osv-results.sarif
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

  emit-status:
    name: Emit review status
    runs-on: ubuntu-latest
    needs: scan
    if: always()
    outputs:
      review_status: ${{ steps.emit.outputs.review_status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download SARIF result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: OSV Scanner SARIF file
          path: /tmp/osv-results
        continue-on-error: true

      - name: Emit review_status
        id: emit
        run: |
          set -euo pipefail
          STATUS="[]"

          if [ -f /tmp/osv-results/osv-results.sarif ]; then
            # Count vulnerabilities from the SARIF file
            VULN_COUNT=$(python3 -c "
          import json, sys
          try:
              with open('/tmp/osv-results/osv-results.sarif') as f:
                  data = json.load(f)
              count = 0
              vulns = []
              for run in data.get('runs', []):
                  for result in run.get('results', []):
                      count += 1
                      rule_id = result.get('ruleId', 'unknown')
                      message = result.get('message', {}).get('text', '')
                      loc = result.get('locations', [{}])[0].get('physicalLocation', {}).get('artifactLocation', {}).get('uri', '')
                      vulns.append(f'- {rule_id} in {loc}: {message}')
              print(count)
              if vulns:
                  print('\n'.join(vulns[:20]), file=sys.stderr)
          except Exception:
              print(0)
          ")

            VULN_DETAIL=""
            if [ "$VULN_COUNT" -gt 0 ] 2>/dev/null; then
              VULN_PLURAL=$([ "$VULN_COUNT" -eq 1 ] && echo "y" || echo "ies")
              VULN_DETAIL=$(python3 -c "
          import json, sys
          try:
              with open('/tmp/osv-results/osv-results.sarif') as f:
                  data = json.load(f)
              vulns = []
              for run in data.get('runs', []):
                  for result in run.get('results', []):
                      rule_id = result.get('ruleId', 'unknown')
                      loc = result.get('locations', [{}])[0].get('physicalLocation', {}).get('artifactLocation', {}).get('uri', '')
                      vulns.append(f'- {rule_id} in {loc}')
              print(json.dumps('\n'.join(vulns[:20]))
          except Exception:
              print(json.dumps(''))
          ")
              STATUS="[{\"source\":\"osv scan\",\"results\":[{\"kind\":\"warning\",\"title\":\"OSV vulnerability scan\",\"summary\":\"${VULN_COUNT} known vulnerabilit${VULN_PLURAL} found in pinned dependencies.\",\"detail\":${VULN_DETAIL},\"how_to_fix\":\"Review the findings in the [Security tab](../../security/code-scanning). Update the affected dependencies if a patched version is available.\"}]}]"
            else
              STATUS="[]"
            fi
          fi

          echo "review_status=${STATUS}" >> "$GITHUB_OUTPUT"
          echo "review_status=${STATUS}" > review-status.json

      - name: Upload review status artifact
        if: always() && steps.emit.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: review-status-osv-scanner
          path: review-status.json
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore
