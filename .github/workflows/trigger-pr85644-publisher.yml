name: Trigger PR 85644 exact publisher

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read

concurrency:
  group: trigger-pr85644-exact-publisher
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'automation/trigger-pr85644-product-v3'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the exact-object publisher installed on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-pr-85644-exact-product.yml/dispatches" \
            -f ref=main
          echo 'Dispatched publish-pr-85644-exact-product.yml on main.'
