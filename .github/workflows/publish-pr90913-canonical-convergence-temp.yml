name: Publish verified canonical route identity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-pr90913-canonical-convergence-temp.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'andrexibiza/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out fork publisher
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Reconstruct, verify, and publish exact product source
        env:
          STAGING_BRANCH: tmp/pr90913-canonical-convergence
          STAGING_HEAD: 58ee2f25e98b9d431300ed22f40534789cfe7796
          SOURCE_BRANCH: fix/89719-authoritative-connection-id
          SOURCE_HEAD: 95659ed2fae7e7592e76bfa6ba667cb5714fb3a6
          STATUS_BRANCH: automation/pr90913-publisher-status
          TARGET_BRANCH: fix/connection-id-authority-followup
        shell: bash
        run: |
          set -euo pipefail

          LOG_FILE=/tmp/pr90913-publisher.log
          : > "$LOG_FILE"
          exec > >(tee -a "$LOG_FILE") 2>&1

          git config user.name "Axl Ibiza"
          git config user.email "84248988+andrexibiza@users.noreply.github.com"

          publish_marker() {
            local state="$1"
            local rc="$2"
            local target_head=''
            local upstream_head="${UPSTREAM_MAIN:-}"

            target_head=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}' || true)
            {
              printf 'state=%s\n' "$state"
              printf 'exit_code=%s\n' "$rc"
              printf 'run_commit=%s\n' "${GITHUB_SHA:-}"
              printf 'upstream_main=%s\n' "$upstream_head"
              printf 'target_head=%s\n' "$target_head"
              printf 'recorded_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            } > /tmp/pr90913-publisher-status.txt

            local log_blob status_blob tree_sha marker_commit
            log_blob=$(git hash-object -w "$LOG_FILE")
            status_blob=$(git hash-object -w /tmp/pr90913-publisher-status.txt)
            tree_sha=$(
              printf '100644 blob %s\tlog.txt\n100644 blob %s\tstatus.txt\n' "$log_blob" "$status_blob" |
                git mktree
            )
            marker_commit=$(printf 'ci: record pr90913 publisher %s\n' "$state" | git commit-tree "$tree_sha")
            git push --force origin "$marker_commit:refs/heads/$STATUS_BRANCH"
          }

          finish() {
            local rc=$?
            trap - EXIT
            set +e
            local state=failed
            if [[ "$rc" -eq 0 ]]; then
              state=success
            fi
            publish_marker "$state" "$rc"
            exit "$rc"
          }
          trap finish EXIT

          publish_marker running 0

          git fetch origin \
            "+refs/heads/$STAGING_BRANCH:refs/remotes/origin/$STAGING_BRANCH" \
            "+refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
          test "$(git rev-parse origin/$STAGING_BRANCH)" = "$STAGING_HEAD"
          test "$(git rev-parse origin/$SOURCE_BRANCH)" = "$SOURCE_HEAD"

          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream main
          UPSTREAM_MAIN=$(git rev-parse upstream/main)
          echo "Binding canonical product head to upstream main $UPSTREAM_MAIN"

          git show "$STAGING_HEAD:.tmp/pr90913/rewrite.py" > /tmp/pr90913-rewrite.py
          git show "$STAGING_HEAD:.tmp/pr90913/connection-registry-authority.test.ts" \
            > /tmp/connection-registry-authority.test.ts

          git checkout --detach "$UPSTREAM_MAIN"
          git show "$SOURCE_HEAD:apps/desktop/electron/connection-route-identity.ts" \
            > apps/desktop/electron/connection-route-identity.ts
          git show "$SOURCE_HEAD:apps/desktop/electron/desktop-remote-route.ts" \
            > apps/desktop/electron/desktop-remote-route.ts
          python /tmp/pr90913-rewrite.py
          cp /tmp/connection-registry-authority.test.ts \
            apps/desktop/electron/connection-registry-authority.test.ts

          npm ci --ignore-scripts --no-audit --no-fund

          cd apps/desktop
          npx vitest run --project electron \
            electron/connection-registry.test.ts \
            electron/connection-registry-authority.test.ts \
            electron/desktop-remote-route.test.ts
          npx tsc -p tsconfig.electron.json --noEmit
          npx eslint \
            electron/connection-registry.ts \
            electron/connection-registry-authority.test.ts \
            electron/connection-route-identity.ts \
            electron/desktop-remote-route.ts
          cd ../..

          git diff --check
          git add \
            apps/desktop/electron/connection-registry-authority.test.ts \
            apps/desktop/electron/connection-registry.ts \
            apps/desktop/electron/connection-route-identity.ts \
            apps/desktop/electron/desktop-remote-route.ts

          printf '%s\n' \
            apps/desktop/electron/connection-registry-authority.test.ts \
            apps/desktop/electron/connection-registry.ts \
            apps/desktop/electron/connection-route-identity.ts \
            apps/desktop/electron/desktop-remote-route.ts \
            | sort > /tmp/expected-files
          git diff --cached --name-only "$UPSTREAM_MAIN" | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files

          git commit -m "fix(desktop): unify authoritative route identity" \
            -m "Keep explicit connection identity authoritative only while its registry entry is live, and route every legacy compatibility inference through the same complete pre-dial auth and transport envelope used by Desktop route selection.\n\nAbsorbs the full matcher and collision matrix from #90198 into the stricter current-registration contract in #90913."
          git push --force origin "HEAD:refs/heads/$TARGET_BRANCH"
