name: Verify and publish #90623 CANTOPEN repair

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  verify-publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/90623-sessiondb-cantopen-capability'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/90623-sessiondb-cantopen-capability
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"

      - name: Materialize branch-stored repair
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/python3 - <<'PY'/{:a;n;/^          PY$/q;p;ba}" .github/workflows/zz-fix-90623-source.yml | sed 's/^          //' > /tmp/apply-90623.py
          test -s /tmp/apply-90623.py
          python3 /tmp/apply-90623.py
          git diff --check

      - name: Verify persistence boundaries
        shell: bash
        run: |
          set -euo pipefail
          uv run --with ruff==0.15.10 ruff check hermes_state.py tests/state/test_sessiondb_cantopen_capability.py
          uv run pytest -q \
            tests/state/test_sessiondb_cantopen_capability.py \
            tests/state/test_fts_runtime_rebuild.py \
            tests/test_state_db_malformed_repair.py
          python -m py_compile hermes_state.py
          git diff --check

      - name: Publish verified source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Andrex Ibiza, MBA'
          git config user.email 'andrexibiza@gmail.com'
          git rm -- .github/workflows/zz-fix-90623-source.yml
          git add -- hermes_state.py tests/state/test_sessiondb_cantopen_capability.py
          git diff --cached --check
          git commit -m 'fix(state): fail closed on SQLite CANTOPEN capability (#90623)'
          git push origin HEAD:fix/90623-sessiondb-cantopen-capability
