name: PR 91079 default-branch final publisher

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pr91079-default-publisher.yml
      - .github/pr91079-default-publisher-kick

permissions:
  contents: write

concurrency:
  group: pr91079-default-final-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'andrexibiza/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Execute the feature-owned canonical publisher
        shell: bash
        env:
          TARGET_BRANCH: fix/windows-desktop-pack-transaction
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          source_head="$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")"
          git switch --detach "$source_head"
          git show "$source_head:.github/workflows/pr91079-publish-final.yml" > /tmp/pr91079-publisher.yml

          export GITHUB_SHA="$source_head"
          export GITHUB_REF_NAME="$TARGET_BRANCH"
          export GITHUB_ENV=/tmp/pr91079-publisher.env
          : > "$GITHUB_ENV"

          ruby <<'RUBY'
          require 'yaml'
          doc = if YAML.respond_to?(:unsafe_load_file)
                  YAML.unsafe_load_file('/tmp/pr91079-publisher.yml')
                else
                  YAML.load_file('/tmp/pr91079-publisher.yml')
                end
          steps = doc.fetch('jobs').fetch('publish').fetch('steps')
          scripts = steps.filter_map { |step| step['run'] }
          abort "expected four publisher scripts, found #{scripts.length}" unless scripts.length == 4
          scripts.each_with_index do |script, index|
            File.write(format('/tmp/pr91079-step-%02d.sh', index + 1), script)
          end
          RUBY

          for script in /tmp/pr91079-step-*.sh; do
            bash "$script"
            if test -s "$GITHUB_ENV"; then
              set -a
              # shellcheck disable=SC1090
              . "$GITHUB_ENV"
              set +a
            fi
          done
