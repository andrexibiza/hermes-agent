name: Publish PR 91079 canonical Windows transaction tree — temporary

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-91079-windows-transaction-temp.yml
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr91079-final-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'andrexibiza/hermes-agent' && (github.event_name != 'pull_request' || github.head_ref == 'ops/pr91079-publisher-trigger')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact carrier branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/windows-desktop-pack-transaction
          fetch-depth: 0

      - name: Verify exact trigger object
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "publisher failed at shell line $LINENO with exit $status" >&2; exit $status' ERR
          trigger_sha="$(git rev-parse HEAD)"
          test "$trigger_sha" = "84fc3e2a8fa5ab97bf0edb86331286ccb84daa7a"
          git merge-base --is-ancestor db32f7bb0864f5944c6ed9f505d0b979bedc8f2f HEAD
          printf 'PR91079_TRIGGER_SHA=%s\n' "$trigger_sha" >> "$GITHUB_ENV"

      - name: Recompose canonical delivery on current upstream main
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "publisher failed at shell line $LINENO with exit $status" >&2; exit $status' ERR
          branch=fix/windows-desktop-pack-transaction
          implementation=db32f7bb0864f5944c6ed9f505d0b979bedc8f2f

          git fetch --no-tags https://github.com/NousResearch/hermes-agent.git \
            +refs/heads/main:refs/remotes/upstream/main
          base="$(git rev-parse refs/remotes/upstream/main)"
          git switch --detach "$base"

          implementation_paths=(
            apps/desktop/scripts/before-pack-recovery.mjs
            apps/desktop/scripts/before-pack.mjs
            apps/desktop/scripts/before-pack.test.mjs
            apps/desktop/scripts/desktop-builder-runtime.mjs
            apps/desktop/scripts/desktop-pack-recovery-composition.test.mjs
            apps/desktop/scripts/desktop-pack-transaction.mjs
            apps/desktop/scripts/desktop-pack-transaction.test.mjs
            apps/desktop/scripts/run-electron-builder.mjs
            apps/desktop/scripts/stage-native-deps-recovery.mjs
            apps/desktop/scripts/stage-native-deps-recovery.test.mjs
            apps/desktop/vitest.config.ts
            tests/hermes_cli/test_desktop_pack_transaction_windows.py
          )
          git checkout "$implementation" -- "${implementation_paths[@]}"

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('apps/desktop/package.json')
          s = p.read_text(encoding='utf-8')
          replacements = (
              (
                  '    "build": "node scripts/assert-root-install.mjs && node scripts/write-build-stamp.mjs && vite build && node scripts/bundle-electron-main.mjs && node scripts/stage-native-deps.mjs",',
                  '    "build": "node scripts/assert-root-install.mjs && node scripts/write-build-stamp.mjs && node scripts/bundle-electron-main.mjs && node scripts/stage-native-deps-recovery.mjs",',
              ),
              (
                  '    "check:test:desktop:all": "npm run test:desktop:all",',
                  '    "check:test:desktop:all": "node --test scripts/stage-native-deps-recovery.test.mjs && npm run test:desktop:all",',
              ),
              (
                  '    "beforePack": "scripts/before-pack.mjs",',
                  '    "beforePack": "scripts/before-pack-recovery.mjs",',
              ),
          )
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one package contract line: {old}')
              s = s.replace(old, new)

          data = json.loads(s)
          scripts = data['scripts']
          assert scripts['build'].endswith('node scripts/stage-native-deps-recovery.mjs')
          assert 'vite build' not in scripts['build']
          assert scripts['check:test:desktop:all'].startswith(
              'node --test scripts/stage-native-deps-recovery.test.mjs && '
          )
          assert data['build']['beforePack'] == 'scripts/before-pack-recovery.mjs'
          assert scripts['check:test:plugins'] == 'node --test src/plugins/*/tests/*.test.mjs'
          assert 'run-ui-shard.mjs' not in s
          p.write_text(s, encoding='utf-8')
          PY

          python - <<'PY'
          from pathlib import Path

          p = Path('hermes_cli/main.py')
          s = p.read_text(encoding='utf-8')
          start_marker = 'def _rollback_desktop_from_backup(packaged_executable: Path) -> Optional[Path]:\n'
          end_marker = '\ndef _ensure_desktop_exe_launchable(\n'
          if s.count(start_marker) != 1 or s.count(end_marker) != 1:
              raise SystemExit('desktop rollback composition anchors are not unique')
          a = s.index(start_marker)
          b = s.index(end_marker, a)
          replacement = '''def _rollback_desktop_from_backup(packaged_executable: Path) -> Optional[Path]:
              """Restore the previous unpacked desktop app from its ``.bak`` tree.

              Returns the restored executable path, or ``None`` when no usable backup
              exists or the filesystem transaction cannot complete. The invalid candidate
              is kept alongside as ``<unpacked-dir>.corrupt`` after a successful rollback.

              The live path is never deleted to make room for the backup. A stale
              quarantine must be retired before either generation moves; the candidate is
              then quarantined by rename, and backup promotion owns the commit point. If
              promotion fails, the candidate is moved back to the live path while the
              backup remains intact. Best-effort: never raises.
              """
              unpacked = packaged_executable.parent
              backup_dir = _desktop_backup_unpacked_dir(packaged_executable)
              backup_exe = backup_dir / packaged_executable.name
              if not backup_exe.exists():
                  return None
              if _desktop_exe_integrity_error(backup_exe) is not None:
                  return None

              corrupt_dir = unpacked.parent / (unpacked.name + ".corrupt")
              marker_path = backup_dir.with_name(backup_dir.name + ".session")

              if corrupt_dir.exists():
                  try:
                      shutil.rmtree(corrupt_dir)
                  except FileNotFoundError:
                      pass
                  except OSError:
                      return None

              try:
                  unpacked.rename(corrupt_dir)
              except OSError:
                  return None

              try:
                  backup_dir.rename(unpacked)
              except OSError:
                  try:
                      corrupt_dir.rename(unpacked)
                  except OSError:
                      # Both generations remain preserved at explicit paths for manual or
                      # later recovery; never delete either one here.
                      pass
                  return None

              try:
                  marker_path.unlink()
              except OSError:
                  pass

              restored = unpacked / packaged_executable.name
              return restored if restored.exists() else None
          '''
          p.write_text(s[:a] + replacement + s[b:], encoding='utf-8')
          PY

          python -m py_compile hermes_cli/main.py
          git add apps/desktop/package.json hermes_cli/main.py "${implementation_paths[@]}"
          git config user.name "Andrex Ibiza, MBA"
          git config user.email "andrexibiza@gmail.com"
          git commit \
            -m "fix(desktop): make Windows package replacement fully transactional (#91079)" \
            -m "Publish the reviewed rollback-safe Python composition directly into the submitted tree, retire all temporary publication machinery, and recompose the package transaction on exact upstream main $base. Preserve current-main package-script and CLI changes while binding build, test, beforePack, rollback, and isolated dependency-realization authority to the reviewed implementation."

          final_sha="$(git rev-parse HEAD)"
          final_tree="$(git rev-parse HEAD^{tree})"
          printf 'PR91079_BASE=%s\nPR91079_FINAL_SHA=%s\nPR91079_FINAL_TREE=%s\n' \
            "$base" "$final_sha" "$final_tree" >> "$GITHUB_ENV"

      - name: Verify canonical final object
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "publisher failed at shell line $LINENO with exit $status" >&2; exit $status' ERR
          test "$(git rev-parse HEAD^)" = "$PR91079_BASE"
          test "$(git rev-list --count "$PR91079_BASE"..HEAD)" = "1"
          git diff --check "$PR91079_BASE"..HEAD
          test ! -e .github/pr91079-actions-kick
          test ! -e .github/workflows/pr91079-materialize-patch.yml
          test ! -e .github/workflows/pr91079-publish-final.yml

          git diff --name-only "$PR91079_BASE"..HEAD | sort > /tmp/actual-paths
          cat > /tmp/expected-paths <<'EOF'
          apps/desktop/package.json
          apps/desktop/scripts/before-pack-recovery.mjs
          apps/desktop/scripts/before-pack.mjs
          apps/desktop/scripts/before-pack.test.mjs
          apps/desktop/scripts/desktop-builder-runtime.mjs
          apps/desktop/scripts/desktop-pack-recovery-composition.test.mjs
          apps/desktop/scripts/desktop-pack-transaction.mjs
          apps/desktop/scripts/desktop-pack-transaction.test.mjs
          apps/desktop/scripts/run-electron-builder.mjs
          apps/desktop/scripts/stage-native-deps-recovery.mjs
          apps/desktop/scripts/stage-native-deps-recovery.test.mjs
          apps/desktop/vitest.config.ts
          hermes_cli/main.py
          tests/hermes_cli/test_desktop_pack_transaction_windows.py
          EOF
          sed -i 's/^          //' /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

          while IFS= read -r path; do
            case "$path" in
              *.mjs) node --check "$path" ;;
            esac
          done < /tmp/actual-paths

          python - <<'PY'
          from pathlib import Path

          s = Path('hermes_cli/main.py').read_text(encoding='utf-8')
          block = s.split(
              'def _rollback_desktop_from_backup(packaged_executable: Path) -> Optional[Path]:\n',
              1,
          )[1].split('\ndef _ensure_desktop_exe_launchable(\n', 1)[0]
          required = (
              'unpacked.rename(corrupt_dir)',
              'backup_dir.rename(unpacked)',
              'corrupt_dir.rename(unpacked)',
              'marker_path.unlink()',
          )
          for token in required:
              assert token in block, token
          assert 'shutil.rmtree(unpacked' not in block
          PY

          echo "base=$PR91079_BASE"
          echo "final_sha=$PR91079_FINAL_SHA"
          echo "final_tree=$PR91079_FINAL_TREE"

      - name: Publish canonical branch tree
        shell: bash
        run: |
          set -euo pipefail
          branch=fix/windows-desktop-pack-transaction
          git push \
            --force-with-lease="refs/heads/$branch:$PR91079_TRIGGER_SHA" \
            origin "HEAD:refs/heads/$branch"

          {
            echo "### PR 91079 canonical publication"
            echo "- trigger: $PR91079_TRIGGER_SHA"
            echo "- upstream parent: $PR91079_BASE"
            echo "- final commit: $PR91079_FINAL_SHA"
            echo "- final tree: $PR91079_FINAL_TREE"
          } >> "$GITHUB_STEP_SUMMARY"
