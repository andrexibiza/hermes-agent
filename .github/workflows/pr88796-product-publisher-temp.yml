name: TEMP publish exact PR 88796 product

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: pr88796-product-publisher-temp
  cancel-in-progress: false

env:
  BASE: f0187332d13679e2ace74d1f0eb399eb91a90571
  CARRIER: d15981663be9f55cd76178174d439a5ad40e652f
  EXPECTED_OLD_HEAD: d15981663be9f55cd76178174d439a5ad40e652f
  TARGET_BRANCH: fix/memory-prefetch-cancel

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'tmp/pr88796-publish-trigger-20260826'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout fork history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Capture reviewed materializer and pin current upstream main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "andrexibiza/hermes-agent"
          git fetch --no-tags origin "$CARRIER"
          git show "$CARRIER:.github/workflows/materialize-88796-manager-lifetime.py" \
            > /tmp/materialize-88796-manager-lifetime.py
          python3 -m py_compile /tmp/materialize-88796-manager-lifetime.py

          git fetch --no-tags https://github.com/NousResearch/hermes-agent.git \
            +refs/heads/main:refs/remotes/upstream/main
          test "$(git rev-parse refs/remotes/upstream/main)" = "$BASE"

          live_target="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$live_target" = "$EXPECTED_OLD_HEAD"

          git switch --detach "$BASE"

      - name: Install exact test environment
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Materialize and verify product object
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.11
          uv sync --locked --python 3.11 --extra all --extra dev \
            --extra anthropic --extra mistral --extra fal --extra modal \
            --extra daytona --extra hindsight --extra parallel-web
          export PATH="$PWD/.venv/bin:$PATH"

          python3 /tmp/materialize-88796-manager-lifetime.py
          python3 -m py_compile agent/memory_manager.py tests/agent/test_memory_async_sync.py
          uv run ruff check agent/memory_manager.py tests/agent/test_memory_async_sync.py
          uv run pytest -q tests/agent/test_memory_async_sync.py
          git diff --check

          mapfile -t changed < <(git diff --name-only "$BASE" -- | sort)
          expected=(agent/memory_manager.py tests/agent/test_memory_async_sync.py)
          test "${changed[*]}" = "${expected[*]}"

          test "$(sha256sum agent/memory_manager.py | awk '{print $1}')" = \
            "9931e42ce06f343e7a8b15e448b84a40a29013cd4b6c008e2fcf5c133b903cb5"
          test "$(sha256sum tests/agent/test_memory_async_sync.py | awk '{print $1}')" = \
            "8143b92b6eebc2e45ce8f390435d4848ad403e0569b2c17f345bdd0aaad19c0c"

      - name: Commit and publish one current-main product child
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Axl Ibiza, MBA"
          git config user.email "andrexibiza@gmail.com"
          git add agent/memory_manager.py tests/agent/test_memory_async_sync.py
          git commit \
            -m "fix(memory): quarantine provider after prefetch timeout (#88796)" \
            -m "Bind an uncancellable external-prefetch timeout to one MemoryManager lifetime, recheck admission at every sensitive semantic edge, and keep shutdown cleanup-only." \
            -m "Signed-off-by: Axl Ibiza, MBA <andrexibiza@gmail.com>"

          product_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git rev-list --count "$BASE"..HEAD)" = "1"
          git diff --name-only "$BASE"..HEAD | sort > /tmp/paths
          printf '%s\n' agent/memory_manager.py tests/agent/test_memory_async_sync.py > /tmp/expected
          diff -u /tmp/expected /tmp/paths

          git push origin "$product_sha:refs/heads/$TARGET_BRANCH" \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_OLD_HEAD"
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$product_sha"

          {
            echo "## PR #88796 product published"
            echo ""
            echo "- Base: \`$BASE\`"
            echo "- Head: \`$product_sha\`"
            echo "- Product/test paths: 2"
            echo "- Focused pytest + ruff + compile + diff-check: passed"
          } >> "$GITHUB_STEP_SUMMARY"
