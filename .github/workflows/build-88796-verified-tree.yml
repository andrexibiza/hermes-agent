name: Build #88796 manager-lifetime provider-quarantine tree

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: build-88796-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-verified-tree:
    if: >-
      github.event.pull_request.head.repo.full_name == 'andrexibiza/hermes-agent' &&
      github.event.pull_request.head.ref == 'fix/memory-prefetch-cancel'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Pin materializer and reset to exact current main
        env:
          CURRENT_MAIN: 86ae906e88b280215067c5f9726f2f8cec6178b3
          MATERIALIZER: .github/workflows/materialize-88796-manager-lifetime.py
        shell: bash
        run: |
          set -euo pipefail
          test -f "$MATERIALIZER"
          cp "$MATERIALIZER" /tmp/materialize-88796-manager-lifetime.py
          python3 -m py_compile /tmp/materialize-88796-manager-lifetime.py
          git fetch --no-tags origin "$CURRENT_MAIN"
          git reset --hard "$CURRENT_MAIN"
          test "$(git rev-parse HEAD)" = "$CURRENT_MAIN"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install locked test environment
        run: >-
          uv sync --locked --python 3.11 --extra all --extra dev
          --extra anthropic --extra mistral --extra fal --extra modal
          --extra daytona --extra hindsight --extra parallel-web

      - name: Materialize, lint, test, and commit exact product tree
        env:
          CURRENT_MAIN: 86ae906e88b280215067c5f9726f2f8cec6178b3
          TRIGGER_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/.venv/bin:$PATH"

          python3 /tmp/materialize-88796-manager-lifetime.py
          python3 -m py_compile \
            agent/memory_manager.py \
            tests/agent/test_memory_async_sync.py
          git diff --check
          uv run ruff check \
            agent/memory_manager.py \
            tests/agent/test_memory_async_sync.py
          python -m pytest -q tests/agent/test_memory_async_sync.py

          git config user.name 'Axl Ibiza, MBA'
          git config user.email 'andrexibiza@gmail.com'
          git add agent/memory_manager.py tests/agent/test_memory_async_sync.py
          mapfile -t staged < <(git diff --cached --name-only)
          expected=(agent/memory_manager.py tests/agent/test_memory_async_sync.py)
          if [[ "${staged[*]}" != "${expected[*]}" ]]; then
            printf 'unexpected staged manifest: %s\n' "${staged[*]}" >&2
            exit 1
          fi
          git commit -m 'fix(memory): quarantine provider after prefetch timeout' \
            -m 'Bind an uncancellable external-prefetch timeout to one MemoryManager lifetime, recheck admission at every semantic edge, and leave shutdown as cleanup-only.' \
            -m 'Signed-off-by: Axl Ibiza, MBA <andrexibiza@gmail.com>'

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import io
          import json
          import os
          import subprocess
          import tarfile

          base = os.environ['CURRENT_MAIN']
          raw = subprocess.check_output(
              ['git', 'diff', '--name-status', base, 'HEAD'], text=True
          )
          entries = []
          for line in raw.splitlines():
              if not line.strip():
                  continue
              status, path = line.split('\t', 1)
              entries.append((status, path))
          expected = {
              ('M', 'agent/memory_manager.py'),
              ('M', 'tests/agent/test_memory_async_sync.py'),
          }
          if set(entries) != expected:
              raise SystemExit(
                  f'manager-lifetime manifest drifted: expected={sorted(expected)} '
                  f'actual={sorted(entries)}'
              )

          source_hashes = {}
          for _, path in entries:
              source_hashes[path] = hashlib.sha256(Path(path).read_bytes()).hexdigest()

          manifest = {
              'base': base,
              'carrier_source_head': os.environ['TRIGGER_HEAD'],
              'entries': entries,
              'materialized_head': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'source_sha256': source_hashes,
          }
          output = Path('/tmp/verified-tree.tar.gz')
          with tarfile.open(output, 'w:gz') as archive:
              data = json.dumps(manifest, sort_keys=True).encode()
              info = tarfile.TarInfo('MANIFEST.json')
              info.size = len(data)
              info.mode = 0o644
              archive.addfile(info, io.BytesIO(data))
              for status, path in sorted(entries):
                  if not status.startswith('D'):
                      archive.add(path, arcname=path, recursive=False)
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          Path('/tmp/verified-tree.sha256').write_text(
              f'{digest}  verified-tree.tar.gz\n'
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          print(f'verified_tree_sha256={digest}')
          PY

      - name: Upload exact tested tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-88796-manager-lifetime-verified-tree
          path: |
            /tmp/verified-tree.tar.gz
            /tmp/verified-tree.sha256
          retention-days: 1
          if-no-files-found: error
