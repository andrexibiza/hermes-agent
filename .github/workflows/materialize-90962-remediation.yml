name: One-shot #90962 verified remediation materializer

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: one-shot-90962-materializer
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'security/ghsa-remediation-c47f0b4'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node 26
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install npm 12
        run: npm --version | grep -q '^12\.' || npm install --global npm@12

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.9.28'

      - name: Apply permanent manifest, desktop, and OSV policy changes
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          def load(path: str):
              return json.loads(Path(path).read_text(encoding='utf-8'))

          def write(path: str, data):
              Path(path).write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          root = load('package.json')
          overrides = root.setdefault('overrides', {})
          overrides['nanoid@^3'] = '3.3.18'
          overrides['nanoid@^6'] = '6.0.0'
          overrides['postcss'] = '8.5.23'
          allow_scripts = root.setdefault('allowScripts', {})
          allow_scripts.pop('electron@40.10.2', None)
          allow_scripts['electron@41.10.3'] = True
          write('package.json', root)

          website = load('website/package.json')
          website.setdefault('overrides', {})['nanoid'] = '3.3.18'
          write('website/package.json', website)

          desktop = load('apps/desktop/package.json')
          desktop['devDependencies']['electron'] = '41.10.3'
          desktop['build']['electronVersion'] = '41.10.3'
          write('apps/desktop/package.json', desktop)

          npmrc = Path('.npmrc')
          text = npmrc.read_text(encoding='utf-8')
          text = text.replace(
              '# nanoid 3.3.17 includes fixes for GHSA-2v37-7h3g-55p8. remove when > 2wks old (rel 2026-08-03)',
              '# nanoid 3.3.18 fixes GHSA-2v37-7h3g-55p8. remove this exception when > 2wks old (rel 2026-08-07)',
          )
          npmrc.write_text(text, encoding='utf-8')

          layout = Path('apps/desktop/scripts/packaged-app-layout.mjs')
          layout.write_text(
              "export function resolveLinuxUnpackedDirName(arch) {\n"
              "  return arch === 'x64' ? 'linux-unpacked' : `linux-${arch}-unpacked`\n"
              "}\n",
              encoding='utf-8',
          )
          Path('apps/desktop/scripts/packaged-app-layout.test.mjs').write_text(
              "import assert from 'node:assert/strict'\n"
              "import test from 'node:test'\n\n"
              "import { resolveLinuxUnpackedDirName } from './packaged-app-layout.mjs'\n\n"
              "test('uses electron-builder default directory on Linux x64', () => {\n"
              "  assert.equal(resolveLinuxUnpackedDirName('x64'), 'linux-unpacked')\n"
              "})\n\n"
              "test('includes architecture in electron-builder Linux ARM64 directory', () => {\n"
              "  assert.equal(resolveLinuxUnpackedDirName('arm64'), 'linux-arm64-unpacked')\n"
              "})\n",
              encoding='utf-8',
          )

          target = Path('apps/desktop/scripts/test-desktop.mjs')
          text = target.read_text(encoding='utf-8')
          anchor = "import PACKAGE_JSON from '../package.json' with { type: 'json' }"
          helper_import = "import { resolveLinuxUnpackedDirName } from './packaged-app-layout.mjs'"
          if helper_import not in text:
              if anchor not in text:
                  raise SystemExit('test-desktop import anchor not found')
              text = text.replace(anchor, helper_import + '\n' + anchor, 1)
          old = "  // linux unpacked layout matches windows but with different binary name\n  const unpacked = path.join(RELEASE_ROOT, 'linux-unpacked')"
          new = "  // electron-builder includes the architecture suffix for non-x64 Linux output.\n  const unpacked = path.join(RELEASE_ROOT, resolveLinuxUnpackedDirName(ARCH))"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('test-desktop Linux layout anchor not found')
          target.write_text(text, encoding='utf-8')

          osv = Path('.github/workflows/osv-scanner.yml')
          text = osv.read_text(encoding='utf-8')
          if 'fail-on-vuln: false' not in text and 'fail-on-vuln: true' not in text:
              raise SystemExit('OSV fail-on-vuln setting not found')
          text = text.replace('fail-on-vuln: false', 'fail-on-vuln: true')
          text = text.replace(
              '# fail-on-vuln is disabled so the job does not block merges on pre-existing\n# vulnerabilities in pinned deps that we may need to patch deliberately.',
              '# fail-on-vuln is enabled: a known vulnerability in a committed lockfile is\n# a merge-blocking repository defect, while the SARIF/status job preserves diagnostics.',
          )
          osv.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix website install --package-lock-only --ignore-scripts --no-audit --no-fund
          uv lock --upgrade-package h2

      - name: Advance every committed Nano ID 3 lock node to the fixed artifact
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('package-lock.json')
          lock = json.loads(path.read_text(encoding='utf-8'))
          replacement = {
              'version': '3.3.18',
              'resolved': 'https://registry.npmjs.org/nanoid/-/nanoid-3.3.18.tgz',
              'integrity': 'sha512-DTg4MJbGMWkfi6VZFdNt2/caMbQy4Ou+Op/hJQvGEWcnVfoA1QA+xzRKAzw9jD6+GVOOeYr/mIcuDSdug6F6+w==',
              'funding': [{'type': 'github', 'url': 'https://github.com/sponsors/ai'}],
              'license': 'MIT',
              'bin': {'nanoid': 'bin/nanoid.cjs'},
              'engines': {'node': '^10 || ^12 || ^13.7 || ^14 || >=15.0.1'},
          }
          changed = []
          for package_path, package in lock.get('packages', {}).items():
              if package_path.endswith('/nanoid') and str(package.get('version', '')).startswith('3.'):
                  lock['packages'][package_path] = dict(replacement)
                  changed.append(package_path)
          expected = {
              'node_modules/sanitize-html/node_modules/nanoid',
              'node_modules/vite/node_modules/nanoid',
          }
          if set(changed) != expected:
              raise SystemExit(f'unexpected Nano ID 3 lock nodes: {changed!r}')
          path.write_text(json.dumps(lock, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Verify exact graph floors before install
        run: |
          node <<'NODE'
          const lock = require('./package-lock.json')
          const root = require('./package.json')
          const desktop = require('./apps/desktop/package.json')
          if (root.overrides['nanoid@^3'] !== '3.3.18') throw new Error('Nano ID 3 override is not 3.3.18')
          if (root.overrides.postcss !== '8.5.23') throw new Error('PostCSS override is not 8.5.23')
          if (desktop.devDependencies.electron !== '41.10.3') throw new Error('Electron manifest is not 41.10.3')
          const electron = lock.packages['node_modules/electron'] || lock.packages['apps/desktop/node_modules/electron']
          if (!electron || electron.version !== '41.10.3') throw new Error(`Electron lock is ${electron?.version}`)
          const expected = new Set([
            'node_modules/sanitize-html/node_modules/nanoid',
            'node_modules/vite/node_modules/nanoid'
          ])
          for (const [path, pkg] of Object.entries(lock.packages)) {
            if (path.endsWith('/nanoid') && pkg.version?.startsWith('3.')) {
              if (pkg.version !== '3.3.18') throw new Error(`${path} still resolves Nano ID ${pkg.version}`)
              expected.delete(path)
            }
            if (path.endsWith('/extract-zip') && pkg.version === '2.0.1') {
              throw new Error(`${path} still resolves vulnerable extract-zip 2.0.1`)
            }
          }
          if (expected.size) throw new Error(`missing inspected Nano ID paths: ${[...expected].join(', ')}`)
          NODE
          python3 - <<'PY'
          import re
          text = open('uv.lock', encoding='utf-8').read()
          match = re.search(r'\[\[package\]\]\nname = "h2"\nversion = "([^"]+)"', text)
          if not match or match.group(1) != '4.4.1':
              raise SystemExit(f'h2 lock is {match.group(1) if match else "missing"}')
          PY
          grep -q 'fail-on-vuln: true' .github/workflows/osv-scanner.yml
          ! grep -q 'fail-on-vuln: false' .github/workflows/osv-scanner.yml

      - name: Verify clean installs and lock consistency
        run: |
          set -o pipefail
          uv lock --check | tee /tmp/uv-lock-check.txt
          npm ci --ignore-scripts --no-audit --no-fund | tee /tmp/npm-ci-root.txt
          npm --prefix website ci --ignore-scripts --no-audit --no-fund | tee /tmp/npm-ci-website.txt

      - name: Verify dependency advisories are cleared
        run: |
          set -o pipefail
          npm audit --workspaces=false --audit-level=moderate | tee /tmp/npm-audit-root.txt
          npm audit --workspace web --audit-level=moderate | tee /tmp/npm-audit-web.txt
          npm audit --workspace ui-tui --audit-level=moderate | tee /tmp/npm-audit-tui.txt
          npm audit --workspace apps/desktop --audit-level=moderate | tee /tmp/npm-audit-desktop.txt
          npm --prefix website audit --audit-level=moderate | tee /tmp/npm-audit-website.txt

      - name: Verify desktop compatibility contract
        run: |
          node --test apps/desktop/scripts/packaged-app-layout.test.mjs
          git diff --check

      - name: Publish the verified remediation into the PR tree
        run: |
          rm -f .github/workflows/ghsa-remediation-bootstrap.yml
          rm -f .github/workflows/ghsa-remediation-build.yml
          git diff --check
          if git diff --quiet; then
            echo 'The branch already contains the verified remediation.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .npmrc package.json package-lock.json website/package.json website/package-lock.json \
            apps/desktop/package.json apps/desktop/scripts/test-desktop.mjs \
            apps/desktop/scripts/packaged-app-layout.mjs apps/desktop/scripts/packaged-app-layout.test.mjs \
            uv.lock .github/workflows/osv-scanner.yml \
            .github/workflows/ghsa-remediation-bootstrap.yml .github/workflows/ghsa-remediation-build.yml
          git commit -m 'fix(security): materialize verified dependency remediation'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
