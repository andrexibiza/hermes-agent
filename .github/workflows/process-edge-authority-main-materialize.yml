name: Process-edge authority trusted materializer

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: process-edge-authority-materialize
  cancel-in-progress: false

jobs:
  materialize:
    name: Materialize, verify, and publish typed process-edge authority
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       github.event.comment.user.login == 'andrexibiza' &&
       github.event.comment.body == '/publish-phase-g')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_BRANCH: security/process-edge-authority-broker
      EXPECTED_HEAD: 93df446a0f416b3088cccf4848b9d6e3ecc6847f
      VERIFIED_BASE: d5281f59819d2ea2ce6754faec2ce317c92366c8
      EXPECTED_MATERIALIZER_SHA256: a571212c831033656638764bb7cef3f9c8603a026f428653dcc0939d9d0b1d52
      MAIN_WORKFLOW: .github/workflows/process-edge-authority-main-materialize.yml
      MATERIALIZER: .github/materialize-process-edge-authority.py
      TRANSPORT: tests/security/test_process_edge_authority_materializer_transport.py
    steps:
      - name: Check out exact materializer branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Verify target lease and preserve reviewed source object
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(sha256sum "$MATERIALIZER" | awk '{print $1}')" = "$EXPECTED_MATERIALIZER_SHA256"
          mkdir -p /tmp/phase-g-source
          cp "$MATERIALIZER" /tmp/phase-g-source/materializer.py
          cp "$TRANSPORT" /tmp/phase-g-source/transport.py

      - name: Bind publication to exact live upstream main
        run: |
          set -euo pipefail
          UPSTREAM_MAIN=$(git ls-remote https://github.com/NousResearch/hermes-agent.git refs/heads/main | awk '{print $1}')
          test -n "$UPSTREAM_MAIN"
          git fetch --no-tags https://github.com/NousResearch/hermes-agent.git "$UPSTREAM_MAIN"
          git merge-base --is-ancestor "$VERIFIED_BASE" "$UPSTREAM_MAIN"
          git reset --hard "$UPSTREAM_MAIN"
          echo "BASE_SHA=$UPSTREAM_MAIN" >> "$GITHUB_ENV"
          mkdir -p .github tests/security
          cp /tmp/phase-g-source/materializer.py "$MATERIALIZER"
          cp /tmp/phase-g-source/transport.py "$TRANSPORT"
          test "$(sha256sum "$MATERIALIZER" | awk '{print $1}')" = "$EXPECTED_MATERIALIZER_SHA256"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install Python and test environment
        run: |
          uv python install 3.11
          uv sync --locked --python 3.11 --extra all --extra dev

      - name: Apply the assertion-guarded current-main adapter
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python - <<'PY'
          from __future__ import annotations

          import importlib.util
          from pathlib import Path

          transport_path = Path(
              "tests/security/test_process_edge_authority_materializer_transport.py"
          ).resolve()
          spec = importlib.util.spec_from_file_location(
              "phase_g_transport", transport_path
          )
          assert spec is not None and spec.loader is not None
          transport = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(transport)

          source = transport.MATERIALIZER.read_text(encoding="utf-8")
          new_files, exact, regex = transport._materializer_data(source)
          adaptations = transport._apply_materializer(
              transport.REPO_ROOT, new_files, exact, regex
          )
          assert adaptations == [
              "tui_gateway/methods_tools.py: scope shared import anchor to cli.exec"
          ], adaptations
          product_paths = {
              str(item[0]) for item in (*exact, *regex)
          } | {str(path) for path in new_files}
          assert len(product_paths) == 18, sorted(product_paths)
          print(f"materialized_product_files={len(product_paths)}")
          print(f"current_main_adaptations={adaptations!r}")
          PY

      - name: Format and compile changed Python surfaces
        run: |
          set -euo pipefail
          source .venv/bin/activate
          ruff format \
            tools/child_process_authority.py \
            tests/tools/test_child_process_authority.py \
            tests/security/test_child_process_authority_guard.py
          python -m compileall -q \
            tools/child_process_authority.py \
            tools/environments/base.py \
            tools/environments/singularity.py \
            tools/checkpoint_manager.py \
            agent/secret_sources/bitwarden.py \
            agent/secret_sources/onepassword.py \
            agent/secret_sources/command.py \
            agent/transports/codex_app_server.py \
            agent/copilot_acp_client.py \
            hermes_cli/pty_bridge.py \
            hermes_cli/win_pty_bridge.py \
            hermes_cli/secrets_cli.py \
            hermes_cli/onepassword_secrets_cli.py \
            tui_gateway/host_supervisor.py \
            tui_gateway/methods_tools.py \
            tests/tools/test_child_process_authority.py \
            tests/security/test_child_process_authority_guard.py

      - name: Run authority and affected regression suites
        run: |
          set -euo pipefail
          source .venv/bin/activate
          python -m pytest -q \
            tests/tools/test_child_process_authority.py \
            tests/security/test_child_process_authority_guard.py \
            tests/tools/test_build_subprocess_env.py \
            tests/tools/test_hermes_subprocess_env.py \
            tests/tools/test_local_env_blocklist.py \
            tests/test_onepassword_secrets.py \
            tests/test_env_loader_secret_sources.py \
            tests/test_command_secret_source.py \
            tests/tools/test_checkpoint_manager.py \
            tests/tui_gateway/test_compute_host_phase1.py \
            tests/agent/transports/test_codex_app_server_runtime.py \
            tests/agent/test_copilot_acp_client.py

      - name: Lint exact changed surfaces
        run: |
          set -euo pipefail
          source .venv/bin/activate
          ruff check \
            tools/child_process_authority.py \
            tools/environments/base.py \
            tools/environments/singularity.py \
            tools/checkpoint_manager.py \
            agent/secret_sources/bitwarden.py \
            agent/secret_sources/onepassword.py \
            agent/secret_sources/command.py \
            agent/transports/codex_app_server.py \
            agent/copilot_acp_client.py \
            hermes_cli/pty_bridge.py \
            hermes_cli/win_pty_bridge.py \
            hermes_cli/secrets_cli.py \
            hermes_cli/onepassword_secrets_cli.py \
            tui_gateway/host_supervisor.py \
            tui_gateway/methods_tools.py \
            tests/tools/test_child_process_authority.py \
            tests/security/test_child_process_authority_guard.py
          ruff format --check \
            tools/child_process_authority.py \
            tests/tools/test_child_process_authority.py \
            tests/security/test_child_process_authority_guard.py

      - name: Publish one clean current-main review object
        run: |
          set -euo pipefail
          rm -f "$MATERIALIZER" "$TRANSPORT" phase-g-product.tar.gz
          git add -A
          python - <<'PY'
          from __future__ import annotations

          import subprocess

          expected = {
              "agent/copilot_acp_client.py",
              "agent/secret_sources/bitwarden.py",
              "agent/secret_sources/command.py",
              "agent/secret_sources/onepassword.py",
              "agent/transports/codex_app_server.py",
              "docs/design/process-edge-authority.md",
              "hermes_cli/onepassword_secrets_cli.py",
              "hermes_cli/pty_bridge.py",
              "hermes_cli/secrets_cli.py",
              "hermes_cli/win_pty_bridge.py",
              "tests/security/test_child_process_authority_guard.py",
              "tests/tools/test_child_process_authority.py",
              "tools/checkpoint_manager.py",
              "tools/child_process_authority.py",
              "tools/environments/base.py",
              "tools/environments/singularity.py",
              "tui_gateway/host_supervisor.py",
              "tui_gateway/methods_tools.py",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--cached", "--name-only"], text=True
              ).splitlines()
          )
          assert actual == expected, {
              "missing": sorted(expected - actual),
              "unexpected": sorted(actual - expected),
          }
          print(f"publication_paths={len(actual)}")
          PY
          git diff --cached --check
          git config user.name "Andrex Ibiza, MBA"
          git config user.email "andrexibiza@gmail.com"
          git commit -m "feat(security): bind child process authority to typed edges"
          FINAL_SHA=$(git rev-parse HEAD)
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          git push \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD" \
            origin "HEAD:$TARGET_BRANCH"
          {
            echo "base_sha=$BASE_SHA"
            echo "final_sha=$FINAL_SHA"
            echo "product_files=18"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove this one-shot workflow from fork main
        if: success()
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C main origin/main
          if [ ! -f "$MAIN_WORKFLOW" ]; then
            exit 0
          fi
          git rm "$MAIN_WORKFLOW"
          git config user.name "Andrex Ibiza, MBA"
          git config user.email "andrexibiza@gmail.com"
          git commit -m "chore(ci): remove process-edge authority materializer"
          git push origin main
