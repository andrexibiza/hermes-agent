name: Temporary PR 85523 closure repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-pr-85523-closure-temp.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout staged Task 10 source branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: campaign/webhook-task10-fanout
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reset to live upstream main, apply, verify, and publish
        shell: bash
        run: |
          set -euo pipefail
          cat .hermes-patches/task10/part*.patch > /tmp/pr85523.patch
          echo '6db360799eec591e6b4fc0aa6350d7de5208ca62485ee0d7f5b3700ac3459b1d  /tmp/pr85523.patch' | sha256sum -c -

          git remote add upstream https://github.com/NousResearch/hermes-agent.git || true
          git fetch upstream main --prune
          git reset --hard upstream/main

          test "$(git hash-object gateway/platforms/webhook.py)" = 'bc3ebe0968e9a760b618e5f71a07d1abb2a2a82f'
          test "$(git hash-object tests/gateway/test_webhook_adapter.py)" = '4f5cdb13900c0f43db8e22416e27fee54b557146'

          git apply --check /tmp/pr85523.patch
          git apply /tmp/pr85523.patch
          git diff --check
          python -m py_compile gateway/platforms/webhook.py tests/gateway/test_webhook_adapter.py tests/gateway/test_webhook_task10_closure.py
          python -m pytest -q tests/gateway/test_webhook_adapter.py tests/gateway/test_webhook_task10_closure.py

          test "$(git hash-object gateway/platforms/webhook.py)" = '2cbe1d560757e0bbf86d38c3e9572acfc2b4eb9c'
          test "$(git hash-object tests/gateway/test_webhook_adapter.py)" = '21be925f865da8e992e229e446a504ffea884a47'
          test "$(git hash-object tests/gateway/test_webhook_task10_closure.py)" = '92fb404c70bf536a8abceb81a7abf569d1593532'

          git config user.name "Axl Ibiza"
          git config user.email "andrexibiza@users.noreply.github.com"
          git add gateway/platforms/webhook.py tests/gateway/test_webhook_adapter.py tests/gateway/test_webhook_task10_closure.py
          git commit -m "fix(webhook): close Task 10 intake contract (#85523)"
          git push --force origin HEAD:campaign/webhook-task10-fanout

# trigger generation 2
