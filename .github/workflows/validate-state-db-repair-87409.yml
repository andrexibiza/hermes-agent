name: Validate state.db repair #87409

on:
  push:
    branches:
      - ci/87409-hosted
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-state-db-repair-87409-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout rebased repair tree
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install locked dependencies
        run: >-
          uv sync --locked --python 3.11
          --extra all --extra dev --extra anthropic --extra mistral
          --extra fal --extra modal --extra daytona --extra hindsight
          --extra parallel-web

      - name: Run focused repair regressions
        run: |
          source .venv/bin/activate
          python -m pytest -q \
            tests/test_state_db_repair_non_destructive.py \
            tests/test_state_db_write_durability.py

      - name: Static validation
        run: |
          source .venv/bin/activate
          python -m py_compile hermes_state.py
          ruff check \
            hermes_state.py \
            tests/test_state_db_repair_non_destructive.py \
            tests/test_state_db_write_durability.py
