name: Finish P0 h2 remediation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: finish-p0-h2-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: >-
      github.event.pull_request.head.repo.full_name == 'andrexibiza/hermes-agent' &&
      github.event.pull_request.head.ref == 'security/p0-dependency-remediation-20260820'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: andrexibiza/hermes-agent
          ref: security/p0-dependency-remediation-20260820
          fetch-depth: 0
          persist-credentials: true

      - name: Restore lock metadata and verify patched resolutions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('uv.lock')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(
              r'(?m)^exclude-newer = "[^"]+"$',
              'exclude-newer = "2026-08-04T07:06:16.774262776Z"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'expected one exclude-newer field, replaced {count}')
          path.write_text(text, encoding='utf-8')
          PY
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path('uv.lock').read_text(encoding='utf-8'))
          packages = {}
          for package in data.get('package', []):
              packages.setdefault(package['name'], []).append(package['version'])
          if sorted(packages.get('h2', [])) != ['4.4.1']:
              raise SystemExit(f'h2 resolved to {packages.get("h2")}')
          if sorted(packages.get('hpack', [])) != ['4.2.0']:
              raise SystemExit(f'hpack resolved to {packages.get("hpack")}')
          if data.get('options', {}).get('exclude-newer') != '2026-08-04T07:06:16.774262776Z':
              raise SystemExit(f'exclude-newer drifted to {data.get("options", {}).get("exclude-newer")}')
          PY

      - name: Push the minimal metadata cleanup
        run: |
          set -euo pipefail
          git config user.name 'Axl Ibiza'
          git config user.email 'andrexibiza@gmail.com'
          git add uv.lock
          git diff --cached --check
          git commit -m 'chore(lock): preserve the existing uv cutoff' \
            -m 'Keep the h2/hpack remediation while restoring the pre-existing global exclude-newer timestamp.' \
            -m 'Signed-off-by: Axl Ibiza <andrexibiza@gmail.com>'
          git push origin HEAD:security/p0-dependency-remediation-20260820
