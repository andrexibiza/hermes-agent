name: Finish P0 h2 remediation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: finish-p0-h2-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: >-
      github.event.pull_request.head.repo.full_name == 'andrexibiza/hermes-agent' &&
      github.event.pull_request.head.ref == 'security/p0-dependency-remediation-20260820'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact remediation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: andrexibiza/hermes-agent
          ref: security/p0-dependency-remediation-20260820
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: '0.9.28'

      - name: Update only h2 and its required hpack resolution
        run: |
          set -euo pipefail
          cp uv.lock /tmp/uv.lock.before
          uv lock --upgrade-package h2
          uv lock --check
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          def versions(path: str) -> dict[str, tuple[str, ...]]:
              data = tomllib.loads(Path(path).read_text(encoding='utf-8'))
              grouped: dict[str, list[str]] = {}
              for package in data.get('package', []):
                  grouped.setdefault(package['name'], []).append(package['version'])
              return {name: tuple(sorted(values)) for name, values in grouped.items()}

          before = versions('/tmp/uv.lock.before')
          after = versions('uv.lock')
          changed = {name for name in before.keys() | after.keys() if before.get(name) != after.get(name)}
          unexpected = changed - {'h2', 'hpack'}
          if unexpected:
              raise SystemExit(f'unexpected uv.lock package changes: {sorted(unexpected)}')
          if after.get('h2') != ('4.4.1',):
              raise SystemExit(f'h2 resolved to {after.get("h2")}')
          if after.get('hpack') != ('4.2.0',):
              raise SystemExit(f'hpack resolved to {after.get("hpack")}')
          print(f'verified changed packages: {sorted(changed)}')
          PY

      - name: Push the final lockfile
        run: |
          set -euo pipefail
          rm -f .github/workflows/p0-h2-remediation.yml
          git config user.name 'Axl Ibiza'
          git config user.email 'andrexibiza@gmail.com'
          git add uv.lock .github/workflows/p0-h2-remediation.yml
          git diff --cached --check
          git commit -m 'fix(deps): patch h2 request-smuggling advisory' \
            -m 'Update h2 to 4.4.1 and the required hpack resolution to 4.2.0; remove the branch-local runner.' \
            -m 'Signed-off-by: Axl Ibiza <andrexibiza@gmail.com>'
          git push origin HEAD:security/p0-dependency-remediation-20260820
