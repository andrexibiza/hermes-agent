name: "@andrexibiza GitHub review support"

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate independently verified responses without posting"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - .github/workflows/andrexibiza-review-support.yml
      - scripts/automation/andrexibiza_review_support.py

permissions:
  contents: read
  issues: write
  models: read

concurrency:
  group: andrexibiza-review-support
  cancel-in-progress: false

jobs:
  review-support:
    name: Graph-first review support
    if: github.repository == 'andrexibiza/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the automation source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve the upstream writer identity
        shell: bash
        env:
          TOKEN_A: ${{ secrets.ANDREXIBIZA_GITHUB_TOKEN }}
          TOKEN_B: ${{ secrets.UPSTREAM_GITHUB_TOKEN }}
          TOKEN_C: ${{ secrets.HERMES_GITHUB_TOKEN }}
          TOKEN_D: ${{ secrets.GITHUB_PAT }}
          TOKEN_E: ${{ secrets.GH_PAT }}
          TOKEN_F: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          TOKEN_G: ${{ secrets.PAT }}
        run: |
          set -euo pipefail
          token=""
          for candidate in \
            "${TOKEN_A:-}" \
            "${TOKEN_B:-}" \
            "${TOKEN_C:-}" \
            "${TOKEN_D:-}" \
            "${TOKEN_E:-}" \
            "${TOKEN_F:-}" \
            "${TOKEN_G:-}"
          do
            if [[ -n "$candidate" ]]; then
              token="$candidate"
              break
            fi
          done
          if [[ -n "$token" ]]; then
            echo "::add-mask::$token"
          fi
          printf 'UPSTREAM_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Poll, build the interlock graph, verify, and respond
        env:
          STATE_TOKEN: ${{ github.token }}
          MODEL_TOKEN: ${{ github.token }}
          STATE_REPOSITORY: ${{ github.repository }}
          TARGET_REPOSITORY: NousResearch/hermes-agent
          ACTOR: andrexibiza
          MAX_CANDIDATES: "4"
          FIRST_RUN_LOOKBACK_MINUTES: "360"
          MAX_LOOKBACK_DAYS: "7"
          PRIMARY_MODELS: "openai/gpt-5.1,openai/gpt-5,openai/gpt-4.1"
          VERIFIER_MODELS: "anthropic/claude-sonnet-4.5,anthropic/claude-sonnet-4,xai/grok-3,openai/gpt-4.1"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: python scripts/automation/andrexibiza_review_support.py
