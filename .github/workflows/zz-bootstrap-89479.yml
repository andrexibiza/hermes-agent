name: "Bootstrap observable #89479 convergence"

on:
  push:
    branches:
      - trigger/89479-bootstrap

permissions: {}

concurrency:
  group: dependency-security-89479-bootstrap
  cancel-in-progress: false

jobs:
  retrigger:
    name: Retrigger #96 with an observable run receipt
    if: github.repository == 'andrexibiza/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Publish immediate pending receipt
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context='dependency-security/bootstrap' \
            -f description='Trusted #89479 convergence bootstrap is running' \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/tmp/pending.json

      - name: Checkout exact trigger
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate trusted trigger marker
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -qx 'target=89479' .github/trigger-89479-bootstrap
          grep -qx 'purpose=observable-current-main-convergence' .github/trigger-89479-bootstrap

      - name: Retrigger the existing #96 evidence lane
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch='trigger/91042-current-main'
          path='.github/pr91042-current-main-trigger'
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$branch")
          blob_sha=$(jq -r '.sha' <<<"$metadata")
          content=$(printf 'target=89479\npurpose=current-main-security-convergence\ntrigger=%s\n' "$GITHUB_RUN_ID" | base64 -w0)

          gh api \
            --method PUT \
            "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="ci: trigger #89479 convergence from run $GITHUB_RUN_ID" \
            -f branch="$branch" \
            -f sha="$blob_sha" \
            -f content="$content" >/tmp/update.json

          new_head=$(jq -r '.commit.sha' /tmp/update.json)
          cat > /tmp/comment.md <<EOF
          Observable #89479 bootstrap run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          The trusted bootstrap updated #96 to [\`$new_head\`](https://github.com/$GITHUB_REPOSITORY/commit/$new_head), producing a fresh \`synchronize\` event for the default-branch convergence publisher.
          EOF
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/96/comments" \
            --raw-field body="$(cat /tmp/comment.md)" >/tmp/comment.json

      - name: Publish completed bootstrap receipt
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context='dependency-security/bootstrap' \
            -f description='Trusted #89479 convergence bootstrap completed' \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/tmp/success.json
