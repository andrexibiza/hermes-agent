name: PR 91079 Python rollback patch runner

on:
  push:
    branches:
      - tmp/pr91079-python-rollback-runner

permissions:
  contents: write

jobs:
  patch-pr-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the live PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: andrexibiza/hermes-agent
          ref: fix/windows-desktop-pack-transaction
          fetch-depth: 0
          persist-credentials: true

      - name: Capture exact branch identity
        shell: bash
        run: |
          set -euo pipefail
          echo "ORIGINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "ORIGINAL_PARENT=$(git rev-parse HEAD^)" >> "$GITHUB_ENV"

      - name: Make Python rollback promotion transactional
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source_path = Path("hermes_cli/main.py")
          source = source_path.read_text(encoding="utf-8")
          start_marker = "def _rollback_desktop_from_backup(packaged_executable: Path) -> Optional[Path]:\n"
          end_marker = "\ndef _ensure_desktop_exe_launchable(\n"
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          replacement = '''def _rollback_desktop_from_backup(packaged_executable: Path) -> Optional[Path]:
              """Restore the previous unpacked desktop app from its ``.bak`` tree.

              Returns the restored executable path, or ``None`` when no usable
              backup exists or the filesystem transaction cannot complete. The
              invalid candidate is kept alongside as ``<unpacked-dir>.corrupt``
              after a successful rollback.

              The live path is never deleted to make room for the backup. A
              stale quarantine must be retired before either generation moves;
              the candidate is then quarantined by rename, and backup promotion
              owns the commit point. If promotion fails, the candidate is moved
              back to the live path while the backup remains intact.
              Best-effort: never raises.
              """
              unpacked = packaged_executable.parent
              backup_dir = _desktop_backup_unpacked_dir(packaged_executable)
              backup_exe = backup_dir / packaged_executable.name
              if not backup_exe.exists():
                  return None
              if _desktop_exe_integrity_error(backup_exe) is not None:
                  return None

              corrupt_dir = unpacked.parent / (unpacked.name + ".corrupt")
              marker_path = backup_dir.with_name(backup_dir.name + ".session")

              if corrupt_dir.exists():
                  try:
                      shutil.rmtree(corrupt_dir)
                  except FileNotFoundError:
                      pass
                  except OSError:
                      return None

              try:
                  unpacked.rename(corrupt_dir)
              except OSError:
                  return None

              try:
                  backup_dir.rename(unpacked)
              except OSError:
                  try:
                      corrupt_dir.rename(unpacked)
                  except OSError:
                      # Both generations remain preserved at explicit paths for
                      # manual or later recovery; never delete either one here.
                      pass
                  return None

              try:
                  marker_path.unlink()
              except OSError:
                  pass

              restored = unpacked / packaged_executable.name
              return restored if restored.exists() else None
          '''
          replacement = "\n".join(
              line[12:] if line.startswith("            ") else line
              for line in replacement.splitlines()
          ) + "\n"
          source_path.write_text(source[:start] + replacement + source[end:], encoding="utf-8")

          tests_path = Path("tests/hermes_cli/test_desktop_exe_integrity.py")
          tests = tests_path.read_text(encoding="utf-8")
          sentinel = "def test_rollback_stale_corrupt_cleanup_failure_preserves_both_generations"
          if sentinel not in tests:
              insertion_marker = "\n# ─── _ensure_desktop_exe_launchable (the gate)"
              insertion = r'''

          def test_rollback_stale_corrupt_cleanup_failure_preserves_both_generations(tmp_path):
              desktop_dir, exe = _win_tree(tmp_path)
              make_pe(exe, PE_AMD64, truncate_to=0x300)
              backup_exe = desktop_dir / "release" / "win-unpacked.bak" / "Hermes.exe"
              make_pe(backup_exe, PE_AMD64)
              corrupt_exe = desktop_dir / "release" / "win-unpacked.corrupt" / "Hermes.exe"
              make_pe(corrupt_exe, PE_AMD64, truncate_to=0x300)

              with patch("hermes_cli.main._windows_native_machine", return_value="AMD64"), \
                   patch("hermes_cli.main.shutil.rmtree", side_effect=OSError("quarantine locked")):
                  restored = cli_main._rollback_desktop_from_backup(exe)

              assert restored is None
              assert exe.exists()
              assert backup_exe.exists()
              assert corrupt_exe.exists()


          def test_rollback_quarantine_rename_failure_preserves_both_generations(tmp_path):
              desktop_dir, exe = _win_tree(tmp_path)
              make_pe(exe, PE_AMD64, truncate_to=0x300)
              backup_exe = desktop_dir / "release" / "win-unpacked.bak" / "Hermes.exe"
              make_pe(backup_exe, PE_AMD64)
              unpacked = exe.parent
              original_rename = Path.rename

              def fail_candidate_rename(self, target):
                  if self == unpacked:
                      raise OSError("candidate locked")
                  return original_rename(self, target)

              with patch("hermes_cli.main._windows_native_machine", return_value="AMD64"), \
                   patch.object(Path, "rename", fail_candidate_rename):
                  restored = cli_main._rollback_desktop_from_backup(exe)

              assert restored is None
              assert exe.exists()
              assert backup_exe.exists()
              assert not (desktop_dir / "release" / "win-unpacked.corrupt").exists()


          def test_rollback_promotion_failure_restores_candidate_and_preserves_backup(tmp_path):
              desktop_dir, exe = _win_tree(tmp_path)
              make_pe(exe, PE_AMD64, truncate_to=0x300)
              backup_dir = desktop_dir / "release" / "win-unpacked.bak"
              backup_exe = backup_dir / "Hermes.exe"
              make_pe(backup_exe, PE_AMD64)
              unpacked = exe.parent
              corrupt_dir = desktop_dir / "release" / "win-unpacked.corrupt"
              original_rename = Path.rename

              def fail_backup_promotion(self, target):
                  if self == backup_dir and target == unpacked:
                      raise OSError("promotion locked")
                  return original_rename(self, target)

              with patch("hermes_cli.main._windows_native_machine", return_value="AMD64"), \
                   patch.object(Path, "rename", fail_backup_promotion):
                  restored = cli_main._rollback_desktop_from_backup(exe)

              assert restored is None
              assert exe.exists()
              assert backup_exe.exists()
              assert not corrupt_dir.exists()
          '''
              insertion = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in insertion.splitlines()
              )
              tests = tests.replace(insertion_marker, insertion + insertion_marker, 1)
              tests_path.write_text(tests, encoding="utf-8")

          # Deterministic source-level acceptance before the repository matrix.
          patched = source_path.read_text(encoding="utf-8")
          assert "shutil.rmtree(unpacked, ignore_errors=True)" not in patched
          assert "corrupt_dir.rename(unpacked)" in patched
          assert "marker_path.unlink()" in patched
          PY

          python -m py_compile hermes_cli/main.py tests/hermes_cli/test_desktop_exe_integrity.py

      - name: Rebuild one commit on live upstream main
        shell: bash
        run: |
          set -euo pipefail

          files=(
            apps/desktop/package.json
            apps/desktop/scripts/before-pack-recovery.mjs
            apps/desktop/scripts/before-pack.mjs
            apps/desktop/scripts/before-pack.test.mjs
            apps/desktop/scripts/desktop-builder-runtime.mjs
            apps/desktop/scripts/desktop-pack-recovery-composition.test.mjs
            apps/desktop/scripts/desktop-pack-transaction.mjs
            apps/desktop/scripts/desktop-pack-transaction.test.mjs
            apps/desktop/scripts/run-electron-builder.mjs
            apps/desktop/scripts/stage-native-deps-recovery.mjs
            apps/desktop/scripts/stage-native-deps-recovery.test.mjs
            apps/desktop/vitest.config.ts
            tests/hermes_cli/test_desktop_pack_transaction_windows.py
            hermes_cli/main.py
            tests/hermes_cli/test_desktop_exe_integrity.py
          )

          tar -cf /tmp/pr91079-files.tar "${files[@]}"

          git remote add upstream https://github.com/NousResearch/hermes-agent.git 2>/dev/null || true
          git fetch --no-tags upstream main

          overlap=$(git diff --name-only "$ORIGINAL_PARENT"..upstream/main -- "${files[@]}")
          if [ -n "$overlap" ]; then
            echo "Upstream changed an owned path after the PR base:" >&2
            echo "$overlap" >&2
            exit 1
          fi

          remote_head=$(git ls-remote origin refs/heads/fix/windows-desktop-pack-transaction | awk '{print $1}')
          if [ "$remote_head" != "$ORIGINAL_HEAD" ]; then
            echo "PR branch moved concurrently: expected $ORIGINAL_HEAD, found $remote_head" >&2
            exit 1
          fi

          git reset --hard upstream/main
          tar -xf /tmp/pr91079-files.tar
          git add -- "${files[@]}"

          if [ "$(git diff --cached --name-only | wc -l | tr -d ' ')" -ne 15 ]; then
            echo "Expected exactly 15 changed files" >&2
            git diff --cached --name-status >&2
            exit 1
          fi

          git config user.name "Andrex Ibiza, MBA"
          git config user.email "andrexibiza@gmail.com"
          git commit -m "fix(desktop): close Windows package rollback transaction (#91079)" \
                     -m "Rebuild the complete package transaction on live upstream main." \
                     -m "Make the canonical Python launchability rollback reversible: stale quarantine cleanup and candidate quarantine fail before destructive mutation; backup-promotion failure restores the candidate live and preserves the known-good backup; successful promotion retires the generation marker best-effort." \
                     -m "Preserve the reviewed lock-closure, override, native verifier, generation fencing, npm-selected runtime, and native-Windows witnesses."

          git push --force-with-lease=refs/heads/fix/windows-desktop-pack-transaction:"$ORIGINAL_HEAD" \
            origin HEAD:refs/heads/fix/windows-desktop-pack-transaction
