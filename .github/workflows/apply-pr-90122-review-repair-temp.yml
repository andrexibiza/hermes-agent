name: Apply PR 90122 review repair (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    name: Apply reviewed repair to the source branch
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/pr-90122-review-blockers'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/pr-90122-review-blockers
          fetch-depth: 0

      - name: Apply and mechanically validate the repair
        shell: bash
        run: |
          set -euo pipefail
          patch_file=review-patches/pr-90122-review-repair.patch
          if [[ ! -f "$patch_file" ]]; then
            echo "Repair already applied; nothing to do."
            exit 0
          fi
          git apply --check "$patch_file"
          git apply "$patch_file"
          python -m py_compile \
            cron/executions.py \
            cron/scheduler.py \
            tests/cron/test_model_pin_fallback_90089.py \
            tests/cron/test_silent_worker_death_90089.py

          git config user.name "Axl Ibiza"
          git config user.email "andrexibiza@users.noreply.github.com"
          git rm "$patch_file"
          git rm -f --ignore-unmatch .github/workflows/apply-pr-90122-review-repair.yml
          git add cron/executions.py cron/scheduler.py \
            tests/cron/test_model_pin_fallback_90089.py \
            tests/cron/test_silent_worker_death_90089.py
          git commit -m "fix(cron): keep fallback routing atomic and preserve unknown outcomes (#90122)"
          git push origin HEAD:fix/pr-90122-review-blockers
