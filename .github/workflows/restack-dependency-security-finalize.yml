name: Finalize dependency-security restack

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restack-dependency-security-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out fork control branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Use repository-authorized npm
        run: npm install --global npm@11.17.0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Generate and verify the exact current-main security graph
        env:
          BASE_SHA: b6bcb3e791c673e63974029bbab40cc9326803ff
          SOURCE_BRANCH: restack/pr89479-current-main
          BRANCH: restack/dependency-security-final-91906
        run: |
          set -euo pipefail
          git fetch origin "$SOURCE_BRANCH"
          git show "origin/$SOURCE_BRANCH:.github/scripts/restack_dependency_security.py" > /tmp/restack_dependency_security.py
          git fetch https://github.com/NousResearch/hermes-agent.git "$BASE_SHA"
          git checkout --detach "$BASE_SHA"
          mkdir -p .github/scripts
          cp /tmp/restack_dependency_security.py .github/scripts/restack_dependency_security.py

          python3 .github/scripts/restack_dependency_security.py apply
          npm install --package-lock-only --ignore-scripts --include=optional
          npm update nanoid --package-lock-only --ignore-scripts --include=optional
          uv lock --upgrade-package 'h2==4.4.1'
          python3 .github/scripts/restack_dependency_security.py verify
          node --test apps/desktop/scripts/packaged-app-layout.test.mjs
          uv lock --check
          git diff --check
          npm audit --workspaces=false --audit-level=high
          npm audit --workspace web --audit-level=high
          npm audit --workspace ui-tui --audit-level=high
          npm audit --workspace apps/desktop --audit-level=high

          tmp="$(mktemp -d)"
          mkdir -p "$tmp/apps/desktop/scripts"
          cp .npmrc package.json package-lock.json uv.lock "$tmp/"
          cp apps/desktop/package.json "$tmp/apps/desktop/package.json"
          cp apps/desktop/scripts/packaged-app-layout.mjs "$tmp/apps/desktop/scripts/"
          cp apps/desktop/scripts/packaged-app-layout.test.mjs "$tmp/apps/desktop/scripts/"
          cp apps/desktop/scripts/test-desktop.mjs "$tmp/apps/desktop/scripts/"

          git reset --hard "$BASE_SHA"
          cp "$tmp/.npmrc" .npmrc
          cp "$tmp/package.json" package.json
          cp "$tmp/package-lock.json" package-lock.json
          cp "$tmp/uv.lock" uv.lock
          mkdir -p apps/desktop/scripts
          cp "$tmp/apps/desktop/package.json" apps/desktop/package.json
          cp "$tmp/apps/desktop/scripts/packaged-app-layout.mjs" apps/desktop/scripts/packaged-app-layout.mjs
          cp "$tmp/apps/desktop/scripts/packaged-app-layout.test.mjs" apps/desktop/scripts/packaged-app-layout.test.mjs
          cp "$tmp/apps/desktop/scripts/test-desktop.mjs" apps/desktop/scripts/test-desktop.mjs

          git add -- .npmrc package.json package-lock.json uv.lock apps/desktop/package.json apps/desktop/scripts/packaged-app-layout.mjs apps/desktop/scripts/packaged-app-layout.test.mjs apps/desktop/scripts/test-desktop.mjs
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 8
          git config user.name 'Andrex Ibiza, MBA'
          git config user.email 'andrexibiza@gmail.com'
          git commit -m 'fix(deps): close current advisory graph on current main' -m 'Restack the active Electron, Nano ID, and h2 advisory remediation on the exact current main object while preserving the React Compiler graph and source attribution.

Co-authored-by: schmitzi8 <schmitzi8@users.noreply.github.com>
Co-authored-by: orcaspainting-dev <264355715+orcaspainting-dev@users.noreply.github.com>'
          git push --force origin "HEAD:refs/heads/$BRANCH"
          git rev-parse HEAD
