name: Materialize PR 60233 exact-main repair (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: materialize-pr-60233
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/windows-update-venv-native-locks' &&
      github.event.pull_request.head.sha == 'a5d285a3af06d62851d11858217f2ddb6066ab8b'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/windows-update-venv-native-locks
          fetch-depth: 0

      - name: Verify authority and execute carrier
        env:
          BASE_SHA: b6bcb3e791c673e63974029bbab40cc9326803ff
          BRANCH: fix/windows-update-venv-native-locks
          EXPECTED_HEAD: a5d285a3af06d62851d11858217f2ddb6066ab8b
          CARRIER: .github/workflows/refresh-pr-60233.yml
        run: |
          set -euo pipefail

          live_main="$({ git ls-remote https://github.com/NousResearch/hermes-agent.git refs/heads/main || true; } | awk 'NR==1 {print $1}')"
          test "${live_main}" = "${BASE_SHA}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test -f "${CARRIER}"

          export BASE_SHA BRANCH EXPECTED_HEAD
          python3 - "${CARRIER}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text().splitlines()
          starts = [i for i, line in enumerate(lines) if line.strip() == "run: |"]
          if len(starts) != 1:
              raise SystemExit(f"expected one run block in {path}, found {len(starts)}")
          start = starts[0]
          key_indent = len(lines[start]) - len(lines[start].lstrip())
          content_indent = key_indent + 2
          body = []
          for line in lines[start + 1:]:
              if line.strip():
                  indent = len(line) - len(line.lstrip())
                  if indent <= key_indent:
                      break
                  if indent < content_indent:
                      raise SystemExit(f"invalid block indentation in {path}: {line!r}")
                  body.append(line[content_indent:])
              else:
                  body.append("")
          if not body:
              raise SystemExit(f"empty run block in {path}")
          Path("/tmp/materialize-60233.sh").write_text("\n".join(body) + "\n")
          PY

          bash -n /tmp/materialize-60233.sh
          bash /tmp/materialize-60233.sh
