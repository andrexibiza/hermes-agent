name: Cleanup PR 90924 recovery refs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-90924-history.yml
  pull_request:
    types: [opened, reopened, synchronize]
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: cleanup-pr-90924-recovery-refs
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.repository == 'andrexibiza/hermes-agent' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'chore/remove-pr90924-recovery-workflow'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out fork main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          fetch-depth: 0

      - name: Delete completed recovery refs
        shell: bash
        run: |
          set -euo pipefail

          for branch in \
            tmp/pr90924-base-ee000 \
            tmp/pr90924-keep-c8ba \
            tmp/pr90924-lint-order \
            tmp/pr90924-squash-parent
          do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
