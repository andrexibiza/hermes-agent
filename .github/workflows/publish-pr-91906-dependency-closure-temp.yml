name: Publish PR 91906 exact dependency closure (temporary)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pr-91906-dependency-closure
  cancel-in-progress: false

jobs:
  publish:
    name: Generate, verify, and publish the exact eight-file closure
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET_BRANCH: restack/pr89479-current-main
      EXPECTED_HEAD: c35060427bbd1011604502e9d4a4a2121e03a500
      BASE_SHA: b6bcb3e791c673e63974029bbab40cc9326803ff
      WORKFLOW_PATH: .github/workflows/publish-pr-91906-dependency-closure-temp.yml
    steps:
      - name: Check out the exact staging branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Gate exact source and base objects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch --no-tags https://github.com/NousResearch/hermes-agent.git "$BASE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$BASE_SHA"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"

      - name: Set up Node 22.22.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0

      - name: Use the repository-authorized npm version
        run: npm install --global npm@11.17.0

      - name: Set up uv 0.12.5
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.5'

      - name: Generate the canonical current-main lock graph
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/restack_dependency_security.py apply
          npm install --package-lock-only --ignore-scripts --include=optional
          npm update nanoid --package-lock-only --ignore-scripts --include=optional
          uv lock --upgrade-package 'h2==4.4.1'

      - name: Verify semantic closure and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/restack_dependency_security.py verify
          node --test apps/desktop/scripts/packaged-app-layout.test.mjs
          uv lock --check
          git diff --check
          npm audit --workspaces=false --audit-level=high
          npm audit --workspace web --audit-level=high
          npm audit --workspace ui-tui --audit-level=high
          npm audit --workspace apps/desktop --audit-level=high

      - name: Prove byte identity with artifact 9466562504
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-sha256s <<'SUMS'
          46e922c1fc1dd16ee9a1623a2b76d1f4e4a11ab03f225803beed058356535eda  .npmrc
          56f4cdb46f65a4a075e570f6acdad1f6c05fb903b37d9d01b1323842ef62bb2f  apps/desktop/package.json
          9838203f20c16bdf38484cc605458bcd85181bbf2bcc37afbb076a5569a2f54f  apps/desktop/scripts/packaged-app-layout.mjs
          b1c90a8f0ca86f499985dd5e9837b27302eaf1af9f56671aabaaa530b4841d36  apps/desktop/scripts/packaged-app-layout.test.mjs
          9dc343e3e40b6aad5c479f48b879afef8c243a8e3e87727d0f85d438af0cee61  apps/desktop/scripts/test-desktop.mjs
          025cdcc245dbccda191c41c001a57f6aa9dfcaefa4ccc19aed418f28d918e84a  package-lock.json
          9cd7dd3823c2af968b66178efc7dc7f489ac9e72fd6dbaaa7e875494a6cd7e4d  package.json
          c72c4fe0e636f971564432599f60257e040b0d3396061fe733610575a48aaaa3  uv.lock
          SUMS
          sha256sum -c /tmp/expected-sha256s

      - name: Publish one clean current-main commit
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          payload=$(mktemp -d)
          mkdir -p "$payload/apps/desktop/scripts"
          cp -a .npmrc package.json package-lock.json uv.lock "$payload/"
          cp -a apps/desktop/package.json "$payload/apps/desktop/package.json"
          cp -a apps/desktop/scripts/packaged-app-layout.mjs "$payload/apps/desktop/scripts/"
          cp -a apps/desktop/scripts/packaged-app-layout.test.mjs "$payload/apps/desktop/scripts/"
          cp -a apps/desktop/scripts/test-desktop.mjs "$payload/apps/desktop/scripts/"

          git reset --hard "$BASE_SHA"
          cp -a "$payload/.npmrc" .npmrc
          cp -a "$payload/package.json" package.json
          cp -a "$payload/package-lock.json" package-lock.json
          cp -a "$payload/uv.lock" uv.lock
          cp -a "$payload/apps/desktop/package.json" apps/desktop/package.json
          cp -a "$payload/apps/desktop/scripts/packaged-app-layout.mjs" apps/desktop/scripts/
          cp -a "$payload/apps/desktop/scripts/packaged-app-layout.test.mjs" apps/desktop/scripts/
          cp -a "$payload/apps/desktop/scripts/test-desktop.mjs" apps/desktop/scripts/

          sha256sum -c /tmp/expected-sha256s
          git add -- \
            .npmrc \
            package.json \
            package-lock.json \
            uv.lock \
            apps/desktop/package.json \
            apps/desktop/scripts/packaged-app-layout.mjs \
            apps/desktop/scripts/packaged-app-layout.test.mjs \
            apps/desktop/scripts/test-desktop.mjs

          cat > /tmp/expected-files <<'FILES'
          .npmrc
          apps/desktop/package.json
          apps/desktop/scripts/packaged-app-layout.mjs
          apps/desktop/scripts/packaged-app-layout.test.mjs
          apps/desktop/scripts/test-desktop.mjs
          package-lock.json
          package.json
          uv.lock
          FILES
          git diff --cached --name-only | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --cached --check

          git config user.name 'Axl Ibiza'
          git config user.email 'andrexibiza@gmail.com'
          tree=$(git write-tree)
          message=$(cat <<'COMMIT_MESSAGE'
          fix(deps): close current advisory graph on current main

          Consolidate the live Electron, Nano ID, and h2 advisory closure on
          the current-main dependency graph while preserving React Compiler
          movement, Nano ID v6 isolation, and packaged Desktop architecture.

          Refs #89479
          Refs #90486
          Refs #91042

          Co-authored-by: schmitzi8 <schmitzi8@users.noreply.github.com>
          Co-authored-by: orcaspainting-dev <264355715+orcaspainting-dev@users.noreply.github.com>
          Signed-off-by: Axl Ibiza <andrexibiza@gmail.com>
          COMMIT_MESSAGE
          )
          commit=$(printf '%s\n' "$message" | git commit-tree "$tree" -p "$BASE_SHA")
          git reset --hard "$commit"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA..HEAD")" = '1'
          test "$(git diff --name-only "$BASE_SHA..HEAD" | wc -l | tr -d ' ')" = '8'

          git push \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "head=$commit" >> "$GITHUB_OUTPUT"
          echo "Published exact final head $commit"

      - name: Retire this one-shot publisher
        if: steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          control=$(mktemp -d)
          git clone --no-checkout "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$control"
          cd "$control"
          git checkout main
          test -f "$WORKFLOW_PATH"
          git rm -- "$WORKFLOW_PATH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ci): retire completed PR 91906 publisher'
          git push origin HEAD:main
