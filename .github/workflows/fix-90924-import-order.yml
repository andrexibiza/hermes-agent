name: One-shot #90924 import-order repair

on:
  push:
    branches:
      - architecture/proof-carrying-route-activation

permissions:
  contents: write

concurrency:
  group: one-shot-90924-import-order
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: architecture/proof-carrying-route-activation
          fetch-depth: 0

      - name: Apply the authoritative lint ordering and remove this workflow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/desktop/src/store/profile.ts')
          text = path.read_text(encoding='utf-8')
          old = '''import {
            activateGatewayAgentWithProof,
            activeGatewayRouteMatches,
            activateGatewayProfileWithProof,
            routeActivationReceiptIsCurrent
          } from '@/store/gateway-activation'
          '''
          new = '''import {
            activateGatewayAgentWithProof,
            activateGatewayProfileWithProof,
            activeGatewayRouteMatches,
            routeActivationReceiptIsCurrent
          } from '@/store/gateway-activation'
          '''
          if old not in text:
              raise SystemExit('expected gateway-activation import block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-90924-import-order.yml

      - name: Commit the repair to the PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/desktop/src/store/profile.ts .github/workflows/fix-90924-import-order.yml
          git diff --cached --check
          git commit -m 'style(desktop): satisfy route-proof import ordering'
          git push origin HEAD:architecture/proof-carrying-route-activation
