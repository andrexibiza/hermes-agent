name: Publish exact PR 89461 network-authority product tree

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-89461-network-authority-temp.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-89461-network-authority
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_HEAD: b89654926da9c9d152ce7765ec961117926bd61d
      EXPECTED_PARENT: d8e4cd9cbc0efd0cb5589c0eaf1f6b0379145cc9
      CLEAN_ACTION_SOURCE: 56659a21acb3548328b0f8207e665faa88b67d74
      TARGET_BRANCH: fix/browser-exec-network-boundary-class
    steps:
      - name: Check out exact carrier head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/browser-exec-network-boundary-class
          fetch-depth: 0

      - name: Assert exact publication authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(find .github/patches/89461 -maxdepth 1 -type f -name 'part-*' | wc -l)" = 5
          test -f .github/patches/89461/trigger
          test -f .github/workflows/apply-89461-review-fixes.yml

      - name: Materialize exact reviewed transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          parts = sorted(Path('.github/patches/89461').glob('part-*'))
          if len(parts) != 5:
              raise SystemExit(f'expected 5 transformation parts, found {len(parts)}')
          payload = ''.join(part.read_text(encoding='utf-8') for part in parts)
          script = gzip.decompress(base64.b64decode(payload))
          path = Path('/tmp/apply_89461_review_fixes.py')
          path.write_bytes(script)
          PY
          python3 /tmp/apply_89461_review_fixes.py

      - name: Verify exact artifact-equivalent bytes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c <<'EOF'
          f15673b8de962da80505076009744b941b3d68e057cb0e664c7f4ca9e0760241  tools/browser_use_guard_bootstrap/browser_exec_egress_guard.py
          05600e93e8d1d1d8db0350c3b542ffbe710e1a649166179852ecf88fcf50abfb  tools/browser_exec_egress_guard.py
          18c5c2460a6cc085a1849cb3d82cc8eedc1d3acf984c5e52e512eac9ae3c064d  tools/browser_use_guard.py
          359e648583fb712ba28b0e9877f6eab0bd6a40a9dd1ca92ffd14f3bc5cc11dbd  tests/tools/test_browser_exec_egress_guard.py
          01cb88f28b0f5354ac2ed6762c9e1a2cec4d4dd8c3f10b32da7a4a9fd75a4453  tests/tools/test_browser_use_guard.py
          EOF
          git diff --check

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install locked test environment
        run: >-
          uv sync --locked --python 3.11
          --extra all --extra dev --extra anthropic --extra mistral
          --extra fal --extra modal --extra daytona --extra hindsight
          --extra parallel-web

      - name: Compile modified Python surfaces
        run: >-
          uv run python -m compileall -q
          tools/browser_use_guard_bootstrap/browser_exec_egress_guard.py
          tools/browser_exec_egress_guard.py
          tools/browser_use_guard.py
          tests/tools/test_browser_exec_egress_guard.py
          tests/tools/test_browser_use_guard.py

      - name: Lint modified Python surfaces
        run: >-
          uv run ruff check
          tools/browser_use_guard_bootstrap/browser_exec_egress_guard.py
          tools/browser_exec_egress_guard.py
          tools/browser_use_guard.py
          tests/tools/test_browser_exec_egress_guard.py
          tests/tools/test_browser_use_guard.py

      - name: Run adversarial guard suites
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: >-
          uv run pytest -q
          tests/tools/test_browser_exec_egress_guard.py
          tests/tools/test_browser_use_guard.py

      - name: Publish one clean product commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/patches/89461/part-*
          git rm .github/patches/89461/trigger
          git rm .github/workflows/apply-89461-review-fixes.yml
          git checkout "$CLEAN_ACTION_SOURCE" -- .github/actions/detect-changes/action.yml
          git add -- \
            .github/actions/detect-changes/action.yml \
            tools/browser_use_guard_bootstrap/browser_exec_egress_guard.py \
            tools/browser_exec_egress_guard.py \
            tools/browser_use_guard.py \
            tests/tools/test_browser_exec_egress_guard.py \
            tests/tools/test_browser_use_guard.py
          git diff --cached --check
          python3 - <<'PY'
          import subprocess

          expected = {
              '.github/actions/detect-changes/action.yml',
              '.github/patches/89461/part-00',
              '.github/patches/89461/part-01',
              '.github/patches/89461/part-02',
              '.github/patches/89461/part-03',
              '.github/patches/89461/part-04',
              '.github/patches/89461/trigger',
              '.github/workflows/apply-89461-review-fixes.yml',
              'tools/browser_use_guard_bootstrap/browser_exec_egress_guard.py',
              'tools/browser_exec_egress_guard.py',
              'tools/browser_use_guard.py',
              'tests/tools/test_browser_exec_egress_guard.py',
              'tests/tools/test_browser_use_guard.py',
          }
          actual = set(
              subprocess.check_output(
                  ['git', 'diff', '--cached', '--name-only'], text=True
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  f'unexpected staged paths: missing={sorted(expected - actual)} '
                  f'extra={sorted(actual - expected)}'
              )
          PY
          git config user.name "Axl Ibiza"
          git config user.email "andrexibiza@gmail.com"
          git commit --amend \
            -m "fix(security): bind browser_exec policy to dialed network objects" \
            --author="Axl Ibiza <andrexibiza@gmail.com>"
          test ! -e .github/patches/89461/trigger
          test ! -e .github/workflows/apply-89461-review-fixes.yml
          test "$(find .github/patches/89461 -maxdepth 1 -type f -name 'part-*' 2>/dev/null | wc -l)" = 0
          sha256sum -c <<'EOF'
          f15673b8de962da80505076009744b941b3d68e057cb0e664c7f4ca9e0760241  tools/browser_use_guard_bootstrap/browser_exec_egress_guard.py
          05600e93e8d1d1d8db0350c3b542ffbe710e1a649166179852ecf88fcf50abfb  tools/browser_exec_egress_guard.py
          18c5c2460a6cc085a1849cb3d82cc8eedc1d3acf984c5e52e512eac9ae3c064d  tools/browser_use_guard.py
          359e648583fb712ba28b0e9877f6eab0bd6a40a9dd1ca92ffd14f3bc5cc11dbd  tests/tools/test_browser_exec_egress_guard.py
          01cb88f28b0f5354ac2ed6762c9e1a2cec4d4dd8c3f10b32da7a4a9fd75a4453  tests/tools/test_browser_use_guard.py
          EOF
          git push \
            --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD" \
            origin "HEAD:refs/heads/$TARGET_BRANCH"
