name: Publish exact Phase 3 product tree

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-phase3-product-temp.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-phase3-product
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASE_SHA: 987064caa4f8845f605ac7346fed5b72fddfb21c
      EXPECTED_HEAD: 3c96f128c8b61b43de36a0698c412110db86cb7b
      TARGET_BRANCH: phase3/baked-image-refusal-contract
    steps:
      - name: Check out exact carrier head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: phase3/baked-image-refusal-contract
          fetch-depth: 0

      - name: Assert exact publication authority
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git merge-base HEAD "$BASE_SHA")" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA"...HEAD | LC_ALL=C sort | tr '\n' ' ')" = ".github/workflows/phase3-materialize.yml .phase3-trigger .phase3-trigger-2 .phase3-trigger-3 .phase3_patch_1.py .phase3_patch_2.py .phase3_patch_3.py hermes_cli/image_provenance.py hermes_cli/update_contract.py tests/hermes_cli/test_image_provenance.py tests/hermes_cli/test_update_contract.py tests/hermes_cli/test_update_image_entrypoints.py tests/hermes_cli/test_update_inventory_image_provenance.py tests/tools/test_dockerfile_image_provenance.py "

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Materialize scoped Phase 3 implementation
        run: |
          set -euo pipefail
          python .phase3_patch_1.py
          python .phase3_patch_2.py
          python .phase3_patch_3.py
          python -m compileall -q \
            hermes_cli/image_provenance.py \
            hermes_cli/update_contract.py \
            hermes_cli/update_inventory.py \
            hermes_cli/update_receipt.py \
            hermes_cli/update_cmd.py \
            hermes_cli/main.py \
            hermes_cli/web_server.py
          git diff --check

      - name: Verify exact artifact-equivalent bytes
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import subprocess
          from pathlib import Path

          expected = {
              "Dockerfile": (26457, "5c975dcc33c270f42767e68c4bd2cd1691baabeec74ef509a18f1589702385a6"),
              "hermes_cli/main.py": (569316, "7dc38604c7001c1b387eeb4bd933df00a4c16f62fc2199dd93d30710c6866b68"),
              "hermes_cli/update_cmd.py": (364091, "bfda2264c681c1b9cab30d717e97e1175ddd943da83c7f5a0f39131a137c093b"),
              "hermes_cli/update_inventory.py": (12884, "bfe2d95ca87cae21ab1f7c20b1795a1f5272b59192e6c7f3a9587e422e044e7b"),
              "hermes_cli/update_receipt.py": (15712, "ca270a37c86f1af040045be30d5c9a4283248d3ee740ae7383f69518e5fbe4bf"),
              "hermes_cli/web_server.py": (774452, "51a4888f3f3fac381a48fe21cb0dfb1ad8b6bc14473a58b4721f574f1e9adcee"),
              "tests/hermes_cli/test_cmd_update_docker.py": (3417, "d5ba27e76e6553104d5c39d49bdbfa3fd9ac028edfb8dfcd40e8bdad1f229722"),
              "tests/hermes_cli/test_web_server.py": (191285, "f65d7b2a72d983882cadbc38a4ab1080b1b60a4876a2316ca098d6e42904e9bf"),
          }
          actual = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          )
          if actual != set(expected):
              raise SystemExit(
                  "unexpected generated path set: "
                  f"missing={sorted(set(expected) - actual)} "
                  f"extra={sorted(actual - set(expected))}"
              )
          for path, (size, digest) in expected.items():
              payload = Path(path).read_bytes()
              if len(payload) != size:
                  raise SystemExit(f"{path}: expected {size} bytes, got {len(payload)}")
              actual_digest = hashlib.sha256(payload).hexdigest()
              if actual_digest != digest:
                  raise SystemExit(
                      f"{path}: expected sha256 {digest}, got {actual_digest}"
                  )
          PY

      - name: Install locked test environment
        run: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Run focused lint and contracts
        run: |
          set -euo pipefail
          uv run ruff check \
            hermes_cli/image_provenance.py \
            hermes_cli/update_contract.py \
            hermes_cli/update_inventory.py \
            hermes_cli/update_receipt.py \
            tests/hermes_cli/test_image_provenance.py \
            tests/hermes_cli/test_update_inventory_image_provenance.py \
            tests/hermes_cli/test_update_contract.py \
            tests/hermes_cli/test_update_image_entrypoints.py \
            tests/tools/test_dockerfile_image_provenance.py
          uv run pytest -q \
            tests/hermes_cli/test_image_provenance.py \
            tests/hermes_cli/test_update_inventory_image_provenance.py \
            tests/hermes_cli/test_update_contract.py \
            tests/hermes_cli/test_update_image_entrypoints.py \
            tests/hermes_cli/test_cmd_update_docker.py \
            tests/hermes_cli/test_update_inventory.py \
            tests/hermes_cli/test_update_receipt.py \
            tests/tools/test_dockerfile_image_provenance.py \
            tests/tools/test_dockerfile_immutable_install.py
          uv run pytest -q tests/hermes_cli/test_web_server.py \
            -k 'update_hermes_returns_docker_guidance_without_spawning or update_hermes_returns_apt_guidance_without_spawning'

      - name: Publish one exact product commit
        run: |
          set -euo pipefail
          git rm -- \
            .github/workflows/phase3-materialize.yml \
            .phase3-trigger \
            .phase3-trigger-2 \
            .phase3-trigger-3 \
            .phase3_patch_1.py \
            .phase3_patch_2.py \
            .phase3_patch_3.py
          git add -- \
            Dockerfile \
            hermes_cli/main.py \
            hermes_cli/update_cmd.py \
            hermes_cli/update_inventory.py \
            hermes_cli/update_receipt.py \
            hermes_cli/web_server.py \
            tests/hermes_cli/test_cmd_update_docker.py \
            tests/hermes_cli/test_web_server.py
          git diff --cached --check
          test "$(git diff --cached --name-only | LC_ALL=C sort | tr '\n' ' ')" = ".github/workflows/phase3-materialize.yml .phase3-trigger .phase3-trigger-2 .phase3-trigger-3 .phase3_patch_1.py .phase3_patch_2.py .phase3_patch_3.py Dockerfile hermes_cli/main.py hermes_cli/update_cmd.py hermes_cli/update_inventory.py hermes_cli/update_receipt.py hermes_cli/web_server.py tests/hermes_cli/test_cmd_update_docker.py tests/hermes_cli/test_web_server.py "
          git config user.name "Axl Ibiza"
          git config user.email "andrexibiza@gmail.com"
          git commit -m "feat(update): enforce image-managed update refusal contract"
          test "$(git diff --name-only "$BASE_SHA"...HEAD | LC_ALL=C sort | tr '\n' ' ')" = "Dockerfile hermes_cli/image_provenance.py hermes_cli/main.py hermes_cli/update_cmd.py hermes_cli/update_contract.py hermes_cli/update_inventory.py hermes_cli/update_receipt.py hermes_cli/web_server.py tests/hermes_cli/test_cmd_update_docker.py tests/hermes_cli/test_image_provenance.py tests/hermes_cli/test_update_contract.py tests/hermes_cli/test_update_image_entrypoints.py tests/hermes_cli/test_update_inventory_image_provenance.py tests/hermes_cli/test_web_server.py tests/tools/test_dockerfile_image_provenance.py "
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$EXPECTED_HEAD" origin "HEAD:refs/heads/$TARGET_BRANCH"
