name: Dispatch Phase-G publication once

on:
  workflow_dispatch:
  schedule:
    - cron: "35 15 23 8 *"

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-phase-g-publication-once
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'andrexibiza/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the exact-head trusted materializer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run process-edge-authority-main-materialize.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
