name: Hourly Hermes PR exact-head CI watch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hourly-hermes-pr-ci-watch.yml
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: hourly-hermes-pr-ci-watch
  cancel-in-progress: true

jobs:
  audit:
    name: Audit authored PR exact-head CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Audit exact-head CI and reconcile receipt
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: "${{ secrets.HERMES_CI_WATCH_TOKEN || github.token }}"
          script: |
            const targetRepo = 'NousResearch/hermes-agent';
            const targetAuthor = 'andrexibiza';
            const [receiptOwner, receiptRepo] = 'andrexibiza/hermes-agent'.split('/');
            const receiptTitle = '[automation] Hourly Hermes PR exact-head CI watch';
            const marker = '<!-- hermes-hourly-ci-watch:v1 -->';
            const missingGraceMinutes = 20;
            const stuckPendingMinutes = 180;
            const now = new Date();

            const query = `
            query($q: String!, $cursor: String) {
              search(query: $q, type: ISSUE, first: 100, after: $cursor) {
                issueCount
                pageInfo { hasNextPage endCursor }
                nodes {
                  ... on PullRequest {
                    number title url isDraft headRefOid
                    headRepository { nameWithOwner }
                    commits(last: 1) {
                      nodes {
                        commit {
                          oid committedDate
                          statusCheckRollup {
                            contexts(first: 100) {
                              totalCount
                              nodes {
                                __typename
                                ... on CheckRun {
                                  name status conclusion detailsUrl startedAt completedAt
                                }
                                ... on StatusContext {
                                  context state targetUrl createdAt
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }`;

            const minsSince = value => {
              if (!value) return 0;
              return Math.max(0, Math.floor((now - new Date(value)) / 60000));
            };
            const clean = value => String(value ?? '').replaceAll('|', '\\|').replaceAll('\n', ' ').trim();
            const redConclusions = new Set([
              'ACTION_REQUIRED', 'CANCELLED', 'FAILURE', 'STARTUP_FAILURE',
              'STALE', 'TIMED_OUT'
            ]);
            const passConclusions = new Set(['SUCCESS', 'NEUTRAL', 'SKIPPED']);
            const pendingCheck = new Set(['IN_PROGRESS', 'PENDING', 'QUEUED', 'REQUESTED', 'WAITING']);
            const redStatus = new Set(['ERROR', 'FAILURE']);
            const passStatus = new Set(['SUCCESS']);
            const pendingStatus = new Set(['EXPECTED', 'PENDING']);

            async function fetchPRs() {
              const q = `repo:${targetRepo} is:pr is:open author:${targetAuthor}`;
              let cursor = null;
              const prs = [];
              let count = 0;
              do {
                const data = await github.graphql(query, {q, cursor});
                count = data.search.issueCount;
                prs.push(...data.search.nodes.filter(node => node?.number));
                cursor = data.search.pageInfo.hasNextPage ? data.search.pageInfo.endCursor : null;
              } while (cursor);
              if (prs.length !== count) {
                throw new Error(`Search reported ${count} PRs but returned ${prs.length}`);
              }
              return prs;
            }

            function classify(pr) {
              const commit = pr.commits?.nodes?.at(-1)?.commit;
              const sha = pr.headRefOid ?? '';
              const age = minsSince(commit?.committedDate);
              const result = {...pr, sha, age, state: 'red', reason: '', evidence: []};

              if (!sha || commit?.oid !== sha) {
                result.reason = `head/commit identity mismatch: head=${sha || 'missing'}, commit=${commit?.oid || 'missing'}`;
                return result;
              }

              const connection = commit.statusCheckRollup?.contexts;
              if (!connection || connection.totalCount === 0) {
                if (age <= missingGraceMinutes) {
                  result.state = 'pending';
                  result.reason = `no exact-head CI yet; within ${missingGraceMinutes}m attachment grace`;
                } else {
                  result.reason = `no exact-head CI evidence ${age}m after the head commit`;
                }
                return result;
              }

              const contexts = connection.nodes ?? [];
              if (connection.totalCount > contexts.length) {
                result.reason = `${connection.totalCount} contexts exist but only ${contexts.length} were retrieved`;
                return result;
              }

              const red = [];
              const pending = [];
              const passed = [];
              const unknown = [];
              for (const item of contexts) {
                if (item.__typename === 'CheckRun') {
                  const status = String(item.status ?? 'UNKNOWN').toUpperCase();
                  const conclusion = String(item.conclusion ?? '').toUpperCase();
                  const record = {
                    name: item.name ?? 'unnamed check',
                    outcome: conclusion || status,
                    url: item.detailsUrl ?? ''
                  };
                  if (status !== 'COMPLETED' || pendingCheck.has(status)) pending.push(record);
                  else if (redConclusions.has(conclusion)) red.push(record);
                  else if (passConclusions.has(conclusion)) passed.push(record);
                  else unknown.push(record);
                } else if (item.__typename === 'StatusContext') {
                  const state = String(item.state ?? 'UNKNOWN').toUpperCase();
                  const record = {
                    name: item.context ?? 'unnamed status',
                    outcome: state,
                    url: item.targetUrl ?? ''
                  };
                  if (redStatus.has(state)) red.push(record);
                  else if (pendingStatus.has(state)) pending.push(record);
                  else if (passStatus.has(state)) passed.push(record);
                  else unknown.push(record);
                } else {
                  unknown.push({name: 'unknown context', outcome: 'UNKNOWN', url: ''});
                }
              }

              if (red.length) {
                result.evidence = red;
                result.reason = `${red.length} failing/cancelled/timed-out exact-head context(s)`;
              } else if (unknown.length) {
                result.evidence = unknown;
                result.reason = `${unknown.length} unrecognized exact-head outcome(s)`;
              } else if (pending.length) {
                result.evidence = pending;
                if (age >= stuckPendingMinutes) {
                  result.reason = `${pending.length} context(s) pending after ${age}m`;
                } else {
                  result.state = 'pending';
                  result.reason = `${pending.length} exact-head context(s) still running`;
                }
              } else if (passed.length) {
                result.state = 'green';
                result.reason = `${passed.length} exact-head context(s) completed acceptably`;
              } else {
                result.reason = 'no classifiable exact-head contexts';
              }
              return result;
            }

            const headURL = pr => {
              const repo = pr.headRepository?.nameWithOwner;
              return repo && pr.sha ? `https://github.com/${repo}/commit/${pr.sha}` : `${pr.url}/commits/${pr.sha}`;
            };
            const evidenceText = pr => {
              const links = pr.evidence.slice(0, 8).map(e => {
                const label = e.url ? `[${clean(e.name)}](${e.url})` : `\`${clean(e.name)}\``;
                return `${label} — \`${clean(e.outcome)}\``;
              });
              if (pr.evidence.length > 8) links.push(`…and ${pr.evidence.length - 8} more`);
              return links.length ? `${clean(pr.reason)}<br>${links.join('<br>')}` : clean(pr.reason);
            };
            const row = (pr, icon) => {
              const draft = pr.isDraft ? ' · draft' : '';
              return `| ${icon} | [#${pr.number}](${pr.url}) ${clean(pr.title)}${draft} | [\`${pr.sha.slice(0, 12)}\`](${headURL(pr)}) | ${evidenceText(pr)} |`;
            };

            async function findIssue() {
              const q = `repo:${receiptOwner}/${receiptRepo} is:issue in:title "${receiptTitle}"`;
              const response = await github.rest.search.issuesAndPullRequests({q, per_page: 100});
              return response.data.items.find(item => item.title === receiptTitle && (item.body ?? '').includes(marker));
            }

            async function reconcile(body, actionable) {
              let issue = await findIssue();
              const state = actionable ? 'open' : 'closed';
              if (!issue) {
                const created = await github.rest.issues.create({
                  owner: receiptOwner, repo: receiptRepo, title: receiptTitle, body,
                  assignees: [targetAuthor]
                });
                issue = created.data;
              }
              const updated = await github.rest.issues.update({
                owner: receiptOwner, repo: receiptRepo, issue_number: issue.number,
                body, state, ...(state === 'closed' ? {state_reason: 'completed'} : {})
              });
              return updated.data;
            }

            function receipt(classified, auditError = '') {
              const red = classified.filter(pr => pr.state === 'red');
              const pending = classified.filter(pr => pr.state === 'pending');
              const green = classified.filter(pr => pr.state === 'green');
              const runURL = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              const lines = [
                marker,
                '# Hourly Hermes PR exact-head CI watch',
                '',
                `Last sweep: \`${now.toISOString()}\``,
                `Workflow receipt: [run ${context.runId}](${runURL})`,
                `Source query: \`repo:${targetRepo} is:pr is:open author:${targetAuthor}\``,
                '',
                'Policy: only checks and statuses attached to each PR’s current `headRefOid` count. Cancelled, timed-out, startup-failed, stale, action-required, unknown, and overdue missing evidence are actionable. Adjacent or historical green is ignored.',
                '',
              ];
              if (auditError) {
                lines.push('## 🔴 Audit execution failure', '', `\`${clean(auditError).slice(0, 6000)}\``, '', 'The sweep failed closed. No PR-health inference was made.', '');
              }
              lines.push(
                '## Summary', '',
                `- 🔴 Actionable: **${red.length + (auditError ? 1 : 0)}**`,
                `- 🟡 Running/grace: **${pending.length}**`,
                `- 🟢 Exact-head acceptable: **${green.length}**`,
                `- Total open authored PRs: **${classified.length}**`,
                '',
                '## Actionable', '',
                '| State | PR | Exact head | Evidence |',
                '|---|---|---|---|'
              );
              if (auditError) lines.push('| 🔴 | Audit itself failed | — | See execution failure above |');
              else if (red.length) lines.push(...red.map(pr => row(pr, '🔴')));
              else lines.push('| — | None | — | No actionable exact-head CI state detected |');

              lines.push('', '## Running or within attachment grace', '');
              if (pending.length) {
                lines.push('| State | PR | Exact head | Evidence |', '|---|---|---|---|', ...pending.map(pr => row(pr, '🟡')));
              } else {
                lines.push('None.');
              }
              lines.push('', `<details><summary>Exact-head acceptable (${green.length})</summary>`, '');
              for (const pr of green) {
                lines.push(`- [#${pr.number}](${pr.url}) [\`${pr.sha.slice(0, 12)}\`](${headURL(pr)}) — ${clean(pr.title)}`);
              }
              if (!green.length) lines.push('None.');
              lines.push('', '</details>', '');
              const body = lines.join('\n');
              return body.length > 64000 ? `${body.slice(0, 63500)}\n\n> Receipt truncated at GitHub’s issue-body limit.\n` : body;
            }

            try {
              const prs = await fetchPRs();
              const classified = prs.map(classify).sort((a, b) => {
                const rank = {red: 0, pending: 1, green: 2};
                return (rank[a.state] - rank[b.state]) || (b.number - a.number);
              });
              const red = classified.filter(pr => pr.state === 'red');
              const issue = await reconcile(receipt(classified), red.length > 0);
              await core.summary
                .addHeading('Hermes PR exact-head CI watch')
                .addRaw(`${red.length} actionable / ${classified.filter(pr => pr.state === 'pending').length} pending / ${classified.filter(pr => pr.state === 'green').length} green.\n\n`)
                .addLink('Rolling receipt', issue.html_url)
                .write();
              if (red.length) core.setFailed(`${red.length} authored PR(s) have actionable exact-head CI state`);
            } catch (error) {
              const message = `${error.name ?? 'Error'}: ${error.message ?? error}`;
              try {
                const issue = await reconcile(receipt([], message), true);
                core.error(`Failure receipt: ${issue.html_url}`);
              } catch (receiptError) {
                core.error(`Could not reconcile failure receipt: ${receiptError.message ?? receiptError}`);
              }
              core.setFailed(message);
            }
