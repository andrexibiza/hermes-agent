name: Materialize authority-boundary repairs (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: materialize-authority-repair-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["fix/desktop-simple-git-warning-current-main","fix/email-app-password-normalization","fix/memory-prefetch-cancel","campaign/webhook-delivery-callbacks"]'), github.event.pull_request.head.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Execute exact branch carrier
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          case "${HEAD_REF}" in
            fix/desktop-simple-git-warning-current-main)
              carrier=.github/workflows/one-shot-compose-91798.yml
              export FEATURE_HEAD=e90dc2a747d03e124f74b6e41f481d5f296f5119
              ;;
            fix/email-app-password-normalization)
              carrier=.github/workflows/one-shot-fix-86354.yml
              ;;
            fix/memory-prefetch-cancel)
              carrier=.github/workflows/one-shot-fix-88796.yml
              ;;
            campaign/webhook-delivery-callbacks)
              carrier=.github/workflows/one-shot-fix-85644.yml
              ;;
            *)
              echo "unsupported branch: ${HEAD_REF}" >&2
              exit 78
              ;;
          esac

          if [[ ! -f "${carrier}" ]]; then
            echo "Carrier absent: branch is already materialized."
            exit 0
          fi

          export BRANCH="${HEAD_REF}"
          export CURRENT_MAIN="$({ git ls-remote https://github.com/NousResearch/hermes-agent.git refs/heads/main || true; } | awk 'NR==1 {print $1}')"
          test -n "${CURRENT_MAIN}"

          python3 - "${carrier}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text().splitlines()
          starts = [i for i, line in enumerate(lines) if line.strip() == "run: |"]
          if len(starts) != 1:
              raise SystemExit(f"expected one run block in {path}, found {len(starts)}")
          start = starts[0]
          key_indent = len(lines[start]) - len(lines[start].lstrip())
          content_indent = key_indent + 2
          body = []
          for line in lines[start + 1:]:
              if line.strip():
                  indent = len(line) - len(line.lstrip())
                  if indent <= key_indent:
                      break
                  if indent < content_indent:
                      raise SystemExit(f"invalid block indentation in {path}: {line!r}")
                  body.append(line[content_indent:])
              else:
                  body.append("")
          if not body:
              raise SystemExit(f"empty run block in {path}")
          Path("/tmp/materialize.sh").write_text("\n".join(body) + "\n")
          PY

          bash -n /tmp/materialize.sh
          bash /tmp/materialize.sh
